<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Objekt Serial Checker</title>
<style>
  :root {
    --bg: #0f0f11;
    --panel: #18181b;
    --border: #2a2a2f;
    --text: #f4f4f5;
    --muted: #9898a0;
    --accent: #6d5cff;
    --good: #35c08a;
    --bad: #e05a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  form { display: flex; gap: 10px; }
  input[type="text"], input[type="password"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 0 18px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .ghost {
    display: block;
    width: 100%;
    text-align: center;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 12px;
    padding: 11px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #app { display: none; }
  #reader-box {
    margin-top: 16px;
    display: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #reader { width: 100%; }
  .scan-note { color: var(--muted); font-size: 13px; padding: 10px 14px 0; }
  #zoomWrap { display: none; padding: 12px 14px; }
  #zoom { width: 100%; }
  .status { color: var(--muted); font-size: 13px; margin-top: 12px; display: none; }
  .status.show { display: block; }
  .result {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: none;
  }
  .result.show { display: block; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; }
  .row + .row { border-top: 1px solid var(--border); }
  .label { color: var(--muted); }
  .value { font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .pill.good { background: rgba(53,192,138,0.15); color: var(--good); }
  .pill.bad { background: rgba(224,90,106,0.15); color: var(--bad); }
  .error { color: var(--bad); margin-top: 20px; font-size: 14px; display: none; }
  .error.show { display: block; }
  #gateError { margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Login screen -->
  <div id="gate">
    <h1>Objekt Serial Checker</h1>
    <p class="sub">Enter the password to continue.</p>
    <form id="gateForm">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="gateBtn" type="submit">Unlock</button>
    </form>
    <div class="error" id="gateError"></div>
  </div>

  <!-- Main tool (shown after login) -->
  <div id="app">
    <h1>Objekt Serial Checker</h1>
    <p class="sub">Enter a claim ID, or scan the QR on a physical Objekt card.</p>

    <form id="form">
      <input id="claimId" type="text" placeholder="Enter claim ID" autocomplete="off" />
      <button id="btn" type="submit">Check</button>
    </form>

    <button class="ghost" id="scanBtn" type="button">Scan QR</button>

    <label class="ghost" id="uploadLabel">
      Upload a photo of the QR
      <input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none;" />
    </label>

    <div class="status" id="status"></div>

    <div id="reader-box">
      <div id="reader"></div>
      <div id="zoomWrap">
        <div class="scan-note" style="padding:0 0 6px;">Zoom (hold the card further away, then zoom in)</div>
        <input id="zoom" type="range" />
      </div>
      <div class="scan-note" id="scanNote">Fill the frame with the QR and hold steady.</div>
    </div>

    <div class="result" id="result">
      <div class="row"><span class="label">Collection</span><span class="value" id="collection"></span></div>
      <div class="row"><span class="label">Serial</span><span class="value" id="serial"></span></div>
      <div class="row"><span class="label">Claimed</span><span id="claimed"></span></div>
    </div>

    <div class="error" id="error"></div>
  </div>

</div>

<!-- Live camera scanning -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- Strong still-image QR decoding -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  // Point this at your deployed Worker. No trailing slash.
  const WORKER_URL = "https://cosmo-proxy.henrylai543.workers.dev";

  // --- Login / password ----------------------------------------------------
  // The password is never stored in this file. It's typed in, checked by the
  // Worker, and kept only for this browser session.
  let sitePassword = sessionStorage.getItem("objektPw") || "";

  const gate = document.getElementById("gate");
  const appEl = document.getElementById("app");
  const gateForm = document.getElementById("gateForm");
  const passwordInput = document.getElementById("password");
  const gateBtn = document.getElementById("gateBtn");
  const gateError = document.getElementById("gateError");

  function authHeaders() {
    return sitePassword ? { "x-site-password": sitePassword } : {};
  }

  function showApp() {
    gate.style.display = "none";
    appEl.style.display = "block";
  }

  function showGate(msg) {
    appEl.style.display = "none";
    gate.style.display = "block";
    if (msg) { gateError.textContent = msg; gateError.classList.add("show"); }
  }

  // Ask the Worker whether a password is correct.
  async function checkPassword(pw) {
    const res = await fetch(`${WORKER_URL}/?auth=1`, {
      headers: pw ? { "x-site-password": pw } : {},
    });
    return res.ok;
  }

  gateForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = passwordInput.value;
    gateError.classList.remove("show");
    gateBtn.disabled = true;
    gateBtn.textContent = "...";
    try {
      if (await checkPassword(pw)) {
        sitePassword = pw;
        sessionStorage.setItem("objektPw", pw);
        showApp();
      } else {
        gateError.textContent = "Wrong password.";
        gateError.classList.add("show");
      }
    } catch (err) {
      gateError.textContent = "Couldn't reach the server. Try again.";
      gateError.classList.add("show");
    } finally {
      gateBtn.disabled = false;
      gateBtn.textContent = "Unlock";
    }
  });

  // On load: if we already have a saved password that still works, skip login.
  (async () => {
    if (sitePassword && (await checkPassword(sitePassword).catch(() => false))) {
      showApp();
    } else {
      sessionStorage.removeItem("objektPw");
      sitePassword = "";
      showGate();
    }
  })();

  // --- Elements ------------------------------------------------------------
  const form = document.getElementById("form");
  const input = document.getElementById("claimId");
  const btn = document.getElementById("btn");
  const result = document.getElementById("result");
  const errorBox = document.getElementById("error");
  const statusBox = document.getElementById("status");
  const scanBtn = document.getElementById("scanBtn");
  const readerBox = document.getElementById("reader-box");
  const zoomWrap = document.getElementById("zoomWrap");
  const zoom = document.getElementById("zoom");
  const fileInput = document.getElementById("fileInput");

  function setStatus(msg) {
    if (msg) { statusBox.textContent = msg; statusBox.classList.add("show"); }
    else { statusBox.classList.remove("show"); }
  }

  // The QR holds a link like https://link.cosmo.fans/mint?n=XXXX .
  function extractClaimId(text) {
    const t = (text || "").trim();
    try {
      const u = new URL(t);
      for (const key of ["n", "claim_id", "claimId", "id", "token"]) {
        const v = u.searchParams.get(key);
        if (v) return v;
      }
      const segs = u.pathname.split("/").filter(Boolean);
      if (segs.length) return segs[segs.length - 1];
    } catch (e) {}
    return t;
  }

  function handleDecoded(text) {
    setStatus("");
    input.value = extractClaimId(text);
    form.requestSubmit();
  }

  // --- Still-image decoding ------------------------------------------------
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("bad image"));
      img.src = URL.createObjectURL(file);
    });
  }

  function canvasOf(img, targetW, invert) {
    const scale = Math.min(1, targetW / img.naturalWidth) || 1;
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    if (invert) {
      const d = ctx.getImageData(0, 0, w, h);
      const p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        p[i] = 255 - p[i];
        p[i + 1] = 255 - p[i + 1];
        p[i + 2] = 255 - p[i + 2];
      }
      ctx.putImageData(d, 0, 0);
    }
    return canvas;
  }

  async function decodeImageFile(file) {
    const img = await loadImage(file);

    if ("BarcodeDetector" in window) {
      try {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        const found = await detector.detect(img);
        if (found && found.length) return found[0].rawValue;
      } catch (e) {}
    }

    if (window.ZXing && ZXing.BrowserQRCodeReader) {
      const reader = new ZXing.BrowserQRCodeReader();
      for (const invert of [false, true]) {
        try {
          const url = canvasOf(img, img.naturalWidth, invert).toDataURL("image/png");
          const res = await reader.decodeFromImageUrl(url);
          const text = res && (res.text || (res.getText && res.getText()));
          if (text) return text;
        } catch (e) {}
      }
    }

    for (const target of [img.naturalWidth, 2000, 1400, 1000, 700]) {
      const c = canvasOf(img, target, false);
      const ctx = c.getContext("2d");
      const d = ctx.getImageData(0, 0, c.width, c.height);
      const code = jsQR(d.data, c.width, c.height, { inversionAttempts: "attemptBoth" });
      if (code && code.data) return code.data;
    }
    return null;
  }

  // --- Live camera scanning ------------------------------------------------
  let scanner = null;
  let scanning = false;

  function setupCameraControls() {
    try {
      const caps = scanner.getRunningTrackCapabilities();
      if (caps.focusMode && caps.focusMode.includes("continuous")) {
        scanner.applyVideoConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
      }
      if (caps.zoom && typeof caps.zoom.max === "number") {
        zoom.min = caps.zoom.min;
        zoom.max = caps.zoom.max;
        zoom.step = caps.zoom.step || 0.1;
        zoom.value = caps.zoom.min;
        zoomWrap.style.display = "block";
        zoom.oninput = () => {
          scanner.applyVideoConstraints({ advanced: [{ zoom: Number(zoom.value) }] }).catch(() => {});
        };
      }
    } catch (e) {}
  }

  async function startScan() {
    if (scanning) return;
    errorBox.classList.remove("show");
    readerBox.style.display = "block";
    scanBtn.textContent = "Stop scanning";
    scanner = new Html5Qrcode("reader", {
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    try {
      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: 250,
          videoConstraints: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        },
        async (decodedText) => {
          await stopScan();
          handleDecoded(decodedText);
        },
        () => {}
      );
      scanning = true;
      setupCameraControls();
    } catch (err) {
      readerBox.style.display = "none";
      scanBtn.textContent = "Scan QR";
      errorBox.textContent = "Couldn't start the camera: " + err;
      errorBox.classList.add("show");
    }
  }

  async function stopScan() {
    if (scanner) {
      try { await scanner.stop(); } catch (e) {}
      try { scanner.clear(); } catch (e) {}
      scanner = null;
    }
    scanning = false;
    readerBox.style.display = "none";
    zoomWrap.style.display = "none";
    scanBtn.textContent = "Scan QR";
  }

  scanBtn.addEventListener("click", () => {
    scanning ? stopScan() : startScan();
  });

  fileInput.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    errorBox.classList.remove("show");
    await stopScan();
    setStatus("Reading photo...");
    try {
      const text = await decodeImageFile(file);
      if (text) {
        handleDecoded(text);
      } else {
        setStatus("");
        errorBox.textContent =
          "Couldn't find a QR. Get closer so the QR fills most of the frame, keep it flat, sharp and glare-free, then try again.";
        errorBox.classList.add("show");
      }
    } catch (err) {
      setStatus("");
      errorBox.textContent = "Couldn't read that image.";
      errorBox.classList.add("show");
    } finally {
      fileInput.value = "";
    }
  });

  // --- Lookup --------------------------------------------------------------
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = input.value.trim();
    if (!id) return;

    result.classList.remove("show");
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "...";

    try {
      const res = await fetch(`${WORKER_URL}/?claim_id=${encodeURIComponent(id)}`, {
        headers: authHeaders(),
      });

      if (res.status === 401) {
        showGate("Session expired. Log in again.");
        return;
      }

      const data = await res.json();
      if (!res.ok || data.error) {
        throw new Error(data.error || `Request failed (${res.status})`);
      }

      document.getElementById("collection").textContent = data.collectionId ?? "-";
      document.getElementById("serial").textContent =
        data.objektNo != null ? "#" + data.objektNo : "-";

      const claimed = document.getElementById("claimed");
      if (data.isClaimed === true) {
        claimed.className = "pill good";
        claimed.textContent = "Claimed";
      } else if (data.isClaimed === false) {
        claimed.className = "pill bad";
        claimed.textContent = "Unclaimed";
      } else {
        claimed.className = "value";
        claimed.textContent = "-";
      }

      result.classList.add("show");
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
    } finally {
      btn.disabled = false;
      btn.textContent = "Check";
    }
  });
</script>
</body>
</html>
