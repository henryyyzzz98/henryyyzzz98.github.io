<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight: Idol Life Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150f1d;--panel:#211930;--panel2:#2b2140;--line:#3a2d52;--ink:#f7f0fd;--muted:#b4a6c8;
  --pink:#ff5fa2;--violet:#9b7bff;--mint:#5fe3c0;--gold:#ffd166;--red:#ff6b6b;--sky:#5fb7e8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(1200px 600px at 80% -10%,#3a1f4d 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#2a1640 0,transparent 60%),var(--bg);min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
.display{font-family:"Bagel Fat One",Outfit,sans-serif;letter-spacing:.5px}
#app{max-width:1180px;margin:0 auto;padding:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* title */
.title-wrap{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.logo{font-size:clamp(42px,9vw,84px);line-height:1;background:linear-gradient(90deg,var(--pink),var(--violet),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:16px;color:var(--muted);max-width:440px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(90deg,var(--pink),var(--violet));border:0;color:#fff;box-shadow:0 6px 24px #ff5fa255}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* creation */
.create{display:grid;grid-template-columns:300px 1fr;gap:14px}
@media(max-width:780px){.create{grid-template-columns:1fr}.preview{position:relative!important;top:0}.preview svg{max-width:220px}}
.preview{position:sticky;top:12px;align-self:start;text-align:center}
.preview svg{width:100%;max-width:260px}
.field{margin-bottom:16px}
.field>label{display:block;font-weight:700;margin-bottom:7px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.txt{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.cos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:600px){.cos{grid-template-columns:1fr}}
.co{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px}
.co.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.co b{display:block}.co small{color:var(--gold);font-weight:600}.co p{margin:5px 0 0;font-size:13px;color:var(--muted)}

/* game */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hud .brand{font-size:22px;background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hud .date{display:flex;flex-direction:column;line-height:1.1}
.hud .date span{font-size:12px;color:var(--muted)}
.pill{border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.pill.ph-trainee{background:#3b2a12;border-color:#7a5a1a;color:var(--gold)}
.pill.ph-predebut{background:#13324a;border-color:#2a6aa0;color:var(--sky)}
.pill.ph-idol{background:#4a1430;border-color:#a0306a;color:#ff9cc8}
.hud .sp{flex:1}
.icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-weight:700}
.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:12px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:520px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{position:relative;text-align:left;background:#1a1326;border:1px dashed var(--line);border-radius:12px;padding:8px 22px 8px 9px;min-height:58px;display:flex;flex-direction:column;gap:3px}
.slot small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.slot b{font-size:13px;font-weight:600;color:var(--muted)}
.slot.filled{border-style:solid;background:var(--panel2)}.slot.filled b{color:var(--ink)}
.slot.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.slot.warn b{color:#ff9a9a}
.slot .x{position:absolute;top:5px;right:6px;font-size:11px;color:var(--muted);padding:2px 4px;border-radius:6px}
.slot .x:hover{color:#fff;background:#0004}
.act.chosen{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}
.go-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}.go-row .repeat{margin-top:0}
.tl{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.tlr{display:flex;gap:8px;font-size:13.5px;line-height:1.35}.tlr.free{opacity:.6}.tle{width:20px;flex:none}
.tlr .muted{font-size:12.5px}
.st{font-size:12px;color:var(--muted);margin-top:3px}.st.best{color:var(--gold)}
.ph-mgr{background:#13324a;border:1px solid #2a6aa0;color:var(--sky)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,100%)}@media(max-width:560px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center}.mode p{margin:0 0 4px;font-size:14px}
.gcard{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}.gcard:last-child{border:0;margin:0}
.prog{display:flex;gap:3px;margin-top:4px}.prog i{width:18px;height:4px;border-radius:3px;background:#0f0b16}.prog i.on{background:var(--pink)}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.scene{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0e0a14;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.ticker{display:flex;gap:8px;flex-wrap:wrap}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.tk b{color:var(--gold)}
.today h3{margin:0 0 6px;font-size:16px}
.today ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.today li{margin:3px 0}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dl{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:#1e3a33;color:var(--mint)}
.dl.neg{background:#45202a;color:#ff9a9a}
.dl.bad{background:#45202a;color:#ff9a9a}.dl.good{background:#1e3a33;color:var(--mint)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.quick{grid-template-columns:repeat(2,1fr)}}
.qs{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.qs small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.qs b{font-size:16px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{font-size:12px}
.bar .tr{height:8px;border-radius:6px;background:#0f0b16;overflow:hidden;margin-top:3px}
.bar .fl{height:100%;border-radius:6px}
.acts h4{margin:10px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.acts h4:first-child{margin-top:0}
.grid-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.act{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;transition:transform .08s,border-color .15s}
.act:hover{border-color:var(--pink);transform:translateY(-1px)}
.act .t{font-weight:700;font-size:14px}
.act .s{font-size:11.5px;color:var(--muted)}
.act.hot{border-color:var(--gold);background:linear-gradient(135deg,#3d2a12,#2b2140)}
.repeat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px}
.tab.on{background:var(--violet);border-color:var(--violet);color:#fff}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media(max-width:480px){.statgrid{grid-template-columns:1fr}}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:12px 0 8px;font-weight:700}
.sec-t:first-child{margin-top:2px}
.mem{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel2);margin-bottom:7px}
.mem svg{width:52px;height:64px;flex:none;background:#160f20;border-radius:10px}
.mem .i{flex:1;min-width:0}
.mem .n{font-weight:700}.mem .p{font-size:12px;color:var(--muted)}
.hearts{color:var(--pink);font-size:12px;letter-spacing:1px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.diary{max-height:360px;overflow:auto;font-size:13.5px}
.diary div{padding:6px 0;border-bottom:1px dashed var(--line)}
.diary b{color:var(--violet);font-weight:700;margin-right:6px}
.grade{display:inline-block;font-weight:800;border-radius:6px;padding:0 6px}
.g-S{background:var(--gold);color:#2a1a00}.g-A{background:var(--pink);color:#fff}.g-B{background:var(--violet);color:#fff}.g-C{background:#556;color:#fff}.g-D{background:#433;color:#fbb}

/* modal */
.modal{position:fixed;inset:0;background:#07040bcc;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal-card{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal-card h2{margin:0 0 8px;font-size:22px}
.modal-card .art{border-radius:14px;overflow:hidden;margin:-4px 0 12px;line-height:0;border:1px solid var(--line)}
.modal-card .art svg{width:100%;height:auto}
.modal-card p{line-height:1.5;margin:8px 0}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-weight:700}
.choice:hover:not(:disabled){border-color:var(--pink)}
.choice small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.choice.primary{background:linear-gradient(90deg,var(--pink),var(--violet));border:0;color:#fff;text-align:center}
.choice:disabled{opacity:.45;cursor:not-allowed}
.big-num{font-size:40px;font-weight:800;color:var(--gold);line-height:1}
.result-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.result-row .qs{flex:1;min-width:100px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:.2}}

/* svg anims */
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.beam{animation:sway 5s ease-in-out infinite;transform-box:view-box}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.ls{animation:tw 1.1s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.ending{max-width:640px;margin:20px auto;text-align:center}
.ending .art{border-radius:18px;overflow:hidden;line-height:0;border:1px solid var(--line);margin-bottom:14px}
.ending .art svg{width:100%;height:auto}
.ending h1{font-size:clamp(30px,6vw,46px);margin:6px 0}
.ending .sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;text-align:left}
@media(max-width:480px){.ending .sumgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<script>
"use strict";
/* ============ utilities ============ */
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const won=n=>'₩'+fmt(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='spotlight-idol-sim-v1';
const START=new Date(2027,0,4);
const dateOf=d=>{const x=new Date(START);x.setDate(x.getDate()+d-1);return x};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dstr=d=>{const x=dateOf(d);return `${WD[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]} ${x.getFullYear()}`};
const shortDate=d=>{const x=dateOf(d);return `${x.getDate()} ${MON[x.getMonth()]} ${x.getFullYear()}`};
const yearOf=d=>dateOf(d).getFullYear();

/* ============ data ============ */
const COMPANIES={
  star:{name:'Starfield Entertainment',tag:'Big agency',desc:'Brutal monthly evaluations, but a huge budget and promotion power once you debut.',base:16,step:3.8,cap:78,minMonths:6,budget:15,fameStart:12,fanStart:9000,debt:120000000},
  blue:{name:'Bluebell Music',tag:'Mid-size agency',desc:'Balanced training, a decent budget and a steady path.',base:13,step:3.3,cap:72,minMonths:4,budget:9,fameStart:6,fanStart:4000,debt:70000000},
  pebble:{name:'Pebble Records',tag:'Small agency',desc:'Gentler evaluations and creative freedom (faster producing growth), but you start from nothing.',base:10,step:2.9,cap:66,minMonths:3,budget:3,fameStart:2,fanStart:800,debt:30000000,produceBonus:1.4}
};
const SPECIALTIES={vocal:'Vocal',dance:'Dance',rap:'Rap',visual:'Visual',allround:'All-rounder',produce:'Producer'};
const HAIR_G={long:'Long',bob:'Bob',ponytail:'Ponytail',twin:'Twin tails',short:'Pixie cut'};
const HAIR_B={short:'Short',curtain:'Curtain bangs',sidepart:'Side part',twoblock:'Two-block',wolf:'Wolf cut'};
const HAIR_COLORS=['#2b1d1a','#5a3825','#c99a5b','#f4d58d','#e85d9a','#8e7cf0','#5fb7e8','#e9e4f0','#b23a48'];
const SKIN=['#ffe6d4','#f6cfae','#e8b48f','#c98e6a','#9a6748','#6e4630'];
const EYES=['#3b2a20','#6a4430','#2f4f7f','#4a7d4e','#7a4fb5'];
const OUTFITS=['#ff5fa2','#9b7bff','#5fe3c0','#ffd166','#3d8bfd','#f4f1f8','#2a2333','#ff8a5c'];
const CONCEPTS={fresh:{n:'Fresh & bright',c:'#5fe3c0'},crush:{n:'Dark charisma',c:'#ff4d6d'},dreamy:{n:'Dreamy fantasy',c:'#9b7bff'},retro:{n:'Retro pop',c:'#ffd166'},cute:{n:'Cute & bubbly',c:'#ff8fc7'}};
const SHOWS={2:'The Show Up',3:'Champ Stage',4:'M Pulse',5:'Music Express',6:'Core Beat',0:'Popular Live'};
const LABEL={vocal:'Vocal',dance:'Dance',rap:'Rap',visual:'Visual',variety:'Variety',charm:'Charm',produce:'Producing',stamina:'Stamina',stress:'Stress',health:'Health'};
const SKILLS=['vocal','dance','rap','visual','variety','charm','produce'];
const POS_OF={vocal:'Main Vocalist',dance:'Main Dancer',rap:'Main Rapper',visual:'Visual & Center',produce:'Producer & Vocalist'};
const NAMES_G=['Seoa','Lumi','Dahee','Nari','Yeseul','Hana','Riwon','Sena','Jiyu','Bomi','Arin','Soyul','Haneul','Dain','Ara','Gaeun','Somin','Yuha','Rina','Mirae','Seri','Hayeon','Jian','Bora'];
const NAMES_B=['Taeoh','Junseo','Hajun','Riku','Doyun','Seojin','Kaito','Yechan','Gyuwon','Eden','Sion','Hyunwoo','Minjae','Seungho','Jiwan','Haru','Ian','Woobin','Jiho','Chanyul','Dowon','Eunho','Gunwoo','Yoonho'];
const ALBUM_A=['Midnight','Neon','Paper','Velvet','Summer','Electric','Crystal','Golden','Silver','Pink','Blue','Lucky','Wild','Secret','Starlit','Cherry'];
const ALBUM_B=['Heart','Signal','Dream','Rush','Bloom','Diary','Galaxy','Fever','Garden','Wave','Runway','Promise','Echo','Candy','Flame','Orbit'];
const GROUP_A=['STAR','LUNA','NOVA','AURA','VIVID','ECLIPSE','PRISM','HALO','BLOOM','ZEN','ORBIT','KISMET'];
const GROUP_B=['','IX','BEAT','LIGHT','X','ON','UP','DAY','RISE','WAVE'];
const albumName=()=>`${pick(ALBUM_A)} ${pick(ALBUM_B)}`;
const groupName=()=>{const b=pick(GROUP_B);return b?`${pick(GROUP_A)}${Math.random()<.5?' ':''}${b}`:pick(GROUP_A)};

/* ============ state ============ */
let S=null,Q=[],D={},NOTES=[];
let UI={tab:'stats',repeat:false,today:null,scene:null};
const CO=()=>S.coName?{...COMPANIES[S.company],name:S.coName}:COMPANIES[S.company];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}

function randomLook(g){
  return {g,hairStyle:pick(g==='girl'?['long','bob','ponytail','twin','long','bob','short']:Object.keys(HAIR_B)),hair:pick(HAIR_COLORS),skin:pick(SKIN),eye:pick(EYES),outfit:pick(OUTFITS)};
}
function makeMembers(type,n){
  let pool=type==='girl'?NAMES_G.map(x=>[x,'girl']):type==='boy'?NAMES_B.map(x=>[x,'boy']):NAMES_G.map(x=>[x,'girl']).concat(NAMES_B.map(x=>[x,'boy']));
  if(type==='coed'){const g=shuffle(pool.filter(x=>x[1]==='girl')),b=shuffle(pool.filter(x=>x[1]==='boy'));pool=[];for(let i=0;i<24;i++)pool.push(i%2?b[i>>1]:g[i>>1]);pool=pool.slice(0,n).concat(pool.slice(n))}
  const K=['worrier','rival','joker','perfectionist','dreamer','quiet'];let arcs=[];while(arcs.length<n)arcs=arcs.concat(shuffle(K));return (type==='coed'?shuffle(pool.slice(0,n)):shuffle(pool).slice(0,n)).map(([name,g],i)=>({name,g,look:randomLook(g),skill:R(13,22),bond:RI(25,45),pos:'',arc:arcs[i],ch:0,sp:0,best:false}));
}
function newGame(c){
  const st={vocal:R(8,12),dance:R(8,12),rap:R(6,10),visual:R(10,14),variety:R(6,10),charm:R(10,14),produce:R(3,6)};
  if(c.spec==='allround'){['vocal','dance','rap','visual'].forEach(k=>st[k]+=6)}
  else if(c.spec==='produce'){st.produce+=16;st.vocal+=4}
  else st[c.spec]+=14;
  const coName=(c.coName||'').trim().slice(0,30);const co={...COMPANIES[c.company],name:coName||COMPANIES[c.company].name};
  if(c.jump){Object.keys(st).forEach(k=>st[k]+=R(20,26));if(c.spec!=='allround')st[c.spec==='produce'?'produce':c.spec]+=8;Object.keys(st).forEach(k=>st[k]=clamp(st[k]))}
  const n=c.size?clamp(c.size-1,1,23):{star:RI(4,6),blue:RI(3,5),pebble:RI(2,4)}[c.company];
  S={v:1,name:c.name||'Kim Hana',stage:c.stage||'HANA',type:c.type,look:{...c.look},company:c.company,coName:coName||null,spec:c.spec,

/* ============ deltas ============ */
function rec(k,v){if(Math.abs(v)<0.05)return;D[k]=(D[k]||0)+v}
function note(t){NOTES.push(t)}
function log(t){S.log.unshift({d:S.day,t});if(S.log.length>300)S.log.pop()}
function fatigue(){let m=1;if(S.cond.stamina<15)m*=.5;if(S.cond.stress>80)m*=.75;if(S.cond.health<35)m*=.7;return m}
function addStat(k,a){const b=S.stats[k];let g=a*MUL;if(a>0)g=a*MUL*Math.pow(Math.max(0,1-b/104),1.4)*1.25*fatigue()*(k==='produce'&&CO().produceBonus?CO().produceBonus:1)*(k==='produce'&&perk('dreamer')?1.15:1)*(['vocal','dance','rap'].includes(k)&&perk('rival')?1.1:1);S.stats[k]=clamp(b+g);rec(LABEL[k],S.stats[k]-b)}
function addCond(k,a){const b=S.cond[k];S.cond[k]=clamp(b+a*MUL);rec(LABEL[k],S.cond[k]-b)}
function addFame(x){x*=MUL;const b=S.fame;S.fame=clamp(b+(x>0?x*Math.pow(1-b/105,1.3):x));rec('Fame',S.fame-b)}
function addFans(n){n=Math.round(n*MUL);const b=S.fans;S.fans=Math.max(0,S.fans+n);rec('Fans',S.fans-b)}
function addCeo(n){const b=S.rel.ceo;S.rel.ceo=clamp(b+n);rec('CEO trust',S.rel.ceo-b)}
function bondAll(n){n*=MUL;S.members.forEach(m=>m.bond=clamp(m.bond+n*R(.6,1.3)));rec('Member bond',n)}
function earn(n){n=Math.round(n*MUL);S.earned+=n;if(S.debt>0){const p=Math.min(S.debt,n);S.debt-=p;rec('Debt paid',p);n-=p;if(S.debt<=0&&!S.flags.debtFree){S.flags.debtFree=true;note('🎉 Your trainee debt is fully paid off! From now on, earnings go to your wallet.');log('Paid off all trainee debt to the company.')}}if(n>0){S.wallet+=n;rec('Wallet',n)}}
function spend(n){S.wallet-=n;rec('Wallet',-n)}
function skillScore(){const s=S.stats;const t=[s.vocal,s.dance,s.rap,s.visual].sort((a,b)=>b-a);return (t[0]+t[1]+t[2])/3*.85+s.charm*.15}
function groupPower(){return (skillScore()+S.members.reduce((a,m)=>a+m.skill,0))/(S.members.length+1)}
function mood(){if(S.cond.stress>75)return'sad';if(S.cond.stamina<22||S.cond.health<35)return'tired';return'happy'}
function gColor(){return S.group?CONCEPTS[S.group.concept].c:'#ff5fa2'}
function isPromo(){return S.era&&S.era.status==='promo'}
function isPrep(){return S.era&&S.era.status==='prep'}
const yrs=()=>S.group?(S.day-S.group.debutDay)/365:0;

function storyReady(m){return m.ch<5&&m.bond>=TH[m.ch]&&S.day-(m.lastCh||-99)>=3}
function oneOnOne(i){
  const m=S.members[i],b=m.bond;m.bond=clamp(b+R(7,11)*MUL);rec(`Bond · ${m.name}`,m.bond-b);addCond('stress',-6);addCond('stamina',-3);
  note(pick([`You and ${m.name} got late-night snacks and talked about everything.`,`${m.name} showed you their favourite hidden café.`,`You helped ${m.name} practise their part and swapped stories.`,`You and ${m.name} walked along the Han River.`]));
  if(storyReady(m)&&!Q.some(q=>q.story===m.name))Q.push(storyModal(m));
}
function storyModal(m){
  const arc=ARCS[m.arc],c=arc.ch[m.ch],idx=S.members.indexOf(m);
  return {story:m.name,title:`${esc(m.name)} · Chapter ${m.ch+1}: ${F(c.t,m)}`,art:scene(c.sc||'dorm',{duo:idx}),
    body:`<p class="muted" style="margin-top:-2px">${arc.n} · Friendship story ${m.ch+1}/5</p><p>${F(c.txt,m)}</p>`,
    choices:c.c.map(([l,sp,bd,r,fx])=>({label:F(l,m).replace(/&#39;/g,"'").replace(/&amp;/g,'&'),fn(){
      m.sp+=sp;const b=m.bond;m.bond=clamp(b+bd);rec(`Bond · ${m.name}`,m.bond-b);if(fx)fx();
      if(r)note(F(r,m).replace(/&#39;/g,"'").replace(/&amp;/g,'&'));
      m.ch++;m.lastCh=S.day;if(m.ch>=5)finishArc(m);else log(`Friendship with ${m.name}: chapter ${m.ch} complete.`);
    }}))};
}
function finishArc(m){
  const arc=ARCS[m.arc];
  if(m.sp>=6){m.best=true;log(`${m.name} became your best friend. (${arc.perk})`);
    Q.push({title:`Best friends with ${esc(m.name)} ✨`,art:scene('dorm',{duo:S.members.indexOf(m),big:true}),confetti:true,body:`<p>Through every chapter, you showed up for ${esc(m.name)}. Now they'd do anything for you too.</p><p><b>Friendship perk unlocked:</b> ${arc.perk}.</p>`});
  }else{log(`Became close friends with ${m.name}.`);
    Q.push({title:`Close friends with ${esc(m.name)}`,art:scene('dorm',{duo:S.members.indexOf(m)}),body:`<p>You and ${esc(m.name)} have been through a lot. You're close — even if you weren't always there when it mattered most.</p><p class="muted">Best-friend perks need the kindest choices in most chapters. Maybe with the next member…</p>`});}
}

  const perf=skillScore()*.5+e.readiness*.2+S.cond.stamina*.15+R(0,15)-(S.cond.stress>75?8:0);
  addCond('stamina',-22);addCond('stress',5);addFame(.04+perf/420);addFans((150+S.fame*60)*R(.7,1.3));earn(300000*(1+S.fame/30));
  const my=e.quality*.45+S.fame*.4+Math.min(10,S.fans/60000)+R(0,15)+(perf>70?4:0)+(e.rank<=10?4:0);
  const rival=62+R(0,45)+Math.min(8,yrs()*2);
  if(my>rival){
    S.wins++;e.wins++;const y=yearOf(S.day);S.yearWins[y]=(S.yearWins[y]||0)+1;addFame(.6);addFans(2000+S.fame*200);addCeo(3);
    note(`🏆 1st place on ${show}! Win #${S.wins}.`);log(`Won 1st place on ${show} with "${e.title}" (win #${S.wins}).`);
    Q.push({title:`🏆 1st place on ${show}!`,art:scene('stage',{members:true,big:true,mic:true,caption:`${show} · ${S.group.name} wins`}),confetti:true,
      body:`<p>The MC calls <b>${esc(S.group.name)}</b>. ${e.wins===1?`It's the first win for "${esc(e.title)}"!`:`That's win #${e.wins} for "${esc(e.title)}".`} ${S.wins===1?'Your first music show win ever — the members are sobbing through the encore.':'You sing the encore while confetti rains down.'}</p>`});
  }else note(`You performed on ${show}. ${perf>70?'Fans are calling it a legendary stage.':'A clean performance.'} No win this time.`);
}

/* ============ day loop ============ */
function emptyPlan(){return {morning:null,afternoon:null,night:null,midnight:null}}
function runDay(){
  const acts=allActs(),tl=[],used=new Set();let last=null;
  for(const [k,lab,em] of SLOTS){
    const id=S.plan[k];NOTES=[];
    const a=id&&acts.find(x=>x.id===id);
    if(a&&a.avail()&&a.slots.includes(k)&&!(a.once&&used.has(id))){
      used.add(id);MUL=a.w||.42;a.run();MUL=1;
      last={name:a.scene,members:a.members,mic:a.mic,duo:a.duo,time:k};
      tl.push({em,lab,t:T(a.label),notes:NOTES.slice()});
    }else{
      if(k!=='midnight'){S.cond.stamina=clamp(S.cond.stamina+4);S.cond.stress=clamp(S.cond.stress-2)}
      tl.push({em,lab,t:k==='midnight'?'Sleep':'Free time',notes:id?['(Your planned activity wasn\'t available.)']:[],free:true});
    }
  }
  NOTES=[];endDay(!tl[3].free);
  return {tl,last,extra:NOTES.slice()};
}
function restDay(){NOTES=[];MUL=1;A.recover.run();const tl=[{em:'🩹',lab:'All day',t:'Recovering',notes:NOTES.slice()}];NOTES=[];endDay(false);return {tl,last:{name:'hospital'},extra:NOTES.slice()}}
function doDay(){
  if(Q.length||S.ending)return;
  D={};let days=0,res=null,extra=[];
  const n=UI.repeat?7:1;
  for(let i=0;i<n;i++){
    if(i>0&&S.forcedRest>0)break;
    res=S.forcedRest>0?restDay():runDay();days++;extra=extra.concat(res.extra);
    if(res.last)UI.scene=res.last;
    if(Q.length||S.ending)break;
  }
  UI.today={title:days>1?`${days} days · last: ${dstr(S.day-1)}`:dstr(S.day-1),tl:res.tl,lines:extra.slice(-8),d:D};
  save();render();showModal();
}
function endDay(midUsed){
  S.cond.stamina=clamp(S.cond.stamina+(midUsed?6:20)+(perk('quiet')?3:0));S.cond.stress=clamp(S.cond.stress-2-(perk('worrier')?1:0)+(midUsed?2:0));
  if(S.cond.stamina<=0)addCond('health',-6);
  S.members.forEach(m=>m.skill=clamp(m.skill+R(.05,.2)*(1-m.skill/110)));
  if(S.forcedRest>0)S.forcedRest--;
  S.offers=S.offers.filter(o=>o.exp>S.day);
  if(S.phase==='idol')idolDaily();
  if(S.phase!=='trainee'&&S.fame>2&&Math.random()<.5)S.fans+=Math.round(S.fame*S.fame*.15);
  if(S.cond.stress>=95)S.burnDays++;else S.burnDays=0;
  if(S.burnDays>=4){S.burnDays=0;burnout()}
  else if(S.cond.health<=0){S.cond.health=30;S.forcedRest=6;if(S.phase==='idol')addFame(-2);note('🚑 You collapsed from exhaustion. Doctors ordered a week of rest.');log('Collapsed from exhaustion and was ordered to rest.');Q.push({title:'Ordered to rest',art:scene('hospital',{mood:'tired'}),body:'<p>You pushed your body too far and collapsed after a schedule. The doctor ordered a full week off — no practice, no schedules.</p><p class="muted">Keep an eye on stamina and health. Training at low stamina gives smaller gains and wears down your health.</p>'})}
  else if(S.cond.stamina<12&&Math.random()<.25){addCond('health',-18);S.forcedRest=2;note('You twisted your ankle from fatigue. Two days of rest.');log('Minor injury from fatigue.')}
  if(!Q.length&&S.forcedRest<=0&&Math.random()<(S.phase==='trainee'?.12:.13))randomEvent();
  S.day++;
  morning();
  checkEndings();
}
function morning(){
  const dt=dateOf(S.day);
  if(dt.getDate()===1)monthly();
  if(S.phase==='trainee'&&(S.day-S.trainee.start)%28===0&&S.day>1)evaluation();
  if(S.phase==='predebut'&&S.day>=S.era.release)debut();
  else if(S.phase==='idol'){
    const e=S.era;
    if(e.status==='promo'&&S.day>e.end)wrapEra();
    else if(e.status==='break'&&S.day>=e.next)startPrep();
    else if(e.status==='prep'&&S.day>=e.release)release();
    if(dt.getMonth()===11&&dt.getDate()===31)awards();
    if(!S.flags.contract&&S.day-S.group.debutDay>=2555)contractTalk();
  }
}
function monthly(){
  if(S.phase==='idol'){const inc=S.monthSales*220+S.fame*S.fame*900;if(inc>0){const before=S.debt;earn(inc);note(`💰 Monthly settlement: ${won(inc)}${before>0?' (goes toward your trainee debt first)':''}.`)}S.monthSales=0}
  else{S.wallet+=200000;note('Your family sent ₩200,000 pocket money.')}
}
function idolDaily(){
  const e=S.era;
  if(e.status==='promo'){
    const days=S.day-e.start;
    const score=e.quality*.5+S.fame*.6+R(-5,5)-days*.9;
    e.rank=clamp(Math.round(150-score*1.6),1,200);e.peak=Math.min(e.peak,e.rank);
    const sales=Math.max(0,(210-e.rank))*R(15,35)*(1+S.fame/25)*(days<7?1.6:1);
    e.sales+=Math.round(sales);S.monthSales+=sales;
    S.fame=clamp(S.fame+(e.rank<=10?.07:e.rank<=50?.03:.005)*(1-S.fame/105));
    S.fans+=Math.round((S.fame*S.fame*.5)*(e.rank<=20?1.5:1));
  }else if(e.status==='break'){S.fame=clamp(S.fame-.05)}
}

/* ============ trainee evaluation ============ */
function evaluation(){
  const t=S.trainee,co=CO();t.month++;
  const thr=Math.min(co.cap,co.base+co.step*t.month);
  const s=S.stats;
  let score=skillScore()+(S.rel.ceo-50)*.06+R(-7,7)-(S.cond.stress>75?6:0)-(S.cond.health<40?5:0);
  const margin=score-thr,rank=clamp(Math.round(15-margin*.7),1,30),pass=rank<=15;
  t.ranks.push(rank);
  const sk=['vocal','dance','rap','visual','variety','charm'];
  const best=sk.reduce((a,b)=>s[a]>s[b]?a:b),worst=['vocal','dance','rap'].reduce((a,b)=>s[a]<s[b]?a:b);
  if(pass){t.fails=0;addCeo(rank<=3?5:2)}else{t.fails++;addCeo(-3)}
  t.topStreak=rank<=3?t.topStreak+1:0;
  const chosen=t.month>=co.minMonths&&(t.topStreak>=2||(t.month>=18&&rank<=6));
  log(`Monthly evaluation #${t.month}: ranked ${rank}/30 — ${pass?'passed':'failed'}.`);
  const verdict=pass?(rank<=3?'Outstanding. Keep this up and the CEO will notice.':'You pass. Keep pushing.'):(t.fails>=3?'That is three failed evaluations in a row.':`You fail this month. ${3-t.fails} more fail${3-t.fails===1?'':'s'} in a row and your contract ends.`);
  Q.push({title:`Monthly Evaluation #${t.month}`,art:scene('practice',{caption:`Evaluation · ${shortDate(S.day)}`,mood:pass?'happy':'sad'}),
    body:`<div class="result-row"><div class="qs"><small>Rank</small><b class="big-num">${rank}</b><span class="muted"> / 30</span></div><div class="qs"><small>Your score</small><b>${score.toFixed(1)}</b></div><div class="qs"><small>Pass line</small><b>${thr.toFixed(1)}</b></div></div>
    <p><b>Judges:</b> "Your ${LABEL[best].toLowerCase()} stands out. ${s[worst]<thr?`Your ${LABEL[worst].toLowerCase()} is holding you back.`:'Nice balance overall.'}"</p><p>${verdict}</p>${!pass||t.month<co.minMonths?'':`<p class="muted">Debut teams are picked from trainees who rank top 3 two months in a row${t.month<co.minMonths?` (after ${co.minMonths} months)`:''}.</p>`}`});
  if(chosen&&t.fails<3)Q.push(debutPick());
}
function debutPick(){
  const def=groupName();
  return {title:'You\'re debuting! 🎉',art:scene('office',{members:true,big:true,caption:'The CEO\'s office'}),confetti:true,
    body:`<p>The CEO calls you and ${S.members.map(m=>esc(m.name)).join(', ')} into the office. "You'll debut together in three weeks."</p>
    <div class="field"><label>Group name</label><input class="txt" id="gname" maxlength="18" value="${esc(def)}"></div>
    <div class="field"><label>Debut concept</label><select class="txt" id="gconcept">${Object.entries(CONCEPTS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></div>
    <div class="field"><label>Debut single title</label><input class="txt" id="gsong" maxlength="24" value="${esc(albumName())}"></div>`,
    choices:[{label:'Let\'s debut!',primary:true,fn(){
      const name=(document.getElementById('gname').value.trim()||def).slice(0,18),concept=document.getElementById('gconcept').value,song=(document.getElementById('gsong').value.trim()||albumName()).slice(0,24);
      setupGroup(name,concept,song);
    }}]};
}
function setupGroup(name,concept,song){
  const s=S.stats;const best=['vocal','dance','rap','visual','produce'].reduce((a,b)=>s[a]>s[b]?a:b);
  const leader=S.rel.ceo>=60||s.charm>=Math.max(...S.members.map(m=>m.skill))*0.9;
  S.position=(leader?'Leader & ':'')+POS_OF[best];
  const left=shuffle(['Lead Vocalist','Lead Dancer','Sub Vocalist','Lead Rapper','Visual','Sub Vocalist','Performer'].filter(p=>!POS_OF[best].includes(p.split(' ')[1]||'')));
  S.members.forEach((m,i)=>m.pos=(i===S.members.length-1?'Maknae · ':'')+(!leader&&i===0?'Leader · ':'')+left[i%left.length]);
  S.group={name,concept,debutDay:S.day+21};
  S.phase='predebut';
  S.era={status:'prep',n:0,title:song,readiness:0,release:S.day+21,start:0,end:0,quality:0,rank:200,peak:200,sales:0,wins:0};
  log(`Selected to debut in ${name} as ${S.position}. Debut single: "${song}".`);
  note(`You'll debut in ${name} on ${shortDate(S.day+21)}. Use Group practice and Recording to raise readiness.`);
}

/* ============ eras ============ */
function computeQuality(){const e=S.era,co=CO();return clamp(28+groupPower()*.38+e.readiness*.16+co.budget+(S.stats.produce>50?(S.stats.produce-50)*.25:0)+(perk('dreamer')?4:0)+R(-6,8),20,100)}
const grade=q=>q>=88?'S':q>=75?'A':q>=60?'B':q>=45?'C':'D';
function debut(){
  const co=CO(),e=S.era;S.phase='idol';
  e.quality=computeQuality();e.status='promo';e.start=S.day;e.end=S.day+28;e.n=1;
  addFame(co.fameStart+e.readiness/12);addFans(co.fanStart+e.readiness*60);
  const first=Math.round(S.fans*R(.2,.35)+co.budget*600);e.sales=first;S.monthSales+=first;e.rank=clamp(Math.round(150-(e.quality*.5+S.fame*.6)*1.6),1,200);e.peak=e.rank;
  log(`DEBUT DAY! ${S.group.name} released "${e.title}".`);
  Q.push({title:`${S.group.name} debuts!`,art:scene('stage',{members:true,big:true,mic:true,caption:`Debut showcase · ${shortDate(S.day)}`}),confetti:true,
    body:`<p>The lights come up on your debut showcase. "${esc(e.title)}" is out now.</p><div class="result-row"><div class="qs"><small>Song quality</small><b><span class="grade g-${grade(e.quality)}">${grade(e.quality)}</span> ${e.quality.toFixed(0)}</b></div><div class="qs"><small>First-week sales</small><b>${fmt(first)}</b></div><div class="qs"><small>Melodi chart</small><b>#${e.rank}</b></div></div>
    <p>You're the <b>${esc(S.position)}</b>. Promotions run for 4 weeks — perform on music shows (Tue–Sun) for a shot at 1st place.</p>`});
}
function wrapEra(){
  const e=S.era;
  S.albums.push({n:e.n,title:e.title,q:e.quality,peak:e.peak,sales:e.sales,wins:e.wins,y:yearOf(e.start)});
  log(`Wrapped promotions for "${e.title}" — peak #${e.peak}, ${fmt(e.sales)} sold, ${e.wins} win(s).`);
  const gap=RI(35,60);e.status='break';e.next=S.day+gap;
  Q.push({title:`"${e.title}" promotions wrap`,art:scene('dorm',{members:true}),body:`<div class="result-row"><div class="qs"><small>Peak chart</small><b>#${e.peak}</b></div><div class="qs"><small>Sales</small><b>${fmt(e.sales)}</b></div><div class="qs"><small>Wins</small><b>${e.wins}</b></div></div><p>The company plans your next comeback in about ${Math.round(gap/7)} weeks. Use the break for fansigns, variety shows, solo schedules and training.</p>`});
  if(yrs()>=2&&S.fame<20&&Math.random()<.6)S.flags.disband=true;
}
function startPrep(){
  const e=S.era,def=albumName();
  e.status='prep';e.readiness=0;e.release=S.day+14;
  Q.push({title:'Comeback confirmed!',art:scene('office',{members:true,caption:'Comeback meeting'}),
    body:`<p>The company green-lights ${S.group.name}'s next comeback. Release is in 2 weeks — spend it on Group practice and Recording to raise readiness.</p><div class="field"><label>Album title</label><input class="txt" id="aname" maxlength="24" value="${esc(def)}"></div>`,
    choices:[{label:'Start comeback prep',primary:true,fn(){e.title=(document.getElementById('aname').value.trim()||def).slice(0,24);log(`Comeback announced: "${e.title}".`)}}]});
}
function release(){
  const e=S.era;e.n=S.albums.length+1;e.quality=computeQuality();e.status='promo';e.start=S.day;e.end=S.day+28;e.wins=0;e.sales=0;
  const first=Math.round(S.fans*R(.18,.32)+CO().budget*700+e.quality*40);e.sales=first;S.monthSales+=first;
  e.rank=clamp(Math.round(150-(e.quality*.5+S.fame*.6)*1.6),1,200);e.peak=e.rank;addFame(e.quality/40);
  log(`Released "${e.title}" — debuted at #${e.rank}, ${fmt(first)} first-week sales.`);
  Q.push({title:`"${e.title}" is out!`,art:scene('stage',{members:true,mic:true,caption:`Comeback stage · ${shortDate(S.day)}`}),
    body:`<div class="result-row"><div class="qs"><small>Quality</small><b><span class="grade g-${grade(e.quality)}">${grade(e.quality)}</span> ${e.quality.toFixed(0)}</b></div><div class="qs"><small>First week</small><b>${fmt(first)}</b></div><div class="qs"><small>Melodi chart</small><b>#${e.rank}</b></div></div><p>Readiness was ${e.readiness.toFixed(0)}%. Four weeks of promotions start now.</p>`});
}

/* ============ awards ============ */
function awards(){
  const y=yearOf(S.day),wins=S.yearWins[y]||0,rel=S.albums.some(a=>a.y===y)||(S.era&&S.era.status==='promo');

function endGame(id){S.ending={id,day:S.day};Q=[];log(`ENDING: ${ENDINGS[id].t}`);save();render();}

function randomEvent(){const pool=EV.filter(e=>e.when());if(!pool.length)return;let tot=pool.reduce((a,e)=>a+e.w,0),r=Math.random()*tot;for(const e of pool){r-=e.w;if(r<=0){e.run();return}}}

function tickers(){
  const t=[];const d=S.day;
  if(S.phase==='trainee'){const left=28-((d-S.trainee.start)%28);t.push(`Next evaluation in <b>${left===28?0:left} day${left===1?'':'s'}</b>`);t.push(`Training month <b>${S.trainee.month+1}</b>`);if(S.trainee.fails)t.push(`Fails in a row: <b>${S.trainee.fails}/3</b>`)}
  if(S.phase==='predebut')t.push(`Debut in <b>${S.era.release-d} days</b>`,`Readiness <b>${S.era.readiness.toFixed(0)}%</b>`);
  if(S.phase==='idol'){const e=S.era;
    if(e.status==='promo'){t.push(`Promoting "${esc(e.title)}" · <b>${e.end-d+1}</b> days left`,`Melodi chart <b>#${e.rank}</b>`);const sh=SHOWS[dateOf(d).getDay()];t.push(sh?`Today: <b>${sh}</b> (afternoon)`:'No music show today')}

    if(e.status==='break')t.push(`Break · next comeback prep in <b>${Math.max(0,e.next-d)} days</b>`);
  }
  if(S.forcedRest>0)t.push(`Resting: <b>${S.forcedRest}</b> day(s)`);

    <div class="sec-t">Awards</div>${S.awards.length?S.awards.map(a=>`<div>🏆 ${a.y} · ${esc(a.n)}</div>`).join(''):'<div class="muted">None yet.</div>'}

  if(t.dataset.pick){const sl=UI.slot||'morning';if(S.plan[sl]===t.dataset.pick)S.plan[sl]=null;else{S.plan[sl]=t.dataset.pick;const i=SLOTS.findIndex(x=>x[0]===sl);if(i<3)UI.slot=SLOTS[i+1][0]}save();render();return}
  if(t.dataset.tab){UI.tab=t.dataset.tab;render();return}
  if(C){
    if(t.dataset.look){C.look[t.dataset.look]=t.dataset.v}
    if(t.dataset.type){C.type=t.dataset.type;if(C.type!=='coed')C.look.g=C.type}

    {const ok=C.look.g==='boy'?HAIR_B:HAIR_G;if(!ok[C.look.hairStyle])C.look.hairStyle=Object.keys(ok)[C.look.g==='boy'?1:0]}

function migrate(s){if(!s.look.g)s.look.g=s.type==='boy'?'boy':s.type==='girl'?'girl':(['short','curtain'].includes(s.look.hairStyle)?'boy':'girl');s.members.forEach(m=>{if(!m.look.g)m.look.g=m.g});if(!s.plan)s.plan=emptyPlan();const arcs=shuffle(Object.keys(ARCS));s.members.forEach((m,i)=>{if(!m.arc){m.arc=arcs[i%arcs.length];m.ch=0;m.sp=0;m.best=false}});s.offers=(s.offers||[]).filter(o=>o.type);return s}

<script>

 {n:'Road Manager',cap:1,sal:2400000,desc:'Drive the van, run the schedule, keep your group safe and happy.'},

const MCO=()=>({...COMPANIES[G.company],name:G.coName||COMPANIES[G.company].name});

function mCond(k,a){const b=G.cond[k];G.cond[k]=clamp(b+a*MUL);rec(MCOND[k],G.cond[k]-b)}

function mTrust(a){a*=MUL;const b=G.trust;G.trust=clamp(b+a);rec('Boss trust',G.trust-b)}

const gAvg=(g,k)=>g.members.reduce((a,m)=>a+m[k],0)/g.members.length;
const mMoodFace=()=>G.cond.stress>75?'sad':(G.cond.energy<22||G.cond.health<35)?'tired':'happy';

const isShowDay=g=>g.era.status==='promo'&&SHOWS[dateOf(G.day).getDay()]!==undefined;

/* ---------- manager friendship stories ---------- */
const MARCS={
 worrier:{n:'The Worrier',ch:[
  {t:'Can\'t sleep',txt:'{n} calls you at 2am. "Sorry… I can\'t sleep. What if I mess up tomorrow?"',c:[['Stay on the phone until they fall asleep',2,8,'You hear soft snoring after forty minutes.'],['Set up a video call with their family tomorrow',2,6,'Their mum cries, {n} cries, you pretend you aren\'t crying.'],['"Just sleep. Big day tomorrow."',0,-3,'{n} apologises for bothering you.']]},

  {t:'Family',txt:'{n} hands you a lanyard they braided themselves. "Managers are supposed to be strict. You\'re more like family."',c:[['Wear it to every schedule',0,6,''],['Give them a hug',0,6,'']]}]},
 rival:{n:'The Ambitious One',ch:[
  {t:'More lines',sc:'office',txt:'{n} corners you after recording. "I had two lines. Two. Can you talk to the producers?"',c:[['Raise it fairly at the next meeting',2,7,'The producer agrees to give {n} the bridge next time.'],['"Wait your turn — everyone wants more lines."',0,-3,'{n} goes quiet and practises twice as hard.'],['Promise them a solo part',-1,2,'You can\'t actually deliver that. {n} will remember.']]},
  {t:'The solo offer',sc:'office',txt:'An OST offer comes in for {n} — but it clashes with a group schedule.',c:[['Negotiate a new date so they can do both',2,8,'Three phone calls later, it works. {n} hugs you in the hallway.'],['Turn it down — the group comes first',1,-2,'{n} understands. Mostly.'],['Let them skip the group schedule',0,3,'The other members are not thrilled.']]},
  {t:'Believed in me',txt:'"Everyone said I was too much. You were the first person who said I was enough." {n} grins.',c:[['"You still are."',0,6,''],['"Now go prove it."',0,6,'']]}]},
 joker:{n:'The Mood Maker',ch:[
  {t:'Van comedian',sc:'city',txt:'{n} keeps the whole van laughing — but in the mirror you catch them rubbing their eyes, exhausted.',c:[['Pull over and buy them a coffee',2,7,'"How did you know?" they ask. You just shrug.'],['Turn the music down so they can nap',1,5,'Asleep in thirty seconds.'],['Laugh along and keep driving',0,0,'']]},
  {t:'The prank',txt:'You open the van door and 300 balloons fall out. {n} is filming.',c:[['Laugh and chase them round the car park',2,7,'It becomes the group\'s most-watched behind-the-scenes clip.'],['Pretend to be mad, then crack up',1,5,'Classic.'],['Lecture them about professionalism',-1,-5,'The fun drains out of the room.']]},
  {t:'Off duty',txt:'"You know I\'m only this funny because I feel safe around you, right?" {n} says on the drive home.',c:[['"I know."',0,6,''],['Tell your worst joke back',0,6,'']]}]},
 perfectionist:{n:'The Perfectionist',ch:[
  {t:'3am practice',sc:'practice',txt:'At 3am the practice room light is still on. {n} is alone, running the same section.',c:[['Turn the music off and drive them home',2,7,'They protest — then fall asleep before the dorm.'],['Watch, then give honest notes',1,5,'They fix it in two runs and finally leave.'],['Leave them to it',0,-2,'']]},
  {t:'The ankle',txt:'{n} is limping and insists on performing tomorrow.',c:[['Insist on a doctor and pull them from the schedule',2,8,'A sprain. Two days of rest saved two months.'],['Adjust their choreography with the team',2,6,'They perform carefully and recover.'],['Let them perform',-1,-6,'It gets worse. They miss a week.']]},
  {t:'Rest is part of it',txt:'"I used to think rest was for people who weren\'t serious. You changed that." {n} actually took a day off.',c:[['"Proud of you."',0,6,''],['Book them a spa day',0,6,'']]}]},
 dreamer:{n:'The Dreamer',ch:[
  {t:'The demo',sc:'studio',txt:'{n} nervously plays you a song they wrote on their phone.',c:[['Offer to send it to the in-house producers',2,7,'They\'re grinning for days.'],['Encourage them to keep writing',1,4,'They write three more that week.'],['"Focus on the choreo for now."',-1,-5,'The phone goes back in their pocket.']]},
  {t:'The pitch',sc:'office',txt:'The producers are lukewarm on {n}\'s song. You have one meeting to change their minds.',c:[['Bring {n} to play it live in the meeting',2,8,'The room goes quiet. Then the head producer asks for the stems.'],['Pitch it yourself with a polished demo',1,5,'"Maybe next album."']]},
  {t:'Our track',txt:'{n}\'s song makes the album. The liner notes say "thank you, manager".',c:[['Frame the liner notes',0,6,''],['Ask what the next song is about',0,6,'']]}]},
 quiet:{n:'The Quiet One',ch:[
  {t:'Worn shoes',txt:'{n} never asks for anything. Then you notice their practice shoes are falling apart.',c:[['Quietly buy them a new pair',2,8,'They wear them every single day.'],['Ask if they need anything',1,4,'"I\'m fine." You buy the shoes anyway, later.']]},
  {t:'Frozen on camera',sc:'tv',txt:'During a variety recording, the PD keeps putting {n} on the spot. They freeze.',c:[['Ask the PD for a break and talk them through it',2,8,'After the break {n} lands a joke. It makes the edit.'],['Let the other members cover',1,3,'They get through it.']]},
  {t:'Thank you',txt:'A note on your dashboard in tiny handwriting: "Thank you for noticing."',c:[['Keep it in the glovebox',0,6,''],['Leave a note back',0,6,'']]}]}
};

  MUL=1;G.groups.forEach(gDaily);G.rep=clamp(G.rep-.025);G.trust=clamp(G.trust-.04);

function gDaily(g){

  if(e.status==='promo'){

    e.rank=clamp(Math.round(150-score*1.6),1,200);e.peak=Math.min(e.peak,e.rank);
    const sales=Math.max(0,(210-e.rank))*R(15,35)*(1+g.fame/25)*(days<7?1.6:1);e.sales+=Math.round(sales);g.monthSales+=sales;
    g.fame=clamp(g.fame+(e.rank<=10?.07:e.rank<=50?.03:.005)*(1-g.fame/105));g.fans+=Math.round(g.fame*g.fame*.5*(e.rank<=20?1.5:1));

    if(!esc&&Math.random()<.15){mTrust(-1.5);note(`${g.name} did ${B.n} without you — a little chaotic.`)}else note(`${B.e} ${g.name} did ${B.n}${esc?' (you were there)':''}.`)});
  g.bookings=g.bookings.filter(b=>b.day>G.day);

function crowd(list,cx,big){
  let s='';const n=list.length;
  if(n>6){const front=list.slice(0,6),rest=list.slice(6),rows=[];for(let i=0;i<rest.length;i+=9)rows.push(rest.slice(i,i+9));const RS=[[.5,150],[.42,128]];
    rows.slice().reverse().forEach((row,ri)=>{const r=rows.length-1-ri,[sc,y]=RS[Math.min(r,1)];row.forEach((m,i)=>{const x=row.length===1?cx:70+i*(280/(row.length-1));s+=avatar(m.look,x,y,sc,{delay:(i+r)*.25,big})})});
    list=front}
  const offs=[];for(let i=1;i<=list.length;i++)offs.push((i%2?-1:1)*Math.ceil(i/2));const step=Math.min(54,140/Math.ceil(list.length/2));
  list.map((m,i)=>[m,offs[i]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).forEach(([m,o],i)=>{s+=avatar(m.look,cx+o*step,184-Math.abs(o)*3,.64,{delay:i*.3,big})});
  return s;
}

  else if(g){p+=crowd(g.members,205,o.big);p+=avatar(G.look,42,198,.78,{mood:mm})}

  const t=o.time,ov=name==='stage'?'':t==='night'?'<rect width="360" height="200" fill="#1a0b3a" opacity=".28"/>':t==='midnight'?'<rect width="360" height="200" fill="#07031a" opacity=".5"/><circle cx="330" cy="26" r="9" fill="#ffe9a8" opacity=".9"/><circle cx="334" cy="23" r="8" fill="#07031a" opacity=".55"/>':'';

  app.innerHTML=`<div class="hud"><div class="brand display">Spotlight</div><div class="date"><b>${dstr(G.day)}</b><span>Day ${G.day} · ${esc(G.name)} · ${esc(MCO().name)}</span></div><span class="pill ph-mgr">${ROLES[G.role].n}</span><div class="sp"></div><button class="icon-btn" data-mgo="menu">Menu</button></div>
  <div class="layout"><div class="col">
    <div class="scene">${mscene(sc.name,{gid:sc.gid,duo:sc.duo,time:sc.time})}</div>
    <div class="ticker">${mTickers()}</div>${todayCard()}
    <div class="card"><div class="bars">${bar('Energy',c.energy,'var(--mint)')}${bar('Stress',c.stress,c.stress>75?'var(--red)':'var(--gold)')}${bar('Health',c.health,'var(--sky)')}</div></div>
   </div><div class="col">
    <div class="quick"><div class="qs"><small>Reputation</small><b>${G.rep.toFixed(1)}</b></div><div class="qs"><small>${G.role>=3?'Company funds':'Boss trust'}</small><b>${G.role>=3?won(G.funds):G.trust.toFixed(0)}</b></div><div class="qs"><small>Wallet</small><b>${won(G.wallet)}</b></div><div class="qs"><small>Groups</small><b>${G.groups.length} / ${ROLES[G.role].cap}</b></div></div>
    ${mPlanner()}
    <div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${(UI.mtab||'groups')===k?'on':''}" data-mtab="${k}">${v}</button>`).join('')}</div>
    <div class="card">${mTab()}</div>
  </div></div>`;
}
function mRenderEnding(){
  const E=MEND[G.ending.id];
  app.innerHTML=`<div class="ending"><div class="art">${mscene(E.sc,{gid:G.groups[0]&&E.sc!=='hospital'?G.groups[0].id:null,big:true})}</div>
   <div class="muted">MANAGER ENDING · ${shortDate(G.ending.day)}</div><h1 class="display">${E.t}</h1><p style="line-height:1.6">${esc(E.txt())}</p>
   <div class="sumgrid"><div class="qs"><small>Days</small><b>${G.day}</b></div><div class="qs"><small>Final role</small><b>${ROLES[G.role].n}</b></div><div class="qs"><small>Groups</small><b>${G.groups.length}</b></div><div class="qs"><small>Wins</small><b>${G.groups.reduce((a,g)=>a+g.wins,0)}</b></div><div class="qs"><small>Awards</small><b>${G.awards.length}</b></div><div class="qs"><small>Trusted by</small><b>${G.groups.reduce((a,g)=>a+bestCount(g),0)} members</b></div></div>
   <div class="btn-row"><button class="btn primary" data-mgo="new">New manager life</button><button class="btn" data-mgo="title">Title screen</button></div></div>`;
}
function mDefaultMC(){return {name:'',look:{g:'girl',hairStyle:'bob',hair:'#2b1d1a',skin:'#f6cfae',eye:'#3b2a20',outfit:'#2a2333'},company:'blue',coName:'',gname:groupName(),gtype:'girl',gsize:5,concept:'fresh'}}
function mRenderCreate(){
  const L=MC.look,sw=(arr,key)=>arr.map(c=>`<button class="sw ${L[key]===c?'on':''}" style="background:${c}" data-ml="${key}" data-v="${c}"></button>`).join('');
  app.innerHTML=`<div class="hud"><div class="brand display">Spotlight</div><span class="pill ph-mgr">Manager life</span><div class="sp"></div><button class="icon-btn" data-mgo="title">← Back</button></div>
  <div class="create"><div class="card preview"><svg viewBox="0 0 360 200" style="border-radius:12px;width:100%;max-width:260px">${sceneBg('office')}${avatar(L,180,190,1,{big:true})}</svg><div class="display" style="font-size:22px;margin-top:6px">${esc(MC.name||'Your name')}</div><div class="muted" style="font-size:13px">Road manager · ${esc(MC.coName||COMPANIES[MC.company].name)}</div></div>
  <div class="card">
   <div class="field"><label>Your name</label><input class="txt" id="mName" maxlength="20" value="${esc(MC.name)}"></div>
   <div class="field"><label>You are a</label><div class="chips">${[['girl','Woman'],['boy','Man']].map(([k,v])=>`<button class="chip ${L.g===k?'on':''}" data-mgender="${k}">${v}</button>`).join('')}</div></div>
   <div class="field"><label>Hair style</label><div class="chips">${Object.entries(L.g==='boy'?HAIR_B:HAIR_G).map(([k,v])=>`<button class="chip ${L.hairStyle===k?'on':''}" data-ml="hairStyle" data-v="${k}">${v}</button>`).join('')}</div></div>
   <div class="field"><label>Hair colour</label><div class="chips">${sw(HAIR_COLORS,'hair')}</div></div>
   <div class="field"><label>Skin tone</label><div class="chips">${sw(SKIN,'skin')}</div></div>
   <div class="field"><label>Eye colour</label><div class="chips">${sw(EYES,'eye')}</div></div>
   <div class="field"><label>Suit colour</label><div class="chips">${sw(OUTFITS,'outfit')}</div></div>
   <div class="field"><label>Agency type</label><div class="cos">${Object.entries(COMPANIES).map(([k,c])=>`<button class="co ${MC.company===k?'on':''}" data-mco="${k}"><b>${c.name}</b><small>${c.tag}</small><p>${k==='star'?'Big budgets and big expectations.':k==='blue'?'A steady mid-size agency.':'Tiny budget, lots of freedom.'}</p></button>`).join('')}</div></div>
   <div class="field"><label>Agency name (optional)</label><input class="txt" id="mCo" maxlength="30" placeholder="${esc(COMPANIES[MC.company].name)}" value="${esc(MC.coName)}"></div>
   <div class="sec-t" style="margin-top:18px">Your first group</div>
   <div class="field"><label>Group name</label><input class="txt" id="mGname" maxlength="18" value="${esc(MC.gname)}"></div>
   <div class="field"><label>Group type</label><div class="chips">${[['girl','Girl group'],['boy','Boy group'],['coed','Co-ed group']].map(([k,v])=>`<button class="chip ${MC.gtype===k?'on':''}" data-mtype="${k}">${v}</button>`).join('')}</div></div>
   <div class="field"><label>Members</label><select class="txt" id="mGsize">${Array.from({length:23},(_,i)=>i+2).map(v=>`<option value="${v}" ${MC.gsize===v?'selected':''}>${v} members</option>`).join('')}</select></div>
   <div class="field"><label>Concept</label><select class="txt" id="mConcept">${Object.entries(CONCEPTS).map(([k,v])=>`<option value="${k}" ${MC.concept===k?'selected':''}>${v.n}</option>`).join('')}</select></div>
   <button class="btn primary" style="width:100%" data-mgo="start">Start as road manager →</button>
  </div></div>`;
}
function mReadForm(){const v=id=>{const el=document.getElementById(id);return el?el.value:null};if(!MC)return;const n=v('mName');if(n!==null){MC.name=n;MC.coName=v('mCo');MC.gname=v('mGname');MC.gsize=+v('mGsize');MC.concept=v('mConcept')}}

/* ---------- title + routing ---------- */
renderTitle=function(){
  const sv=loadSave(),mv=mload();
  const demo={g:'girl',hairStyle:'long',hair:'#e85d9a',skin:'#f6cfae',eye:'#3b2a20',outfit:'#9b7bff'},mdemo={g:'boy',hairStyle:'sidepart',hair:'#2b1d1a',skin:'#e8b48f',eye:'#3b2a20',outfit:'#2a2333'};
  const idolOn=sv&&!sv.ending,mgrOn=mv&&!mv.ending;
  app.innerHTML=`<div class="title-wrap">
   <svg viewBox="0 0 360 200" style="width:min(520px,100%);border-radius:18px;border:1px solid var(--line)">${sceneBg('stage','#ff5fa2')}${avatar(demo,200,190,.95,{big:true,mic:true})}${avatar(mdemo,58,196,.8,{})}</svg>
   <div class="logo display">Spotlight</div>
   <div class="tag">Live the K-pop life day by day — on stage as an idol, or behind the scenes as a manager.</div>
   <div class="modes">
    <div class="card mode"><div class="display" style="font-size:22px">🎤 Idol life</div><p class="muted">Train, debut, chase 1st place and find your ending.</p>${idolOn?`<button class="btn primary" data-go="continue">Continue — ${esc(sv.stage)}, day ${sv.day}</button>`:''}<button class="btn ${idolOn?'':'primary'}" data-go="new">New idol life</button></div>
    <div class="card mode"><div class="display" style="font-size:22px">📋 Manager life</div><p class="muted">Run schedules, protect your members, rise from road manager to CEO.</p>${mgrOn?`<button class="btn primary" data-mgo="continue">Continue — ${esc(mv.name)}, day ${mv.day}</button>`:''}<button class="btn ${mgrOn?'':'primary'}" data-mgo="new">New manager life</button></div>
   </div>
   <div class="muted" style="font-size:12px">Each mode has its own save. Starting a new life replaces that mode's save.</div>
  </div>`;
};
const _render=render;
render=function(){if(MODE==='manager'){if(G)return G.ending?mRenderEnding():mRenderGame();if(MC)return mRenderCreate()}return _render()};

app.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  const go=t.dataset.mgo;
  if(go==='new'){MODE='manager';G=null;Q=[];MC=mDefaultMC();S=null;C=null;render();window.scrollTo(0,0);return}
  if(go==='continue'){MODE='manager';S=null;C=null;MC=null;G=mload();Q=[];UI={mtab:'groups',repeat:false,slot:'morning',scene:null,today:{title:'Welcome back',lines:[`It's ${dstr(G.day)}.`],d:{}}};render();return}
  if(go==='title'){MODE=null;G=null;MC=null;Q=[];showModal();render();return}
  if(MODE!=='manager')return;
  if(go==='start'){mReadForm();mNewGame(MC);MC=null;render();window.scrollTo(0,0);return}
  if(go==='menu'){Q.unshift({title:'Menu',body:'<p class="muted">Your manager game saves automatically after every day in this browser.</p>',choices:[{label:'Back to the game',primary:true,fn(){}},{label:'Back to title screen',fn(){MODE=null;G=null;Q=[]}},{label:'Start a new manager life',fn(){G=null;Q=[];MC=mDefaultMC()}}]});showModal();return}
  if(!G&&MC){mReadForm();
    if(t.dataset.ml)MC.look[t.dataset.ml]=t.dataset.v;
    if(t.dataset.mgender){MC.look.g=t.dataset.mgender;const ok=MC.look.g==='boy'?HAIR_B:HAIR_G;if(!ok[MC.look.hairStyle])MC.look.hairStyle=Object.keys(ok)[MC.look.g==='boy'?2:1]}
    if(t.dataset.mco)MC.company=t.dataset.mco;if(t.dataset.mtype)MC.gtype=t.dataset.mtype;
    const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(!G)return;
  if(go==='day'){mDoDay();return}
  if(go==='clearplan'){G.plan={morning:null,afternoon:null,night:null,midnight:null};UI.slot='morning';msave();render();return}
  if(t.dataset.mslot){const cl=ev.target.closest('[data-mclear]');if(cl){G.plan[cl.dataset.mclear]=null;UI.slot=cl.dataset.mclear}else UI.slot=t.dataset.mslot;msave();render();return}
  if(t.dataset.mpick){const sl=UI.slot||'morning';if(G.plan[sl]===t.dataset.mpick)G.plan[sl]=null;else{G.plan[sl]=t.dataset.mpick;const i=SLOTS.findIndex(x=>x[0]===sl);if(i<3)UI.slot=SLOTS[i+1][0]}msave();render();return}
  if(t.dataset.focus){G.focus=+t.dataset.focus;msave();render();return}
  if(t.dataset.mtab){UI.mtab=t.dataset.mtab;render();return}
});
app.addEventListener('change',ev=>{if(MODE==='manager'&&ev.target.id==='mrep')UI.repeat=ev.target.checked});
app.addEventListener('input',ev=>{if(MODE==='manager'&&MC&&ev.target.id==='mName'){MC.name=ev.target.value}});

window.__msim=function(n){for(let i=0;i<n&&G&&!G.ending;i++){while(Q.length&&!G.ending){showModal();const ch=(Q[0].choices||[{fn(){}}]).filter(c=>!c.disabled);pick(ch).fn();Q.shift()}if(G.ending)break;D={};
  if(G.forcedRest>0){mRestDay();continue}
  const acts=mActs();G.plan={morning:null,afternoon:null,night:null,midnight:null};const used=[];
  for(const [k] of SLOTS){const o=acts.filter(a=>a.slots.includes(k)&&!used.includes(a.id));let a=o.find(a=>a.id==='form')||o.find(a=>a.id.startsWith('esc:')&&T(a.hot))||o.find(a=>a.id.startsWith('sup:')&&T(a.hot))||o.find(a=>a.id.startsWith('chk:')&&T(a.hot));
    if(!a){if(k==='midnight'||(G.cond.energy<30))a=k!=='midnight'?o.find(a=>a.id==='rest'):null;else a=pick(o)}if(a){used.push(a.id);G.plan[k]=a.id}}
  mRunDay()}return G&&{day:G.day,role:G.role,ending:G.ending}};
render();
</script>
