<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: departures-board header + tabs, then city list (left) and city form (right); stacks on phones */
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --sunk:#DCE3E9; --ink:#14202C; --muted:#56656F; --line:#C7D1DA;
  --board:#14202C; --board-cell:#22313F; --board-ink:#F3F6F8;
  --marker:#F2B705; --marker-ink:#1B1500; --stamp:#C2362D; --detour:#16707F; --go:#2E7D4F; --on-color:#FFFFFF;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --surface:#16212C; --sunk:#1F2D3A; --ink:#E5ECF2; --muted:#93A3B1; --line:#2A3A48;
  --board:#070B10; --board-cell:#17222D; --board-ink:#F3F6F8; --stamp:#E0564C; --detour:#1E8899; --go:#4BAA72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#16212C; --sunk:#1F2D3A; --ink:#E5ECF2; --muted:#93A3B1; --line:#2A3A48;
  --board:#070B10; --board-cell:#17222D; --board-ink:#F3F6F8; --stamp:#E0564C; --detour:#1E8899; --go:#4BAA72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}

.board{background:var(--board);color:var(--board-ink);padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.board-in{max-width:1180px;margin:0 auto;display:grid;gap:12px}
.logo{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:10px;line-height:1}
.logo i{width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,var(--marker) 50%,var(--stamp) 50%)}
.logo small{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--marker);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{appearance:none;border:0;background:var(--board-cell);color:var(--board-ink);padding:9px 14px;border-radius:6px 6px 0 0;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab b{color:var(--marker);font-weight:600}
.tab[aria-selected="true"] b{color:var(--stamp)}

main{max-width:1180px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.card-h small{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:600}
.pad{padding:16px;display:grid;gap:14px}

.list-tools{display:grid;gap:8px;padding:12px 12px 8px}
.search{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.clist{list-style:none;margin:0;padding:0 6px 8px;max-height:calc(100vh - 260px);overflow:auto}
@media (max-width:820px){.clist{max-height:300px}}
.citem{appearance:none;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.citem:hover{background:var(--sunk)}
.citem[aria-current="true"]{background:var(--ink);color:var(--surface)}
.citem[aria-current="true"] .sub{color:var(--surface);opacity:.75}
.citem b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .sub{grid-column:1;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .lon{grid-row:1/3;grid-column:2;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.citem .err{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--stamp);margin-right:6px}

.btn{appearance:none;border:0;border-radius:8px;background:var(--ink);color:var(--surface);padding:9px 14px;font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:transparent;color:var(--stamp);border:2px solid var(--stamp)}
.btn.small{font-size:14px;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label.f{display:grid;gap:4px;font-weight:600;font-size:14px;min-width:0}
label.f small{font-weight:400;color:var(--muted);font-size:12.5px}
.f input,.f select,.f textarea{width:100%;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;font-weight:400}
.f input.bad,.f select.bad{border-color:var(--stamp)}
.f input[inputmode="decimal"]{font-family:var(--mono);font-variant-numeric:tabular-nums}
fieldset{border:1px solid var(--line);border-radius:9px;margin:0;padding:12px 14px 14px;display:grid;gap:12px;min-width:0}
legend{padding:0 6px;font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.task legend span{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-left:6px;text-transform:none}
.sub-h{margin:0;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qbox{border-left:3px solid var(--detour);padding-left:12px;display:grid;gap:8px}
.hint{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.errs{margin:0;padding:10px 14px 10px 30px;border-left:4px solid var(--stamp);background:var(--sunk);border-radius:0 8px 8px 0;display:grid;gap:3px;font-size:14px}
.ok{margin:0;padding:10px 14px;border-left:4px solid var(--go);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
.note{margin:0;padding:10px 14px;border-left:4px solid var(--marker);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,38px);line-height:1;text-transform:uppercase;text-wrap:balance}
ol.steps{margin:0;padding-left:22px;display:grid;gap:6px;max-width:72ch}
code{font-family:var(--mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px}
textarea.code{width:100%;min-height:340px;border:2px solid var(--line);background:var(--sunk);border-radius:8px;padding:12px;font:12.5px/1.5 var(--mono);white-space:pre;overflow:auto;resize:vertical}
.msg{min-height:1.4em;font-weight:600;margin:0}
.msg.good{color:var(--go)} .msg.bad{color:var(--stamp)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:2px solid var(--stamp);border-radius:8px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{font-family:var(--mono);font-size:12.5px;font-weight:600;background:var(--sunk);padding:4px 8px;border-radius:5px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="board"><div class="board-in">
  <div class="logo"><i></i>City Builder <small>for Pit Stop Rally</small></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-edit" aria-selected="true" data-tab="edit">Edit cities <b id="tabCount"></b></button>
    <button class="tab" role="tab" id="tab-code" aria-selected="false" data-tab="code">Get code</button>
    <button class="tab" role="tab" id="tab-import" aria-selected="false" data-tab="import">Import</button>
  </div>
</div></header>
<main id="app"></main>

const GAMES={
  memory:{name:'Memory match',help:'Flip cards to match 6 pairs. Turn on symbols to show coloured shapes instead of words.'},
  simon:{name:'Repeat the pattern',help:'Coloured pads flash in a pattern that the player repeats. The noun names what flashes, such as "lanterns" or "drums".'},
  gauge:{name:'Stop the scale',help:'A needle sweeps from 0 to the maximum. The player stops it on each of 3 targets.'},
  quiz:{name:'Quiz',help:'4 multiple-choice questions, each with 1 correct answer and 3 wrong ones.'},
  unscramble:{name:'Unscramble',help:'4 words to unscramble, each with a hint. Letters A to Z only, no spaces.'}
};
const DRAFT_KEY='psr-city-builder-draft';
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s);

let cities=clone(DEFAULT_CITIES), sel=0, tab='edit', filter='', pending=null;
try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(Array.isArray(d)&&d.length)cities=d;}catch(e){}
const saveDraft=()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(cities));}catch(e){}};

/* ---------- defaults ---------- */
function blankCfg(game){
  if(game==='memory')return {items:['','','','','','']};
  if(game==='simon')return {noun:'lights'};
  if(game==='gauge')return {targets:[100,200,300],max:400,unit:'g',item:''};
  if(game==='quiz')return {qs:[0,1,2,3].map(()=>({q:'',a:'',w:['','','']}))};
  return {words:[0,1,2,3].map(()=>({w:'',hint:''}))};
}
function blankCity(){
  return {name:'New city',country:'',lat:0,lon:0,pit:'',local:['Taxi','Metro'],tasks:[
    {place:'',label:'',detail:'',game:'memory',cfg:blankCfg('memory')},
    {place:'',label:'',detail:'',game:'gauge',cfg:blankCfg('gauge')},
    {place:'',label:'',detail:'',game:'quiz',cfg:blankCfg('quiz'),rb:''}]};
}

/* ---------- validation ---------- */
const filled=s=>typeof s==='string'&&s.trim().length>0;
const isNum=v=>typeof v==='number'&&isFinite(v);
function check(c,all){
  const e=[];
  if(!filled(c.name))e.push('City name is empty.');
  else if(all.filter(x=>x.name.trim().toLowerCase()===c.name.trim().toLowerCase()).length>1)e.push(`Another city is also called "${c.name}".`);
  if(!filled(c.country))e.push('Country is empty.');
  if(!isNum(c.lat)||c.lat<-90||c.lat>90)e.push('Latitude must be a number from -90 to 90.');
  if(!isNum(c.lon)||c.lon<-180||c.lon>180)e.push('Longitude must be a number from -180 to 180.');
  if(!filled(c.pit))e.push('Pit Stop is empty.');
  if(!c.local||c.local.length!==2||!c.local.every(filled))e.push('Both local transport options are needed.');
  if(c.more&&!(c.more.length===2&&c.more.every(filled)))e.push('Fill in both extra transport options, or switch them off.');
  if(!c.tasks||c.tasks.length!==3)e.push('A city needs exactly 3 tasks.');
  (c.tasks||[]).forEach((t,i)=>{
    const n=`Task ${i+1}`;
    if(!filled(t.place))e.push(`${n}: location is empty.`);
    if(!filled(t.label))e.push(`${n}: task name is empty.`);
    if(!filled(t.detail))e.push(`${n}: instructions are empty.`);
    if(i===2&&!filled(t.rb))e.push(`${n}: the Roadblock question is needed on task 3.`);
    const g=t.cfg||{};
    if(t.game==='memory'){
      const it=(g.items||[]).map(s=>String(s).trim());
      if(it.length!==6||!it.every(Boolean))e.push(`${n}: needs 6 card pairs.`);
      else if(new Set(it.map(s=>s.toLowerCase())).size!==6)e.push(`${n}: the 6 cards must all be different.`);
    }else if(t.game==='simon'){
      if(!filled(g.noun))e.push(`${n}: say what flashes, such as "lanterns".`);
    }else if(t.game==='gauge'){
      if(!isNum(g.max)||g.max<=0)e.push(`${n}: the scale maximum must be above 0.`);
      if(!g.targets||g.targets.length!==3||!g.targets.every(v=>isNum(v)&&v>0&&v<g.max))e.push(`${n}: each of the 3 targets must be above 0 and below the maximum.`);
      if(!filled(g.unit))e.push(`${n}: the unit is empty (for example g, ml or °C).`);
      if(!filled(g.item))e.push(`${n}: say what is being measured.`);
    }else if(t.game==='quiz'){
      if(!g.qs||g.qs.length!==4)e.push(`${n}: needs 4 questions.`);
      (g.qs||[]).forEach((q,k)=>{
        const opts=[q.a,...(q.w||[])].map(s=>String(s||'').trim());
        if(!filled(q.q)||opts.length!==4||!opts.every(Boolean))e.push(`${n}, question ${k+1}: fill in the question, the correct answer and 3 wrong answers.`);
        else if(new Set(opts.map(s=>s.toLowerCase())).size!==4)e.push(`${n}, question ${k+1}: the 4 answers must all be different.`);
      });
    }else if(t.game==='unscramble'){
      if(!g.words||g.words.length!==4)e.push(`${n}: needs 4 words.`);
      (g.words||[]).forEach((w,k)=>{
        if(!/^[A-Z]{3,}$/.test(w.w||''))e.push(`${n}, word ${k+1}: use 3 or more capital letters A to Z, with no spaces or accents.`);
        else if(new Set(w.w).size<2)e.push(`${n}, word ${k+1}: needs at least 2 different letters so it can be scrambled.`);
        if(!filled(w.hint))e.push(`${n}, word ${k+1}: the hint is empty.`);
      });
    }else e.push(`${n}: unknown task type.`);
  });
  return e;
}
const allErrors=()=>cities.map(c=>check(c,cities));

/* ---------- code output ---------- */
const q=s=>"'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')+"'";
const nf=v=>String(Number(v));
function cfgCode(t){
  const g=t.cfg;
  if(t.game==='memory')return `{${g.glyph?'glyph:true,':''}items:[${g.items.map(q).join(',')}]}`;
  if(t.game==='simon')return `{noun:${q(g.noun)}}`;
  if(t.game==='gauge')return `{targets:[${g.targets.map(nf).join(',')}],max:${nf(g.max)},unit:${q(g.unit)},item:${q(g.item)}}`;
  if(t.game==='quiz')return `{qs:[${g.qs.map(x=>`Q(${[x.q,x.a,...x.w].map(q).join(',')})`).join(',')}]}`;
  return `{words:[${g.words.map(w=>`W(${q(w.w)},${q(w.hint)})`).join(',')}]}`;
}
function cityCode(c){
  const head=`{name:${q(c.name)},country:${q(c.country)},lat:${nf(c.lat)},lon:${nf(c.lon)},pit:${q(c.pit)},local:[${c.local.map(q).join(',')}]${c.more?`,more:[${c.more.map(q).join(',')}]`:''},tasks:[`;
  const tasks=c.tasks.map(t=>`  T(${q(t.place)},${q(t.label)},${q(t.detail)},${q(t.game)},${cfgCode(t)}${filled(t.rb)?','+q(t.rb):''})`).join(',\n');
  return head+'\n'+tasks+']}';
}
const allCode=()=>'const CITIES=[\n'+cities.map(cityCode).join(',\n')+'\n];';

/* ---------- import ---------- */
function parseArray(text){
  let src=text.trim().replace(/^const\s+CITIES\s*=\s*/,'').replace(/;\s*$/,'');
  const T=(place,label,detail,game,cfg,rb)=>({place,label,detail,game,cfg,rb});
  const Q=(qq,a,...w)=>({q:qq,a,o:[a,...w]});
  const W=(w,hint)=>({w,hint});
  const arr=new Function('T','Q','W','"use strict";return ('+src+');')(T,Q,W);
  if(!Array.isArray(arr)||!arr.length)throw new Error('That text is not a list of cities.');
  return arr.map(c=>{
    const o={name:c.name||'',country:c.country||'',lat:Number(c.lat),lon:Number(c.lon),pit:c.pit||'',local:(c.local||['','']).slice(0,2),tasks:(c.tasks||[]).map(t=>{
      const x={place:t.place||'',label:t.label||'',detail:t.detail||'',game:t.game,cfg:clone(t.cfg||{})};
      if(t.rb)x.rb=t.rb;
      if(t.game==='quiz')x.cfg.qs=(x.cfg.qs||[]).map(z=>({q:z.q,a:z.a,w:(z.o||[]).filter((v,i)=>i>0).slice(0,3)}));
      return x;})};
    if(c.more)o.more=c.more.slice(0,2);
    return o;
  });
}

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  $('#tabCount').textContent=cities.length;
  ({edit:renderEdit,code:renderCode,import:renderImport})[tab]();
}

function listHtml(errs){
  const f=filter.trim().toLowerCase();
  const rows=cities.map((c,i)=>({c,i})).filter(({c})=>!f||(c.name+' '+c.country).toLowerCase().includes(f));
  return rows.length?rows.map(({c,i})=>`<li><button class="citem" data-i="${i}" aria-current="${i===sel}"><b>${errs[i].length?'<span class="err" title="Has problems"></span>':''}${esc(c.name||'Untitled')}</b><span class="sub">${esc(c.country||'No country')}</span><span class="lon">${isNum(c.lon)?(c.lon>=0?c.lon.toFixed(1)+'°E':(-c.lon).toFixed(1)+'°W'):'?'}</span></button></li>`).join('')
    :'<li class="empty">No cities match.</li>';
}

function inp(path,val,o={}){
  const type=o.num?'inputmode="decimal"':'';
  return `<label class="f">${o.label?`<span>${o.label}${o.small?` <small>${o.small}</small>`:''}</span>`:''}<input data-p="${path}" ${o.num?'data-num="1"':''} ${o.upper?'data-upper="1"':''} ${type} value="${esc(val)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''} aria-label="${esc(o.aria||o.label||path)}"></label>`;
}

function taskHtml(t,i){
  const p=`tasks.${i}`, g=t.cfg;
  let cfg='';
  if(t.game==='memory'){
    cfg=`<label class="f" style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" data-p="${p}.cfg.glyph" data-bool="1" ${g.glyph?'checked':''} style="width:auto"> Show as coloured symbols (type one symbol per card, such as ◆ ● ▲)</label>
    <p class="sub-h">6 card pairs</p><div class="grid">${g.items.map((v,k)=>inp(`${p}.cfg.items.${k}`,v,{aria:`Card ${k+1}`,ph:`Card ${k+1}`})).join('')}</div>`;
  }else if(t.game==='simon'){
    cfg=`<div class="grid">${inp(`${p}.cfg.noun`,g.noun,{label:'What flashes',small:'plural, such as lanterns',ph:'lanterns'})}</div>`;
  }else if(t.game==='gauge'){
    cfg=`<div class="grid">${inp(`${p}.cfg.item`,g.item,{label:'What is measured',ph:'cumin'})}${inp(`${p}.cfg.unit`,g.unit,{label:'Unit',ph:'g'})}${inp(`${p}.cfg.max`,g.max,{label:'Scale maximum',num:1})}</div>
    <div class="grid">${g.targets.map((v,k)=>inp(`${p}.cfg.targets.${k}`,v,{label:`Target ${k+1}`,num:1})).join('')}</div>`;
  }else if(t.game==='quiz'){
    cfg=g.qs.map((x,k)=>`<div class="qbox"><p class="sub-h">Question ${k+1}</p>${inp(`${p}.cfg.qs.${k}.q`,x.q,{aria:`Question ${k+1}`,ph:'Question'})}
      <div class="grid">${inp(`${p}.cfg.qs.${k}.a`,x.a,{label:'Correct answer'})}${x.w.map((w,j)=>inp(`${p}.cfg.qs.${k}.w.${j}`,w,{label:`Wrong answer ${j+1}`})).join('')}</div></div>`).join('');
  }else{
    cfg=g.words.map((w,k)=>`<div class="grid two">${inp(`${p}.cfg.words.${k}.w`,w.w,{label:`Word ${k+1}`,upper:1,ph:'GEYSER'})}${inp(`${p}.cfg.words.${k}.hint`,w.hint,{label:'Hint'})}</div>`).join('');
  }
  return `<fieldset class="task"><legend>Task ${i+1}<span>${i===2?'can be the Roadblock':'Detour, extra stop or Scramble'}</span></legend>
  <div class="grid">${inp(`${p}.label`,t.label,{label:'Task name',ph:'Lantern Lines'})}${inp(`${p}.place`,t.place,{label:'Location',small:'after "At"',ph:'an Asakusa festival street'})}
  <label class="f"><span>Task type</span><select data-game="${i}">${Object.entries(GAMES).map(([k,v])=>`<option value="${k}" ${k===t.game?'selected':''}>${v.name}</option>`).join('')}</select></label></div>
  ${inp(`${p}.detail`,t.detail,{label:'Instructions',ph:'Watch the lanterns light up, then repeat the order.'})}
  ${inp(`${p}.rb`,t.rb||'',{label:'Roadblock question',small:i===2?'required on task 3':'optional',ph:'Who can read the rail map?'})}
  <p class="hint">${GAMES[t.game].help}</p>${cfg}</fieldset>`;
}

function formHtml(c,errs){
  return `<div class="card"><div class="card-h"><span>${esc(c.name||'Untitled')}</span><small>City ${sel+1} of ${cities.length}</small></div><div class="pad" id="form">
  <div id="errbox">${errBox(errs)}</div>
  <fieldset><legend>City</legend>
    <div class="grid">${inp('name',c.name,{label:'City name'})}${inp('country',c.country,{label:'Country'})}${inp('lat',c.lat,{label:'Latitude',small:'-90 to 90, south is minus',num:1})}${inp('lon',c.lon,{label:'Longitude',small:'-180 to 180, west is minus',num:1})}</div>
    <p class="hint">Longitude decides where the city fits in an eastbound or westbound race. You can copy both numbers from any online map by right-clicking the place.</p>
    ${inp('pit',c.pit,{label:'Pit Stop',small:'used after "Get to"',ph:'a temple garden in Asakusa'})}
  </fieldset>
  <fieldset><legend>Getting around</legend>
    <div class="grid">${inp('local.0',c.local[0],{label:'Local transport 1',small:'quick but risky'})}${inp('local.1',c.local[1],{label:'Local transport 2',small:'slower but steady'})}</div>
    <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="moreOn" ${c.more?'checked':''} style="width:auto"> Set my own 3rd and 4th options</label>
    ${c.more?`<div class="grid">${inp('more.0',c.more[0],{label:'Transport 3'})}${inp('more.1',c.more[1],{label:'Transport 4',small:'the slow, safe option'})}</div>`:`<p class="hint">If this is off, the game adds Rideshare or City bus, plus Walk or Run on foot.</p>`}
  </fieldset>
  ${c.tasks.map(taskHtml).join('')}
  <div class="row"><button class="btn alt small" id="dup">Duplicate city</button><span id="delArea"><button class="btn danger small" id="del">Delete city</button></span></div>
  </div></div>`;
}
function errBox(errs){
  return errs.length?`<ul class="errs">${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:`<p class="ok">This city is ready to use.</p>`;
}

function renderEdit(){
  sel=Math.min(sel,cities.length-1);
  const errs=allErrors(), bad=errs.filter(e=>e.length).length;
  $('#app').innerHTML=`<div class="split">
  <div class="card"><div class="card-h"><span>Cities</span><small>${cities.length}${bad?` · ${bad} with problems`:''}</small></div>
    <div class="list-tools"><input class="search" id="search" placeholder="Search cities" aria-label="Search cities" value="${esc(filter)}"><div class="row"><button class="btn small" id="add">Add city</button><button class="btn alt small" id="sortLon">Sort by longitude</button></div></div>
    <ul class="clist" id="clist">${listHtml(errs)}</ul></div>
  <div id="formWrap">${cities.length?formHtml(cities[sel],errs[sel]):'<div class="card empty">No cities yet. Add one to start.</div>'}</div></div>`;
  hookEdit();
}

function refreshStatus(){
  const errs=allErrors(), bad=errs.filter(e=>e.length).length;
  $('#clist').innerHTML=listHtml(errs);hookList();
  const eb=$('#errbox');if(eb)eb.innerHTML=errBox(errs[sel]);
  const h=$('.split .card-h small');if(h)h.textContent=`${cities.length}${bad?` · ${bad} with problems`:''}`;
  const t=$('#formWrap .card-h span');if(t)t.textContent=cities[sel].name||'Untitled';
  $('#tabCount').textContent=cities.length;
}

function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){o=o[ks[i]];}o[ks[ks.length-1]]=val;}
function hookList(){document.querySelectorAll('.citem').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;renderEdit();try{$('#formWrap').scrollIntoView({block:'start'});}catch(e){}});}
let tmr=null;
function hookEdit(){
  hookList();
  $('#search').oninput=e=>{filter=e.target.value;$('#clist').innerHTML=listHtml(allErrors());hookList();};
  $('#add').onclick=()=>{cities.push(blankCity());sel=cities.length-1;filter='';saveDraft();renderEdit();};
  $('#sortLon').onclick=()=>{const cur=cities[sel];cities.sort((a,b)=>(a.lon||0)-(b.lon||0));sel=cities.indexOf(cur);saveDraft();renderEdit();};
  if(!cities.length)return;
  const c=cities[sel];
  $('#form').addEventListener('input',e=>{
    const el=e.target,p=el.dataset.p;if(!p)return;
    let v=el.dataset.bool?el.checked:el.value;
    if(el.dataset.upper){const pos=el.selectionStart;el.value=el.value.toUpperCase();v=el.value;try{el.setSelectionRange(pos,pos);}catch(x){}}
    if(el.dataset.num){const n=parseFloat(v);v=v.trim()===''||isNaN(n)?NaN:n;el.classList.toggle('bad',isNaN(v));}
    if(el.dataset.bool&&!v){const ks=p.split('.');let o=c;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];delete o[ks[ks.length-1]];}
    else setPath(c,p,v);
    clearTimeout(tmr);tmr=setTimeout(()=>{saveDraft();refreshStatus();},250);
  });
  document.querySelectorAll('select[data-game]').forEach(s=>s.onchange=()=>{const t=c.tasks[+s.dataset.game];t.game=s.value;t.cfg=blankCfg(s.value);saveDraft();renderEdit();});
  $('#moreOn').onchange=e=>{if(e.target.checked)c.more=['',''];else delete c.more;saveDraft();renderEdit();};
  $('#dup').onclick=()=>{const d=clone(c);d.name=c.name+' copy';cities.splice(sel+1,0,d);sel++;saveDraft();renderEdit();};
  $('#del').onclick=()=>{
    $('#delArea').innerHTML=`<span class="confirm">Delete ${esc(c.name||'this city')}? <button class="btn danger small" id="delYes">Delete</button><button class="btn alt small" id="delNo">Keep</button></span>`;
    $('#delYes').onclick=()=>{cities.splice(sel,1);sel=Math.max(0,sel-1);saveDraft();renderEdit();};
    $('#delNo').onclick=renderEdit;
  };
}

function renderCode(){
  const errs=allErrors(), badCities=errs.map((e,i)=>e.length?i:-1).filter(i=>i>=0);
  const lons=cities.map(c=>c.lon).filter(isNum);
  const warn=cities.length<20?`<p class="note">You have ${cities.length} cities. Long races need plenty of cities spread around the globe; with fewer than about 20, 13-leg races may not find a route that always heads one way.</p>`:'';
  $('#app').innerHTML=`<div class="card"><div class="card-h"><span>Get code</span><small>${cities.length} cities</small></div><div class="pad">
  <h2>Copy your city list into the game</h2>
  <div class="stats"><span class="stat">${cities.length} cities</span><span class="stat">${cities.length*3} city tasks</span><span class="stat">${lons.filter(v=>v>=0).length} east · ${lons.filter(v=>v<0).length} west of Greenwich</span></div>
  ${warn}
  ${badCities.length?`<div class="errs" style="list-style:none;padding-left:14px"><b>${badCities.length} cit${badCities.length===1?'y has':'ies have'} problems.</b> Fix them on the Edit cities tab before copying, or the game may break.<div class="row" style="margin-top:6px">${badCities.slice(0,12).map(i=>`<button class="btn alt small" data-go="${i}">${esc(cities[i].name||'Untitled')}</button>`).join('')}</div></div>`:`<p class="ok">All ${cities.length} cities are ready.</p>`}
  <ol class="steps">
    <li>Copy the code below.</li>
    <li>Open your game's <code>index.html</code> in a text editor.</li>
    <li>Find the line that starts with <code>const CITIES=[</code>.</li>
    <li>Select from there down to the line <code>];</code> just above <code>/* Generic task types</code>.</li>
    <li>Paste to replace it, save the file and upload it to your website.</li>
  </ol>
  <div class="row"><button class="btn" id="copy" ${badCities.length?'disabled':''}>Copy code</button><button class="btn alt" id="selAll">Select all</button></div>
  <p class="msg" id="cmsg"></p>
  <textarea class="code" id="out" readonly spellcheck="false" aria-label="Generated CITIES code">${esc(allCode())}</textarea>
  <p class="hint">The game also has 13 task types that work in every city (mazes, codes, puzzles and more). Those are added automatically, so you only need 3 tasks per city here. Saved races in players' browsers keep the cities they started with.</p>
  </div></div>`;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{sel=+b.dataset.go;tab='edit';render();});
  const out=$('#out'),msg=$('#cmsg');
  const selectIt=()=>{out.focus();out.select();};
  $('#selAll').onclick=()=>{selectIt();msg.className='msg';msg.textContent='Code selected. Copy it with your device\'s copy command.';};
  $('#copy').onclick=()=>{
    const txt=allCode();
    try{navigator.clipboard.writeText(txt).then(()=>{msg.className='msg good';msg.textContent='Copied. Paste it into index.html.';},()=>{selectIt();msg.className='msg';msg.textContent='Code selected. Copy it with your device\'s copy command.';});}
    catch(e){selectIt();msg.className='msg';msg.textContent='Code selected. Copy it with your device\'s copy command.';}
  };
}

function renderImport(){
  $('#app').innerHTML=`<div class="card"><div class="card-h"><span>Import</span><small>Load a city list</small></div><div class="pad">
  <h2>Load a city list</h2>
  <p class="hint">Paste a <code>const CITIES=[ … ];</code> block from any version of your <code>index.html</code>, or from this page, to edit it here. Only paste code from your own game file.</p>
  <textarea class="code" id="imp" spellcheck="false" placeholder="const CITIES=[&#10;{name:'Brisbane', … }&#10;];" aria-label="Paste a CITIES array"></textarea>
  <div class="row"><button class="btn" id="load">Load this list</button><button class="btn alt" id="reset">Reset to the game's ${DEFAULT_CITIES.length} cities</button></div>
  <div id="iconfirm"></div><p class="msg" id="imsg"></p></div></div>`;
  const msg=$('#imsg'),box=$('#iconfirm');
  const ask=(text,yes)=>{box.innerHTML=`<div class="confirm">${text} <button class="btn danger small" id="iy">Replace</button><button class="btn alt small" id="in">Cancel</button></div>`;$('#iy').onclick=()=>{box.innerHTML='';yes();};$('#in').onclick=()=>{box.innerHTML='';};};
  $('#load').onclick=()=>{
    let arr;
    try{arr=parseArray($('#imp').value);}catch(e){msg.className='msg bad';msg.textContent='That code could not be read. Paste the whole block, from const CITIES=[ to the closing ];. ('+e.message+')';return;}
    ask(`Replace the ${cities.length} cities in the editor with these ${arr.length}?`,()=>{cities=arr;sel=0;saveDraft();msg.className='msg good';msg.textContent=`Loaded ${arr.length} cities. Check them on the Edit cities tab.`;$('#tabCount').textContent=cities.length;});
  };
  $('#reset').onclick=()=>ask(`Replace the ${cities.length} cities in the editor with the game's original ${DEFAULT_CITIES.length}?`,()=>{cities=clone(DEFAULT_CITIES);sel=0;saveDraft();msg.className='msg good';msg.textContent='Reset to the original cities.';$('#tabCount').textContent=cities.length;});
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
render();
</script>
