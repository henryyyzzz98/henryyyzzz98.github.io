<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PitWall — F1 Team Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d2230;--line:#2a3142;--txt:#e9edf5;--mut:#8a93a6;--red:#e10600;--acc:#ff2a2a;--good:#2ecc71;--warn:#f5c518;--blue:#4aa3ff;--tc:#e10600}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Titillium Web',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px;font-weight:600}
button:hover{border-color:#4a5470}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.pri:hover{background:#ff1a12}
button.on{background:#fff;color:#000;border-color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button.sm{padding:4px 8px;font-size:12px;border-radius:6px}
input,select,textarea{font-family:inherit;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
h1,h2,h3{margin:0 0 8px;font-weight:700;letter-spacing:.3px}
h2{font-size:20px}h3{font-size:16px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
.top{position:sticky;top:0;z-index:20;background:#0d0f14;border-bottom:1px solid var(--line);padding:8px 12px 0}
.topbar{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.logo{font-weight:900;font-style:italic;font-size:20px;letter-spacing:-.5px}
.logo b{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:3px 9px;border-radius:20px;font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1180px;margin:8px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:none;border-bottom:3px solid transparent;border-radius:0;color:var(--mut);padding:8px 12px;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--red);background:transparent}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.hl{border-left:4px solid var(--tc)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}.small{font-size:12px}.big{font-size:26px;font-weight:700}
.good{color:var(--good)}.bad{color:#ff5b5b}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:6px 6px;border-bottom:1px solid #20263300}
tr:nth-child(even) td{background:#ffffff05}
tr.me td{background:#ffffff12}
.tbar{display:inline-block;width:4px;height:16px;border-radius:2px;vertical-align:middle;margin-right:6px}
.bar{height:8px;background:#262d3d;border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;background:var(--good)}
.stat{display:grid;grid-template-columns:90px 1fr 42px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.title-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 30%,#2a0705 0%,#0d0f14 60%)}
.title-screen .logo{font-size:44px}
.teamcard{cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);text-align:left;transition:.15s}
.teamcard.sel{border-color:#fff;box-shadow:0 0 0 2px var(--tc)}
.teamcard .stripe{height:6px;border-radius:4px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto}
.modal .card{max-width:560px;width:100%}
.tyre{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:3px solid;font-size:10px;font-weight:900;background:#111;line-height:1}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;background:#333}
.news{font-size:13px;padding:6px 0;border-bottom:1px solid #222a38}
/* race */
.racewrap{display:grid;grid-template-columns:1fr 330px;gap:10px}
@media(max-width:860px){.racewrap{grid-template-columns:1fr}}
.cvbox{background:#0a0c10;border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
canvas{display:block;width:100%}
.hud{position:absolute;left:10px;top:8px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.flag{padding:2px 9px;border-radius:6px;font-weight:800;font-size:13px}
.flag.green{background:#0f5f2a}.flag.sc,.flag.vsc{background:#f5c518;color:#000}.flag.chq{background:#fff;color:#000}
.tower{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;font-size:13px;max-height:560px;overflow:auto}
.tower .tr{display:grid;grid-template-columns:24px 6px 52px 1fr 24px 56px;gap:6px;align-items:center;padding:3px 4px;border-radius:5px}
.tower .tr.me{background:#ffffff18}
.tower .tr.out{opacity:.4}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.ctrl .seg{display:flex;gap:3px}.ctrl .seg button{flex:1;padding:6px 4px}
.feed{font-size:12.5px;max-height:150px;overflow:auto}
.feed div{padding:2px 0;border-bottom:1px solid #1f2633}
.banner{background:var(--warn);color:#000;padding:8px 12px;border-radius:10px;font-weight:700;margin-bottom:10px}
.steps{display:flex;gap:4px;margin:8px 0 12px;overflow-x:auto}
.steps span{padding:4px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12px;white-space:nowrap;color:var(--mut)}
.steps span.on{background:var(--red);border-color:var(--red);color:#fff}
.steps span.done{color:var(--good)}
.list-scroll{max-height:420px;overflow:auto}
.cal-item{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid #222a38}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-weight:700;z-index:200;box-shadow:0 6px 30px #0008}

@media(max-width:600px){.hm{display:none}td,th{padding:5px 4px}}

/* ---- weekend header & schedule ---- */
.wkhead{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#1b0d10 0%,#151a24 55%);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.wk-round{font-size:11px;letter-spacing:2px;color:var(--mut);font-weight:700}
.wk-title{font-size:26px;font-weight:900;font-style:italic;letter-spacing:-.3px;line-height:1.15;margin:2px 0}
.wk-sub{font-size:13px;color:var(--mut)}
.wk-map{opacity:.9}
.sprint-tag{background:#f5c518;color:#000;padding:1px 7px;border-radius:5px;letter-spacing:.5px}
.sched{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.sched::-webkit-scrollbar{display:none}
.sess{flex:1;min-width:104px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:1px;opacity:.7}
.sess .day{font-size:10px;letter-spacing:1.5px;color:var(--mut);font-weight:700}
.sess b{font-size:13.5px;white-space:nowrap}
.sess .st{font-size:11px;color:var(--mut);min-height:14px}
.sess.done{opacity:.85}.sess.done .st{color:var(--good)}
.sess.live{opacity:1;border-color:var(--red);background:linear-gradient(180deg,#2a0b0b,#161a22)}
.sess.live .st{color:#ff4d4d;font-weight:700}
/* ---- timing tables ---- */
.tt{font-size:13.5px}
.ttr{display:grid;grid-template-columns:26px 5px 44px 1fr 78px 64px;gap:7px;align-items:center;padding:5px 4px;border-radius:6px}
.ttr:nth-child(even){background:#ffffff06}
.ttr.me{background:#ffffff16}
.ttr .p{font-weight:800;text-align:center}
.ttr .tc{height:18px;border-radius:2px}
.ttr .cd{font-weight:800;letter-spacing:.5px}
.ttr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.ttr .nm small{display:block;color:var(--mut);font-size:11px}
.ttr .tm{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.ttr .gp{font-variant-numeric:tabular-nums;text-align:right;color:var(--mut);font-size:12px}
.ttr.cut,.tower .tr.cut{border-top:2px solid #e10600;border-radius:0}
.ttr.elim,.tower .tr.elim{background:#e1060014}
@media(max-width:520px){.ttr{grid-template-columns:22px 4px 40px 1fr 70px 52px;gap:5px}.ttr .nm small{display:none}}
/* ---- tower ---- */
.twhead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px}
.twhead .sm{padding:2px 7px;font-size:11px;margin-left:3px}
.tower .tr{cursor:pointer;font-variant-numeric:tabular-nums}
.tower .tr:hover{background:#ffffff0d}
.tower .tr.q{grid-template-columns:24px 6px 52px 1fr 66px 56px}
.qfly{color:#c38bff;font-weight:700}
.qt{text-align:right;font-weight:700}
.qt.purple{color:#c38bff}.qt.green{color:#2ecc71}
/* ---- start lights ---- */
.gantry{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;gap:7px;background:#0b0b0b;padding:8px 10px;border-radius:10px;border:2px solid #222;box-shadow:0 6px 20px #000a;transition:opacity .5s}
.gantry.gone{opacity:0;pointer-events:none}
.glamp{display:flex;flex-direction:column;gap:5px;background:#1a1a1a;padding:5px;border-radius:6px}
.glamp i{display:block;width:18px;height:18px;border-radius:50%;background:#2a0000;box-shadow:inset 0 2px 4px #000}
.glamp.on i{background:radial-gradient(circle at 40% 35%,#ff8080,#ff0000 45%,#a00000);box-shadow:0 0 12px #ff2020,0 0 3px #ff6060}
.lomsg{position:absolute;left:0;right:0;top:46%;text-align:center;font-weight:900;font-style:italic;font-size:22px;color:#fff;text-shadow:0 2px 12px #000;opacity:0;transform:scale(.9);transition:.3s;pointer-events:none}
.lomsg.show{opacity:1;transform:scale(1)}
/* ---- starting grid graphic ---- */
.ggfx{background:repeating-linear-gradient(0deg,#22252b 0 2px,#202328 2px 4px);border-radius:12px;padding:10px 10px 18px;position:relative;overflow:hidden}
.ghead{display:flex;align-items:baseline;justify-content:space-between;font-weight:900;font-style:italic;letter-spacing:1px;font-size:17px;margin-bottom:6px}
.ghead small{font-style:normal;font-weight:600;font-size:12px;color:var(--mut);letter-spacing:0}
.gline{height:8px;margin:2px -10px 12px;background:repeating-linear-gradient(90deg,#fff 0 8px,#111 8px 16px);opacity:.85}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grow .gslot:nth-child(2){margin-top:30px}
.grow + .grow{margin-top:-18px}
.gslot{position:relative;padding:4px 0 6px 0}
.gslot::before{content:'';position:absolute;left:0;right:22%;top:0;height:calc(100% - 4px);border:2.5px solid #e9e9e9;border-bottom:none;border-radius:2px;opacity:.85}
.gslot.empty::before{opacity:.25}
.gpos{position:absolute;left:6px;top:4px;font-weight:900;font-style:italic;font-size:18px;color:#e9e9e9;opacity:.9}
.gcar{position:relative;margin:24px 4px 0 6px;display:flex;align-items:center;gap:6px;background:#11141b;border-radius:8px;padding:5px 6px;border:1px solid #2b3242}
.gslot.me .gcar{border-color:#fff;box-shadow:0 0 0 1px var(--tc)}
.gstripe{width:5px;align-self:stretch;border-radius:3px;background:var(--tc)}
.gtxt{flex:1;min-width:0;line-height:1.1}
.gtxt b{display:block;font-size:15px;letter-spacing:.5px}
.gtxt span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtxt small{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- broadcast timing tower ---- */
.tower.f1t{align-self:start;background:#15161a;border:4px solid #d9dbe0;border-radius:14px;padding:0 0 4px;font-size:13px;max-height:none;overflow:hidden;box-shadow:0 8px 24px #0008;font-family:'Titillium Web',system-ui,sans-serif}
.f1t.st-sc{border-color:#f2c400}.f1t.st-green{border-color:#1fd14a}.f1t.st-win{border-color:#e10600}
.tw-head{display:flex;align-items:center;gap:8px;background:#fff;color:#111;padding:6px 10px 4px}
.tw-mark{display:flex;gap:2px;transform:skewX(-20deg)}.tw-mark i{display:block;width:9px;height:14px;background:#e10600}.tw-mark i+i{width:5px}
.tw-title{font-weight:900;font-style:italic;font-size:17px;letter-spacing:.5px}
.tw-lap{background:#fff;color:#111;text-align:center;font-size:12.5px;padding:0 0 5px;letter-spacing:.5px}
.tw-lap b{font-size:15px}
.tw-ban{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-style:italic;font-size:17px;padding:7px 6px;letter-spacing:.3px;text-align:center}
.tw-ban.yellow{background:#f2c400;color:#111}.tw-ban.green{background:#1fd14a;color:#06240f}.tw-ban.grey{background:#3a3d45;color:#fff;font-size:14px}.tw-ban.chq{background:repeating-linear-gradient(45deg,#fff 0 8px,#111 8px 16px);color:#fff;text-shadow:0 0 4px #000,0 0 4px #000}
.tw-badge{background:#111;color:#f2c400;font-style:normal;font-size:11px;padding:2px 5px;border-radius:4px}
.tw-sub{text-align:center;font-weight:800;font-size:13px;padding:3px;background:#0d0e11;letter-spacing:1px}
.yellowtxt{color:#f2c400}.greentxt{color:#1fd14a !important}
.tw-row{display:grid;grid-template-columns:24px 4px 50px 1fr 16px;gap:7px;align-items:center;padding:3.5px 8px 3.5px 4px;border-bottom:1px solid #1f2127;cursor:pointer;font-variant-numeric:tabular-nums}
.tw-row:hover{background:#ffffff0a}
.tw-row.me{background:#ffffff1c}
.tw-pos{text-align:center;color:#c9ccd3;font-size:12px}
.tw-team{height:14px;border-radius:2px}
.tw-code{font-weight:800;letter-spacing:.6px;color:#fff;white-space:nowrap}
.tw-gap{text-align:right;color:#e7e9ee;font-size:12.5px;white-space:nowrap}
.tw-gap.it{font-style:italic;color:#c9ccd3}.tw-gap.dim{color:#777}.tw-gap.pit{color:#4fc3f7;font-weight:700}.tw-gap.purple{color:#b46bff;font-weight:700}
.tw-ty{font-weight:800;font-size:11px;text-align:center}
.tw-row.out .tw-code,.tw-row.out .tw-pos{color:#666}
.tw-row.elim{background:#3a0d0d55}.tw-row.cut{border-top:2px solid #e10600}
.tw-card{margin:2px 6px 4px;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,var(--tc) 0%,#1a1b20 85%);border:1px solid #ffffff22}
.tw-cardname{display:flex;align-items:center;gap:6px;background:#fff;color:#111;padding:3px 6px;font-size:11px;line-height:1.1}
.tw-cardname b{display:block;font-size:13px;letter-spacing:.3px}
.tw-num{background:#111;color:#fff;font-weight:800;padding:2px 5px;border-radius:3px}
.tw-bignum{font-size:62px;font-weight:900;font-style:italic;color:#ffffff30;text-align:center;line-height:1;padding-top:6px}
.tw-winner{font-size:26px;font-weight:900;font-style:italic;color:#fff;text-align:center;padding:0 0 8px;text-shadow:0 2px 8px #000;margin-top:-18px}
.tw-card.fl{background:linear-gradient(160deg,var(--tc) 0%,#1a1b20 60%)}
.tw-fltitle{background:#7b2cff;color:#fff;text-align:center;font-weight:900;font-style:italic;font-size:15px;margin-top:6px;padding:3px}
.tw-fltime{text-align:center;font-weight:900;font-size:24px;color:#fff;font-variant-numeric:tabular-nums}
.tw-fllap{text-align:center;font-size:11px;color:#ddd;padding-bottom:6px}
.tw-foot{display:flex;gap:4px;padding:6px 6px 2px}
.tw-foot button{flex:1;background:#22252d;border:1px solid #33363f;color:#aaa;font-size:11px;padding:4px;border-radius:6px;font-weight:700}
.tw-foot button.on{background:#fff;color:#111}
@media(max-width:860px){.tower.f1t{max-width:380px;margin:0 auto;width:100%}}
/* ---- classification screen ---- */
.cls{background:linear-gradient(180deg,#14161c,#0c0d11);border:1px solid #2a2d36;border-radius:16px;padding:16px 14px 12px;overflow:hidden}
.cls-event{font-weight:900;font-style:italic;font-size:19px;letter-spacing:.3px;color:#f2f2f2;text-transform:uppercase}
.cls-title{font-weight:900;font-size:34px;letter-spacing:1px;color:#8d929c;line-height:1.05;margin:2px 0 6px}
.cls-row.cls-cols{border:none;padding-top:0;padding-bottom:4px}.cls-cols span{font-size:11px !important;font-style:normal !important;font-weight:600 !important;color:#aab !important;letter-spacing:1px}
.cls-row{display:grid;grid-template-columns:30px 26px minmax(0,1.3fr) minmax(0,1.2fr) 92px 54px;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #20232b;font-variant-numeric:tabular-nums}
.cls-row.first{background:linear-gradient(90deg,#e9ebef,#c9ccd3);color:#111;border-radius:4px}
.cls-row.first .cls-team,.cls-row.first .cls-time,.cls-row.first .cls-pts{color:#111}
.cls-row.me:not(.first){background:#ffffff12}
.cls-pos{font-style:italic;font-weight:600;font-size:18px;text-align:center;color:#c9ccd3}
.cls-row.first .cls-pos{color:#111}
.cls-flag{font-size:18px}
.cls-name{font-style:italic;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls-name b{font-weight:900;font-size:16.5px;letter-spacing:.3px}
.cls-tm{display:none;font-style:normal;font-size:10.5px;color:#9aa0aa;letter-spacing:.3px;align-items:center;gap:5px}.cls-tm i{display:inline-block;width:4px;height:11px;border-radius:2px}
.cls-row.first .cls-tm{color:#333}
.cls-team{font-size:13px;color:#c2c6cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.cls-team i{display:inline-block;width:5px;height:16px;border-radius:2px;flex:none}
.cls-time{text-align:right;font-style:italic;font-size:15px;color:#e5e7eb}
.cls-pts{text-align:right;font-weight:800;font-size:15px}
@media(max-width:620px){.cls-cols .cls-pts{font-size:9px !important;letter-spacing:0}}
.cls-row.dnf .cls-time{color:#ff6b6b}
.cls-pages{display:flex;gap:6px;justify-content:center;margin-top:10px}
.cls-pages button{background:#1f222a;color:#bbb;border:1px solid #333744;border-radius:20px;padding:4px 14px;font-size:12px}
.cls-pages button.on{background:#fff;color:#111}
.cls-foot{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:12.5px;color:#c9ccd3;margin-top:8px}
@media(max-width:620px){
  .cls-row{grid-template-columns:24px 22px minmax(0,1fr) 78px 34px;gap:6px;padding:7px 4px}
  .cls-team{display:none}
  .cls-tm{display:flex}
  .cls-title{font-size:26px}.cls-event{font-size:15px}
  .cls-name{font-size:13.5px}.cls-name b{font-size:14.5px}.cls-time{font-size:13px}.cls-pos{font-size:15px}
}
/* ===== expansion ===== */
.camsel{display:flex;gap:4px;margin-top:8px}
.camsel button{flex:1;font-size:12px;padding:5px 7px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:#ccc}
.camsel button.on{background:#fff;color:#000}
.bgfx{position:absolute;left:8px;bottom:8px;pointer-events:none}
.bbox{background:#111e;border:1px solid #333;border-radius:8px;overflow:hidden;font-size:12px}
.bbox .bt{background:#fff;color:#111;font-weight:900;font-style:italic;padding:2px 8px;letter-spacing:.5px}
.bbox .br{display:flex;gap:8px;align-items:center;padding:4px 8px}.bbox .br span{padding-left:5px;font-weight:800}
.pitgfx{position:absolute;right:8px;bottom:8px;pointer-events:none}
.pbox{background:#111e;border-radius:8px;overflow:hidden;font-size:12px;min-width:120px}
.pbox .pt{background:#4fc3f7;color:#002;font-weight:900;font-style:italic;padding:2px 8px}
.pbox .pr{display:flex;gap:8px;align-items:center;padding:4px 8px}.ptime{font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.radiogfx{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;pointer-events:none;max-width:86%}
.rbox{background:#000d;border-radius:8px;padding:5px 10px;font-size:12.5px;font-style:italic}
.rbox .rt{font-style:normal;font-weight:800;font-size:11px;color:#f5c518;letter-spacing:.5px}
.replaybadge{position:absolute;left:8px;top:40px;display:flex;gap:8px;align-items:center}
.replaybadge span{background:#7b2cff;color:#fff;font-weight:900;font-style:italic;padding:3px 9px;border-radius:6px}
.radar{display:flex;gap:4px;align-items:flex-end;height:70px;margin-bottom:4px}
.radar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.radar i{display:block;border-radius:3px 3px 0 0}.radar span{font-size:9.5px;color:var(--mut)}
.onboard{background:linear-gradient(160deg,#1b2433,#121620)}
.obrow{display:flex;align-items:center;gap:12px;margin-top:6px}
.obspeed{text-align:center}.obspeed b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}.obspeed span{font-size:10px;color:var(--mut)}
.obgear{font-size:30px;font-weight:900;color:#f5c518;width:30px;text-align:center}
.obbars{flex:1;display:flex;flex-direction:column;gap:3px}.obbars div{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mut)}
.obbars span{width:28px}.obbars i{display:block;height:8px;border-radius:4px;transition:width .2s}
.drs{background:#2ecc71;color:#000;font-weight:900;padding:3px 7px;border-radius:5px;font-size:12px}
.radio-box{background:#0d1118;border-left:3px solid #f5c518;border-radius:6px;padding:6px 8px;margin-top:6px;font-size:12.5px;font-style:italic}
.radio-box div+div{margin-top:3px}
.strat{display:flex;flex-direction:column;gap:3px}
.strow{display:grid;grid-template-columns:30px 42px 1fr;gap:6px;align-items:center;font-size:12px}
.strow.me{background:#ffffff12;border-radius:4px}
.stc{text-align:center;color:var(--mut)}.stbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:#20242e}
.stbar span{display:flex;align-items:center;justify-content:center;color:#000;font-size:10px;font-weight:700;border-right:2px solid #0e1016}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px}
.fpick{display:flex;flex-direction:column;align-items:flex-start;border-left:4px solid var(--tc);padding:5px 8px;font-size:12px}
.fpick.on{background:#fff;color:#000}.fpick span{font-weight:400;font-size:11px}
.podium{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:6px;background:radial-gradient(circle at 50% 100%,#3a0d0d,#121318 70%);border-radius:16px;padding:20px 10px 0;margin-bottom:12px;overflow:hidden;min-height:200px}
.pstep{width:31%;max-width:180px;text-align:center}
.pname{font-size:13px;line-height:1.15;margin-bottom:6px}.pname b{display:block;font-size:16px;font-style:italic}.pname small{color:var(--mut)}
.pblock{background:linear-gradient(180deg,var(--tc),#1d2028);border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:30px;font-weight:900;font-style:italic;padding-top:6px}
.podium.anim .pstep{animation:rise .8s ease-out both}.podium.anim .pstep:nth-child(1){animation-delay:.3s}.podium.anim .pstep:nth-child(3){animation-delay:.6s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;animation:fall 3.2s linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(240px) rotate(540deg)}}
.champ-banner{background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);color:#1a1200;text-align:center;font-weight:900;font-style:italic;font-size:22px;padding:12px;border-radius:14px;margin-bottom:12px;letter-spacing:.5px}
.champ-banner small{display:block;font-size:12px;font-style:normal;letter-spacing:1px}

// ---------- Lap model ----------

      const opts = [];

function negotiateForm(d, ask, opts, buyout) {
  const sel = opts === 'renew' ? '' : `<select id="ng_when" style="width:100%;margin:6px 0">${opts.map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>`;

function doOffer(id, mode, buyout) {
  const d = G.drivers[id]; const me = G.teams[G.player];

  const msgEl = document.getElementById('ng_msg');
  const stamp = G.year * 100 + G.round;
  if (d.lastAsk === stamp && d.askTries >= 2) { msgEl.innerHTML = '<span class="bad">He won\'t talk again until after the next race.</span>'; return; }
  d.askTries = d.lastAsk === stamp ? (d.askTries || 0) + 1 : 1; d.lastAsk = stamp;
  const ask = askingSalary(d), ap = appeal(G, G.player);

  if (!d.team) req *= 0.9;

  if (no1) req *= 0.85; if (rel) req *= 0.92;
  const whenV = mode === 'renew' ? 'renew' : document.getElementById('ng_when').value;
  if (mode !== 'renew' && d.team && !whenV.startsWith('next')) {
    const theirs = appeal(G, d.team);
    if (theirs > ap + 0.15 && Math.random() < 0.75) { msgEl.innerHTML = `<span class="bad">${esc(d.name)} doesn't want to leave ${esc(G.teams[d.team].name)} for a slower team.</span>`; return; }
    if (me.money < buyout) { msgEl.innerHTML = '<span class="bad">Not enough money for the buy-out.</span>'; return; }
  }
  const ok = sal >= req || (sal >= req * 0.85 && Math.random() < 0.4);
  if (!ok) { msgEl.innerHTML = `<span class="bad">Rejected. He's looking for more (try ~${fmtM(req * rnd(0.98, 1.08))}).</span>`; return; }
  const setClauses = () => { d.no1 = no1; d.release = rel ? +(ask * 2.5 + 5).toFixed(1) : 0; if (no1) teamDrivers(G, G.player).forEach(x => { if (x !== d && x.no1) { x.no1 = false; x.morale = clamp((x.morale ?? 70) - 10, 5, 100); } }); if (no1) d.morale = clamp((d.morale ?? 70) + 6, 5, 100); };
  if (mode === 'renew') {
    setClauses(); d.morale = clamp((d.morale ?? 70) + 5, 5, 100);
    d.salary = +sal.toFixed(1); d.until = G.year + yrs - (G.round === 0 ? 1 : 0);
    news(G, `✍️ ${d.name} extends with ${me.name} until ${d.until}.`); closeModal(); render(); toast('Contract extended!'); autosave(); return;
  }
  if (whenV === 'next') {

    news(G, `✍️ ${d.name} will join ${me.name} in ${G.year + 1}.`); closeModal(); render(); toast(`${d.name} signed for ${G.year + 1}!`); autosave(); return;
  }

  const repl = whenV.startsWith('now:') ? whenV.slice(4) : null;
  const left = G.round >= G.cal.length ? 0 : (G.cal.length - G.round) / G.cal.length;
  if (repl) { const r = G.drivers[repl]; me.money -= r.salary * left * 0.5; r.team = null; r.until = 0; news(G, `👋 ${me.name} release ${r.name}.`); }
  const oldTeam = d.team;
  if (oldTeam) { me.money -= buyout; G.teams[oldTeam].money += buyout; }
  d.team = G.player; d.salary = +sal.toFixed(1); d.until = G.year + yrs - 1 + (G.round >= G.cal.length ? 1 : 0); d.rookie = false; setClauses(); if (G.xp) G.xp.academy = G.xp.academy.filter(x => x !== d.id);

  if (oldTeam) aiFillNow(G);

}

function radioAction(race, id, act) {

function teamOrderSwap(race) {

  if (mine.length < 2) return 'Both cars need to be running.';
  const [a, b] = mine; const gap = (a.dist - b.dist) / (race.L / b.curLT);
  if (gap > 2.5) return `${b.d.code} is ${gap.toFixed(1)}s back — too far to swap.`;
  const X = race.G.xp; const ignoreP = (X.rivalry / 150) + ((a.d.morale ?? 70) < 40 ? 0.15 : 0) + (a.d.no1 ? 0.25 : 0);
  if (Math.random() < ignoreP) { radio(race, a, pick(['No. I\'m not moving over.', 'Why? I\'m racing here!', 'Tell him to pass me on track.'])); X.rivalry = clamp(X.rivalry + 12, 0, 100); a.d.morale = clamp((a.d.morale ?? 70) + 2, 5, 100); b.d.morale = clamp((b.d.morale ?? 70) - 4, 5, 100); race.msg(`📻 ${a.d.code} ignores team orders!`, true); return 'ignored'; }

}

const SND = (() => {

  const on = () => typeof G !== 'undefined' && G && G.xp && G.xp.settings.sound;
  function init() { if (ctx) return true; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.connect(ctx.destination); return true; } catch (e) { return false; } }
  function vol() { return (G && G.xp ? G.xp.settings.volume : 0.5); }
  function tone(f, d, type = 'square', g = 0.12) { if (!on() || !init()) return; master.gain.value = vol(); const o = ctx.createOscillator(), a = ctx.createGain(); o.type = type; o.frequency.value = f; a.gain.setValueAtTime(g, ctx.currentTime); a.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d); o.connect(a); a.connect(master); o.start(); o.stop(ctx.currentTime + d + 0.02); }

  return {
    unlock() { if (on() && init() && ctx.state === 'suspended') ctx.resume(); },
    light() { tone(880, 0.25, 'square', 0.1); },
    go() { noise(1.2, 0.5, 600, 0.5); tone(220, 0.6, 'sawtooth', 0.05); },
    blip() { tone(1320, 0.07, 'sine', 0.05); setTimeout(() => tone(990, 0.07, 'sine', 0.05), 80); },
    pit() { if (!on()) return; for (let i = 0; i < 4; i++) setTimeout(() => noise(0.05, 0.25, 3000, 2), i * 70); },
    cheer() { noise(2.5, 0.35, 900, 0.4); },
    engine(level, pitch) { // level 0..1, pitch 0..1
      if (!on() || !init()) { if (engGain) engGain.gain.value = 0; return; }
      master.gain.value = vol();
      if (!eng) { eng = ctx.createOscillator(); eng.type = 'sawtooth'; const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; engGain = ctx.createGain(); engGain.gain.value = 0; eng.connect(f); f.connect(engGain); engGain.connect(master); eng.start(); }
      eng.frequency.setTargetAtTime(60 + pitch * 260, ctx.currentTime, 0.08); engGain.gain.setTargetAtTime(level * 0.06, ctx.currentTime, 0.2);
    },
    stopEngine() { if (engGain && ctx) engGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); }
  };
})();

// Replace the base drawRace with a camera-aware version
drawRace = function () {
  const cv = document.getElementById('cv'); if (!cv || !RACE) return;
  const ctx = cv.getContext('2d'); const { _w: w, _h: h, _dpr: dpr } = cv;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const g = trackGeometry(RACE.track); const s = Math.min(w, h) - 60; const ox = (w - s) / 2, oy = (h - s) / 2 + 8;

    let frac = (!frame && c.finished) ? 0.002 * i : (RACE.started || frame ? dist : dist * 2.6) / L; const p = pointAt(g, frac); let x = ox + p[0] * s, y = oy + p[1] * s;
    if (!RACE.started && !frame) { const n = p[2] + Math.PI / 2, side = (c.grid % 2 ? -1 : 1) * 5; x += Math.cos(n) * side; y += Math.sin(n) * side; }
    if (inPit) { const n = p[2] + Math.PI / 2; x += Math.cos(n) * 16; y += Math.sin(n) * 16; } return [x, y]; };

    else { const c = RACE.cars.find(x => x.fav) || RACE.cars.find(x => x.player) || ord[0]; focus = [c]; tz = 3; }
    const ps = focus.map(c => posOf(c, ord.indexOf(c))).filter(Boolean);
    if (ps.length) { tx = ps.reduce((a, p) => a + p[0], 0) / ps.length; ty = ps.reduce((a, p) => a + p[1], 0) / ps.length; }

  if (!CAM.x) { CAM.x = tx; CAM.y = ty; CAM.z = tz; }
  ctx.save(); ctx.translate(w / 2, h / 2); ctx.scale(CAM.z, CAM.z); ctx.translate(-CAM.x, -CAM.y);
  drawTrackBase(ctx, w, h, RACE.track, { wet: frame ? 0 : RACE.wet, yellow: !frame && (RACE.sc || RACE.vsc) });
  ctx.restore();
  const toScr = p => [(p[0] - CAM.x) * CAM.z + w / 2, (p[1] - CAM.y) * CAM.z + h / 2];
  const labelSet = new Set();
  if (CAM.mode === 'director') { const b = topBattle(RACE, 12); if (b) { labelSet.add(b.a); labelSet.add(b.b); } }
  for (let i = ord.length - 1; i >= 0; i--) { const c = ord[i]; if (c.out && !frame) continue; const p = posOf(c, i); if (!p) continue; const q = toScr(p);
    if (q[0] < -20 || q[1] < -20 || q[0] > w + 20 || q[1] > h + 20) continue;
    const lab = (RACE.started || frame) && (CAM.mode === 'track' ? i < 3 : CAM.mode === 'director' ? labelSet.has(c) : true);

};
function replayFrame() {
  const R = REPLAY; const fr = R.clip.frames; if (!fr.length) return null;

  const a = fr[i], b = fr[i + 1] || a; const f = (t - a.t) / Math.max(0.001, b.t - a.t);

  xpfd(el) { const T = G.xp.fan.fantasy; const id = el.dataset.v; const P = fantasyPrices(G); const i = T.drivers.indexOf(id);
    if (i >= 0) { T.drivers.splice(i, 1); } else { if (T.drivers.length >= 5) return toast('5 drivers max — remove one first'); const spent = T.drivers.reduce((s, x) => s + (P.drivers[x] || 0), 0) + (T.team ? P.teams[T.team] : 0); if (spent + P.drivers[id] > T.budget) return toast('Over budget'); T.drivers.push(id); if (T.freeTransfers < 99) { if (T.freeTransfers > 0) T.freeTransfers--; else T.pendingPenalty = (T.pendingPenalty || 0) + 4; } }
    autosave(); const y = window.scrollY; render(); window.scrollTo(0, y); },
  xpft(el) { const T = G.xp.fan.fantasy; const P = fantasyPrices(G); const spent = T.drivers.reduce((s, x) => s + (P.drivers[x] || 0), 0); if (T.team !== el.dataset.v && spent + P.teams[el.dataset.v] > T.budget) return toast('Over budget'); T.team = T.team === el.dataset.v ? null : el.dataset.v; autosave(); const y = window.scrollY; render(); window.scrollTo(0, y); },
  xpfamous(el) { SETUP.year = +el.dataset.v; SETUP.team = null; SETUP.follow = null; SETUP.whatIf = null; render(); },
  xpwhatif(el) { SETUP.whatIf = el.dataset.v || null; const w = WHATIFS.find(x => x.id === SETUP.whatIf); if (w) { SETUP.year = w.start; SETUP.team = null; SETUP.follow = null; } render(); },
  xpcustomteam(el) { SETUP.custom = el.checked ? { name: 'Lion City Racing', color: '#E4002B', engine: 'MER' } : null; render(); },
  xpset(el) { G.xp.settings[el.dataset.v] = el.checked; applyAccessibility(G); if (el.dataset.v === 'sound' && el.checked) SND.unlock(); autosave(); },
  xpsetcam(el) { G.xp.settings.cam = el.dataset.v; CAM.mode = el.dataset.v; autosave(); render(); },
  xptext(el) { G.xp.settings.text = el.dataset.v; applyAccessibility(G); autosave(); render(); }
});
// wrap the start-game action so new options reach the game
const _startraceBase = A.startrace;
A.startrace = function (q) { if (WK && WK.stage === 'grid') puPreRace(G, WK); return _startraceBase(q); };
const _startgame = A.startgame;
A.startgame = function () {
  if (SETUP.custom) { const n = document.getElementById('ct_name'), c = document.getElementById('ct_col'), e = document.getElementById('ct_eng'); if (n) SETUP.custom = { name: n.value.trim() || 'My Team', color: c.value, engine: e.value }; SETUP.team = SETUP.team || 'mer'; }

// inputs that aren't buttons
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.setup) { const [did, k] = t.dataset.setup.split(':'); WK.setupCur[did][k] = +t.value; t.nextElementSibling && (t.nextElementSibling.textContent = t.value); }

});
document.addEventListener('change', e => {

  if (t.dataset && t.dataset.pred) { const P = G.xp.fan.preds[predKey()]; const [f, i] = t.dataset.pred.split(':'); if (i != null) { P.mine.podium = P.mine.podium || []; P.mine.podium[+i] = t.value || null; } else P.mine[f] = t.value || null; autosave(); }
});
document.addEventListener('click', () => SND.unlock(), { once: false, capture: true });
// ---------- Resume a race weekend after closing the tab ----------
// The season save (G) only covered the HQ. This file also checkpoints the current
// weekend (WK) and any live race / qualifying session, so Continue drops you back
// where you left off.
const WK_KEY = 'f1mgr_wk';
const WK_CLASSES = { Race: () => Race.prototype, QualiLive: () => QualiLive.prototype };
const WK_SKIP = new Set(['replay', 'pendingClips']); // big, rebuilt as the race goes on

function wkRefs() {
  const m = new Map(); if (!G) return m;
  m.set(G, { $g: 1 });
  Object.keys(G.drivers || {}).forEach(k => m.set(G.drivers[k], { $d: k }));
  Object.keys(G.teams || {}).forEach(k => m.set(G.teams[k], { $t: k }));
  return m;
}
function wkPack(root) {
  const refs = wkRefs(), seen = new Map(); let n = 0;
  const enc = v => {
    if (typeof v === 'number') return isFinite(v) ? v : { $n: String(v) };
    if (v === null || typeof v !== 'object') return (typeof v === 'function' || v === undefined) ? undefined : v;
    if (refs.has(v)) return refs.get(v);
    if (seen.has(v)) return { $r: seen.get(v) };
    if (typeof Node !== 'undefined' && v instanceof Node) return undefined;
    const id = n++; seen.set(v, id);
    if (Array.isArray(v)) return { $i: id, $a: v.map(x => { const y = enc(x); return y === undefined ? null : y; }) };
    if (v instanceof Set) return { $i: id, $s: [...v].map(enc) };
    if (v instanceof Map) return { $i: id, $m: [...v].map(([a, b]) => [enc(a), enc(b)]) };
    if (ArrayBuffer.isView(v)) return { $i: id, $ta: v.constructor.name, $a: Array.from(v) };
    const o = { $i: id }; const p = Object.getPrototypeOf(v);
    for (const c in WK_CLASSES) if (p === WK_CLASSES[c]()) o.$c = c;
    for (const k of Object.keys(v)) { if (WK_SKIP.has(k)) continue; const y = enc(v[k]); if (y !== undefined) o[k.startsWith('$') ? '$' + k : k] = y; }
    return o;
  };
  return enc(root);
}
function wkUnpack(data) {
  const reg = [];
  const dec = v => {
    if (v === null || typeof v !== 'object') return v;
    if (Array.isArray(v)) return v.map(dec);
    if ('$n' in v) return Number(v.$n);
    if ('$g' in v) return G;
    if ('$d' in v) return G.drivers[v.$d];
    if ('$t' in v) return G.teams[v.$t];
    if ('$r' in v) return reg[v.$r];
    if ('$s' in v) { const s = new Set(); reg[v.$i] = s; v.$s.forEach(x => s.add(dec(x))); return s; }
    if ('$m' in v) { const m = new Map(); reg[v.$i] = m; v.$m.forEach(([a, b]) => m.set(dec(a), dec(b))); return m; }
    if ('$ta' in v) { const C = window[v.$ta] || Float64Array; const a = new C(v.$a); reg[v.$i] = a; return a; }
    if ('$a' in v) { const a = []; reg[v.$i] = a; v.$a.forEach(x => a.push(dec(x))); return a; }
    const o = v.$c && WK_CLASSES[v.$c] ? Object.create(WK_CLASSES[v.$c]()) : {};
    reg[v.$i] = o;
    for (const k of Object.keys(v)) { if (k === '$i' || k === '$c') continue; o[k.startsWith('$$') ? k.slice(1) : k] = dec(v[k]); }
    return o;
  };
  return dec(data);
}

function wkCheckpoint() {
  if (!G || VIEW !== 'weekend' || !WK) return;
  try {
    if (!G.wkTag) G.wkTag = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const live = RACE && (WK.stage === 'race' || WK.stage === 'sprint');
    const pack = wkPack({ wk: WK, race: live ? RACE : null });
    save(G);
    localStorage.setItem(WK_KEY, JSON.stringify({ tag: G.wkTag, year: G.year, round: WK.round, data: pack }));
  } catch (e) { /* storage full: weekend just won't resume */ }
}
function wkClear() { try { localStorage.removeItem(WK_KEY); } catch (e) { } if (G) G.wkTag = null; }
function wkSaved() { try { const s = JSON.parse(localStorage.getItem(WK_KEY)); return s && G && s.tag && s.tag === G.wkTag ? s : null; } catch (e) { return null; } }

function wkRestore() {
  const s = wkSaved(); if (!s) return false;
  try {
    const out = wkUnpack(s.data);
    WK = out.wk; RACE = out.race || null;
    if ((WK.stage === 'race' || WK.stage === 'sprint') && !RACE) WK.stage = WK.stage === 'sprint' ? 'sgrid' : 'grid';
    if (RACE) { RACE.replay = []; RACE.pendingClips = []; if (RACE.started) { LIGHTS = null; PAUSED = true; } else { LIGHTS = null; PAUSED = false; } }
    const Q = (WK.stage === 'quali' || WK.stage === 'squali') && curQS().live; if (Q && !Q.done) PAUSED = true;
    VIEW = 'weekend'; return true;
  } catch (e) { WK = null; RACE = null; wkClear(); return false; }
}

// New weekend gets a fresh tag, so an old checkpoint is never loaded into the wrong round.
const _xr_startWeekend = startWeekend;
startWeekend = function () { G.wkTag = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); _xr_startWeekend(); };

// Checkpoint on every weekend screen change; clear it once you are back at HQ.
const _xr_render = render;
render = function () {
  _xr_render();
  if (VIEW === 'weekend') wkCheckpoint();
};
const _xr_tohq = A.tohq;
A.tohq = function () { wkClear(); if (G) save(G); _xr_tohq.apply(this, arguments); };

// During a live race or quali session, checkpoint every few seconds and when the app is hidden.
setInterval(() => { if (VIEW === 'weekend' && !document.hidden) wkCheckpoint(); }, 4000);
document.addEventListener('visibilitychange', () => { if (document.hidden) wkCheckpoint(); });
window.addEventListener('pagehide', wkCheckpoint);

// Continue → straight back into the weekend if one was in progress.
const _xr_continue = A.continue;
A.continue = function () {
  _xr_continue();
  if (wkRestore()) {
    render(); window.scrollTo(0, 0);
    const live = RACE && RACE.started && !RACE.done;
    toast(live ? `Back at ${WK.track.short} — race paused on lap ${Math.min(RACE.leaderLap + 1, RACE.laps)}` : `Back at the ${WK.track.short} weekend`);
  }
};
const _xr_endseason = A.endseason;
A.endseason = function () { wkClear(); WK = null; RACE = null; _xr_endseason.apply(this, arguments); };
