<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus route builder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--ink:#16232b;--paper:#f5f6f2;--line:#d9dcd3;--route:#0a7c78;--stop:#f0b429;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;display:flex;height:100vh;font:15px/1.4 system-ui,sans-serif;color:var(--ink)}
#side{width:340px;max-width:45vw;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px}
#map{flex:1}
h1{font-size:18px;margin:0}
input[type=search]{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;font:inherit}
#results{max-height:140px;overflow:auto;border:1px solid var(--line);background:#fff;display:none}
#results div{padding:6px 8px;cursor:pointer}#results div:hover,#results div:focus{background:#fdf1cf}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
#list .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--route);color:#fff;text-align:center;font-size:12px;line-height:22px}
#list .t{flex:1;min-width:0}#list small{color:#5b6a72;display:block}
button{font:inherit;border:1px solid var(--ink);background:#fff;border-radius:4px;padding:3px 8px;cursor:pointer}
button:focus-visible,input:focus-visible,#results div:focus-visible{outline:2px solid var(--route);outline-offset:1px}
button.primary{background:var(--ink);color:#fff;padding:8px}
button.sm{padding:0 6px;border-color:var(--line)}
.cs{width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#fff;border:3px solid var(--route);cursor:grab}
.via{width:14px;height:14px;box-sizing:border-box;background:#fff;border:3px solid #16232b;border-radius:3px;transform:rotate(45deg);cursor:grab}
#routes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#routes li{display:flex;gap:4px;align-items:center}
.rt{flex:1;text-align:left}.rt[aria-pressed=true]{background:var(--ink);color:#fff}
button:disabled{opacity:.4;cursor:default}
#map.adding{cursor:crosshair}button[aria-pressed=true]{background:var(--route);border-color:var(--route);color:#fff}
#status{min-height:2.8em}.err{color:var(--bad)}
.row{display:flex;gap:6px}.row button{flex:1}
@media(max-width:700px){body{flex-direction:column-reverse}#side{width:100%;max-width:none;height:45vh;border:0}}
</style>
</head>
<body>
<aside id="side">
  <h1>Bus route builder</h1>
  <div><ul id="routes" aria-label="Routes"></ul><div class="row" style="margin-top:4px"><button id="newroute">+ New route</button><button id="startover">Start over</button></div>
  <small style="color:#5b6a72">Routes are saved automatically in this browser.</small></div>
  <input id="q" type="search" placeholder="Search stop name or code" aria-label="Search stops" autocomplete="off">
  <div id="results" role="listbox"></div>
  <label style="font-size:13px"><input type="checkbox" id="showstops" checked> Show all bus stops</label>
  <p id="hint" style="margin:0;color:#5b6a72">Click a stop on the map, or search, to add it. Stops are visited in the order listed.</p>
  <ol id="list"></ol>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="row">
    <button class="primary" id="go">Get road route</button>
    <button id="export">Export all routes</button>
    <button id="clear">Clear route</button>
  </div>
  <div class="row">
    <button id="addmode" aria-pressed="false">Add custom stop</button>
    <button id="dlxml">Download stops XML</button>
  </div>
  <div class="row"><button id="resetvia">Reset road edits</button></div>
  <label style="font-size:13px">Stops file (only if auto-load fails):
    <input type="file" id="file" accept=".xml"></label>
</aside>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// Routing server. The public demo is for light testing only; point this at your own OSRM for real use.
const OSRM = 'https://router.project-osrm.org/route/v1/driving/';

const map = L.map('map').setView([1.3521, 103.8198], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);

const $ = id => document.getElementById(id);
let stops = [], byCode = new Map(), picked = [], routeGeo = null;
const cluster = L.markerClusterGroup({chunkedLoading: true});
let routeLayer, numLayer;   // belong to the active route, see "Multiple routes" below

function loadXml(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  if (xml.querySelector('parsererror')) return say('Could not parse the XML file.', true);
  stops = [...xml.querySelectorAll('busstop')].map(n => ({
    code: n.getAttribute('name'), wab: n.getAttribute('wab') || 'true',
    name: n.querySelector('details')?.textContent.trim() || '',
    lat: parseFloat(n.querySelector('lat')?.textContent),
    lng: parseFloat(n.querySelector('long')?.textContent)
  })).filter(s => isFinite(s.lat) && isFinite(s.lng));
  byCode = new Map(stops.map(s => [s.code, s]));
  cluster.clearLayers(); customLayer.clearLayers(); markers.clear();
  const base = stops.length;
  stops.forEach(s => cluster.addLayer(makeMarker(s)));
  map.addLayer(cluster);
  loadCustom();
  const n = restored ? 0 : restoreRoutes();
  say(`${base} stops loaded` + (stops.length > base ? `, plus ${stops.length - base} custom` : '') + (n ? `. Restored ${n} saved route${n > 1 ? 's' : ''}.` : '.'));
}

// ---- Custom stops ----
const KEY = 'busplanner.custom';
let addMode = false, markers = new Map();
const customLayer = L.layerGroup().addTo(map);
const tipText = s => `${s.name} (${s.code})` + (s.custom ? ' - drag to move, right-click to edit' : '');
function makeMarker(s){
  let m;
  if (s.custom) {
    m = L.marker([s.lat, s.lng], {draggable: true, icon: L.divIcon({className: '', html: '<div class="cs"></div>', iconSize: [18, 18], iconAnchor: [9, 9]})});
    m.on('contextmenu', () => editPopup(s, m));
    m.on('dragend', () => {
      const p = m.getLatLng(); s.lat = p.lat; s.lng = p.lng;
      saveCustom(); invalidate(); render();
      say(`Moved ${s.name}. Get the road route again to update the path.`);
    });
  } else {
    m = L.circleMarker([s.lat, s.lng], {radius: 6, bubblingMouseEvents: false, color: '#16232b', weight: 1, fillColor: '#f0b429', fillOpacity: 1});
  }
  m.bindTooltip(tipText(s));
  m.on('click', () => { if (!addMode) addStop(s.code); });
  markers.set(s.code, m);
  return m;
}
function editPopup(s, m){
  const box = document.createElement('div');
  const title = document.createElement('strong'); title.textContent = `${s.name} (${s.code})`;
  const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:6px;margin-top:6px';
  const ren = document.createElement('button'); ren.textContent = 'Rename';
  const del = document.createElement('button'); del.textContent = 'Delete';
  ren.onclick = () => { map.closePopup(); renameCustom(s, m); };
  del.onclick = () => { map.closePopup(); removeCustom(s.code); };
  row.append(ren, del); box.append(title, row);
  L.popup().setLatLng(m.getLatLng()).setContent(box).openOn(map);
}
function renameCustom(s, m){
  const name = prompt('New name for this stop:', s.name);
  if (!name || !name.trim()) return;
  s.name = name.trim(); m.setTooltipContent(tipText(s));
  saveCustom(); render(); say(`Renamed to ${s.name}.`);
}
function saveCustom(){
  try { localStorage.setItem(KEY, JSON.stringify(stops.filter(s => s.custom))); }
  catch (e) { say('Custom stops could not be saved in this browser. Use "Download stops XML" to keep them.', true); }
}
function loadCustom(){
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  saved.forEach(s => { if (!byCode.has(s.code)) registerStop(s); });
}
function registerStop(s){
  stops.push(s); byCode.set(s.code, s);
  (s.custom ? customLayer : cluster).addLayer(makeMarker(s));
}
function removeCustom(code){
  if (!confirm('Delete custom stop ' + code + '?')) return;
  customLayer.removeLayer(markers.get(code)); markers.delete(code);
  stops = stops.filter(s => s.code !== code); byCode.delete(code);
  picked = picked.filter(c => c !== code);
  invalidate(); render(); saveCustom();
}
$('addmode').onclick = () => {
  addMode = !addMode;
  $('addmode').setAttribute('aria-pressed', addMode);
  $('map').classList.toggle('adding', addMode);
  say(addMode ? 'Click the map where the new stop should go.' : '');
};
map.on('click', e => {
  if (!addMode) return;
  const name = prompt('Name for this stop:');
  if (!name || !name.trim()) return;
  let n = 1; while (byCode.has('C' + n)) n++;
  const s = {code: 'C' + n, name: name.trim(), lat: e.latlng.lat, lng: e.latlng.lng, wab: 'false', custom: true};
  registerStop(s); saveCustom();
  say(`Added ${s.name} (${s.code}). Click it to add it to your route.`);
});
const xa = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('dlxml').onclick = () => {
  const body = stops.map(s => `\t<busstop name="${xa(s.code)}" wab="${xa(s.wab)}">\n\t\t<details>${xa(s.name)}</details>\n\t\t<coordinates>\n\t\t\t<lat>${s.lat}</lat>\n\t\t\t<long>${s.lng}</long>\n\t\t</coordinates>\n\t</busstop>\n`).join('');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([`<?xml version="1.0"?>\n<busstops>\n${body}</busstops>\n`], {type: 'application/xml'}));
  a.download = 'bus_stops.xml'; a.click(); URL.revokeObjectURL(a.href);
};

fetch('bus_stops.xml').then(r => { if (!r.ok) throw 0; return r.text(); }).then(loadXml)
  .catch(() => say('Could not load bus_stops.xml automatically. Serve this folder with a web server, or choose the file below.', true));
$('file').onchange = e => e.target.files[0]?.text().then(loadXml);

function say(msg, err){ $('status').textContent = msg; $('status').className = err ? 'err' : ''; }

function addStop(code){
  if (picked.length && picked[picked.length-1] === code) return;
  picked.push(code); invalidate(); render();
  if (!cur.visible) { cur.visible = true; refreshRoutes(); }
}
function invalidate(){ routeGeo = null; lastMeta = []; lastSegs = []; routeLayer.clearLayers(); setStopsVisible(true); }
// The stop layers (cluster bubbles + custom stops) can be hidden for a clean presentation view.
function setStopsVisible(v){
  $('showstops').checked = v;
  for (const layer of [cluster, customLayer]) {
    if (v && !map.hasLayer(layer)) map.addLayer(layer);
    if (!v && map.hasLayer(layer)) map.removeLayer(layer);
  }
}
$('showstops').onchange = e => setStopsVisible(e.target.checked);

function numMarker(s, n, color){
  return L.marker([s.lat, s.lng], {interactive: false, icon: L.divIcon({className: '', iconSize: [24, 24], iconAnchor: [12, 12],
    html: `<div style="background:${color};color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font:600 12px system-ui;border:2px solid #fff">${n}</div>`})});
}
function render(){
  const ol = $('list'); ol.innerHTML = '';
  numLayer.clearLayers();
  picked.forEach((code, i) => {
    const s = byCode.get(code);
    const li = document.createElement('li');
    li.innerHTML = `<span class="n" style="background:${cur.color}">${i+1}</span><span class="t">${esc(s.name)}<small>${esc(s.code)}${s.custom ? ' (custom)' : ''}</small></span>`;
    for (const [label, aria, fn] of [['↑','Move up',()=>move(i,-1)],['↓','Move down',()=>move(i,1)],['✕','Remove',()=>{picked.splice(i,1);invalidate();render();}]]){
      const b = document.createElement('button'); b.className='sm'; b.textContent=label; b.setAttribute('aria-label',`${aria}: ${s.name}`); b.onclick=fn; li.append(b);
    }
    ol.append(li);
    numMarker(s, i + 1, cur.color).addTo(numLayer);
  });
  $('hint').style.display = picked.length ? 'none' : '';
  saveRoutes();
}
function move(i, d){
  const j = i + d; if (j < 0 || j >= picked.length) return;
  [picked[i], picked[j]] = [picked[j], picked[i]]; invalidate(); render();
}
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Search
$('q').oninput = e => {
  const q = e.target.value.trim().toLowerCase(), box = $('results');
  if (q.length < 2) { box.style.display = 'none'; return; }
  const hits = stops.filter(s => s.name.toLowerCase().includes(q) || s.code.toLowerCase().startsWith(q)).slice(0, 20);
  box.innerHTML = '';
  hits.forEach(s => {
    const d = document.createElement('div'); d.tabIndex = 0; d.textContent = `${s.name} (${s.code})`;
    const pick = () => { addStop(s.code); map.setView([s.lat, s.lng], 16); box.style.display='none'; $('q').value=''; };
    d.onclick = pick; d.onkeydown = ev => ev.key === 'Enter' && pick();
    box.append(d);
  });
  box.style.display = hits.length ? 'block' : 'none';
};

// Routing, with draggable road adjustments.
// Handles ("vias") are stored per leg, keyed by the two stop codes the leg runs between.
let viasByLeg = new Map(), lastMeta = [], lastSegs = [];
const legKey = i => picked[i] + '|' + picked[i + 1];
const cloneVias = () => new Map([...viasByLeg].map(([k, v]) => [k, v.map(x => ({...x}))]));

function drawActive(){
  routeLayer.clearLayers();
  lastSegs.forEach((c, k) => L.polyline(c.map(([x, y]) => [y, x]), {color: cur.color, weight: 6, opacity: .85, bubblingMouseEvents: false})
    .on('click', e => addVia(k, e.latlng)).addTo(routeLayer));
  lastMeta.forEach(m => {
    if (m.via < 0) return;
    const v = viasByLeg.get(legKey(m.leg))[m.via];
    const mk = L.marker([v.lat, v.lng], {draggable: true, icon: L.divIcon({className: '', html: '<div class="via"></div>', iconSize: [14, 14], iconAnchor: [7, 7]})})
      .bindTooltip('Drag to reshape, right-click to remove').addTo(routeLayer);
    mk.on('dragend', () => { const u = cloneVias(), p = mk.getLatLng(); v.lat = p.lat; v.lng = p.lng; route(false, u); });
    mk.on('contextmenu', () => {
      const u = cloneVias(), key = legKey(m.leg), arr = viasByLeg.get(key);
      arr.splice(m.via, 1); if (!arr.length) viasByLeg.delete(key);
      route(false, u);
    });
  });
}
async function route(fit, undo, note){
  if (picked.length < 2) return say('Add at least two stops.', true);
  const pts = [], meta = [];
  picked.forEach((code, i) => {
    const st = byCode.get(code); pts.push([st.lng, st.lat]); meta.push({leg: i, via: -1});
    if (i < picked.length - 1) (viasByLeg.get(legKey(i)) || []).forEach((v, j) => { pts.push([v.lng, v.lat]); meta.push({leg: i, via: j}); });
  });
  const hasVia = pts.length > picked.length;
  const R = cur;   // the route being edited; ignore the answer if the user switches routes meanwhile
  say('Routing…');
  try {
    const url = `${OSRM}${pts.map(q => q.join(',')).join(';')}?overview=false&steps=true&geometries=geojson${hasVia ? '&continue_straight=true' : ''}`;
    const data = await (await fetch(url)).json();
    if (R !== cur) return say('');
    if (data.code !== 'Ok') throw new Error(data.message || data.code);
    const r = data.routes[0];
    lastMeta = meta;
    lastSegs = r.legs.map(leg => leg.steps.flatMap(st => st.geometry.coordinates));
    const all = lastSegs.flat();
    meta.forEach((m, idx) => {   // handles snap onto the road
      if (m.via < 0) return;
      const v = viasByLeg.get(legKey(m.leg))[m.via];
      [v.lng, v.lat] = data.waypoints[idx].location;
    });
    cur.visible = true; drawActive();
    const line = all.filter((c, i) => !i || c[0] !== all[i-1][0] || c[1] !== all[i-1][1]);
    routeGeo = {type: 'Feature', geometry: {type: 'LineString', coordinates: line},
      properties: {stops: [...picked], vias: [...viasByLeg].map(([leg, points]) => ({leg, points})), distance_m: r.distance, duration_s: r.duration}};
    if (fit) { map.fitBounds(L.geoJSON(routeGeo).getBounds(), {padding: [40, 40]}); setStopsVisible(false); }
    const stats = `${(r.distance/1000).toFixed(1)} km, about ${Math.round(r.duration/60)} min by road (car speeds, not bus timetables). Click the route to add a handle, then drag it.`;
    say(note ? note + ' ' + stats : stats, !!note);
    refreshRoutes();
  } catch (e) {
    if (R !== cur) return say('');
    if (undo) { viasByLeg = undo; return route(false, null, `That edit failed (${e.message}) and was undone.`); }
    say('Routing failed: ' + e.message, true);
  }
}
function addVia(k, ll){
  const m = lastMeta[k]; if (!m) return;
  const u = cloneVias(), key = legKey(m.leg), arr = viasByLeg.get(key) || [];
  arr.splice(m.via + 1, 0, {lat: ll.lat, lng: ll.lng}); viasByLeg.set(key, arr);
  route(false, u);
}
$('go').onclick = () => route(true);
$('resetvia').onclick = () => { viasByLeg = new Map(); if (routeGeo) route(false); else { say('Road edits cleared.'); refreshRoutes(); } };

$('export').onclick = () => {
  syncActive();
  const feats = routes.filter(r => r.geo).map(r => ({...r.geo, properties: {...r.geo.properties, name: r.name, color: r.color}}));
  if (!feats.length) return say('Get a road route first.', true);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({type: 'FeatureCollection', features: feats})], {type: 'application/geo+json'}));
  a.download = 'bus-routes.geojson'; a.click(); URL.revokeObjectURL(a.href);
};
$('clear').onclick = () => { picked = []; viasByLeg = new Map(); invalidate(); render(); say(''); };

// ---- Multiple routes ----
// The working variables (picked, viasByLeg, routeGeo, lastMeta, lastSegs, routeLayer, numLayer) always belong to the
// active route; they are copied back into its record (syncActive) before switching.
// Inactive routes are drawn as static "ghost" lines so only the active one can be edited.
const PALETTE = ['#0a7c78', '#d1495b', '#3b5bdb', '#e08a00', '#7b2cbf', '#2b9348'];
let routes = [], cur = null, seq = 0, restored = false, saveTimer;
const RKEY = 'busplanner.routes';
function makeRoute(){
  seq++;
  return {name: `Route ${seq}`, color: PALETTE[(seq - 1) % PALETTE.length], picked: [], vias: new Map(), geo: null, meta: [], segs: [],
          visible: true, layer: L.layerGroup(), nums: L.layerGroup(), ghost: L.layerGroup()};
}
function syncActive(){ cur.picked = picked; cur.vias = viasByLeg; cur.geo = routeGeo; cur.meta = lastMeta; cur.segs = lastSegs; }
function activate(r){
  if (cur) syncActive();
  const ok = r.picked.filter(c => byCode.has(c));   // a custom stop may have been deleted meanwhile
  if (ok.length !== r.picked.length) { r.picked = ok; r.geo = null; r.meta = []; r.segs = []; r.layer.clearLayers(); }
  cur = r; picked = r.picked; viasByLeg = r.vias; routeGeo = r.geo; lastMeta = r.meta; lastSegs = r.segs;
  routeLayer = r.layer; numLayer = r.nums;
  map.closePopup(); drawActive(); render(); refreshRoutes();
}
function drawGhost(r){
  r.ghost.clearLayers();
  if (r.geo) L.polyline(r.geo.geometry.coordinates.map(([x, y]) => [y, x]), {color: r.color, weight: 5, opacity: .7, interactive: false}).addTo(r.ghost);
  r.picked.forEach((code, i) => { const st = byCode.get(code); if (st) numMarker(st, i + 1, r.color).addTo(r.ghost); });
}
function applyVisibility(){
  const show = (layer, on) => {
    if (on && !map.hasLayer(layer)) map.addLayer(layer);
    if (!on && map.hasLayer(layer)) map.removeLayer(layer);
  };
  routes.forEach(r => {
    const active = r === cur;
    show(r.layer, active && r.visible); show(r.nums, active && r.visible);
    if (!active) drawGhost(r);
    show(r.ghost, !active && r.visible);
  });
}
function refreshRoutes(){ if (cur) syncActive(); applyVisibility(); renderTabs(); saveRoutes(); }
function dropRoute(r){ [r.layer, r.nums, r.ghost].forEach(l => map.removeLayer(l)); routes.splice(routes.indexOf(r), 1); }
function renderTabs(){
  const ul = $('routes'); ul.innerHTML = '';
  routes.forEach(r => {
    const li = document.createElement('li');
    const mk = (txt, label, fn) => { const b = document.createElement('button'); b.className = 'sm'; b.textContent = txt; b.setAttribute('aria-label', label + ': ' + r.name); b.onclick = fn; return b; };
    const vis = document.createElement('input'); vis.type = 'checkbox'; vis.checked = r.visible; vis.setAttribute('aria-label', 'Show ' + r.name);
    vis.onchange = () => { r.visible = vis.checked; applyVisibility(); };
    const b = document.createElement('button'); b.className = 'rt'; b.textContent = r.name;
    b.style.borderLeft = `8px solid ${r.color}`; b.setAttribute('aria-pressed', r === cur);
    b.onclick = () => { if (r !== cur) activate(r); };
    const ren = mk('✎', 'Rename', () => {
      const n = prompt('Route name:', r.name); if (n && n.trim()) { r.name = n.trim(); renderTabs(); }
    });
    const del = mk('✕', 'Delete', () => {
      if (!confirm(`Delete ${r.name}?`)) return;
      if (r === cur) { const next = routes[routes.indexOf(r) ? routes.indexOf(r) - 1 : 1]; dropRoute(r); cur = null; activate(next); }
      else { dropRoute(r); refreshRoutes(); }
    });
    del.disabled = routes.length < 2;
    li.append(vis, b, ren, del); ul.append(li);
  });
}
$('newroute').onclick = () => {
  const r = makeRoute(); routes.push(r); activate(r); setStopsVisible(true);
  say(`${r.name} started. Pick its stops on the map.`);
};

// ---- Saving and loading (browser localStorage) ----
function snapshot(){
  syncActive();
  return {v: 1, seq, active: routes.indexOf(cur), routes: routes.map(r => ({
    name: r.name, color: r.color, visible: r.visible, picked: r.picked, vias: [...r.vias], meta: r.meta, segs: r.segs,
    props: r.geo && {distance_m: r.geo.properties.distance_m, duration_s: r.geo.properties.duration_s}}))};
}
function saveRoutes(){
  if (!restored || !cur) return;   // never overwrite the saved copy before it has been loaded
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(RKEY, JSON.stringify(snapshot())); }
    catch (e) { say('Routes could not be saved in this browser (storage full or blocked). Use "Export all routes" to keep them.', true); }
  }, 300);
}
function makeGeo(segs, stopCodes, vias, d, t){
  const all = segs.flat();
  const line = all.filter((c, i) => !i || c[0] !== all[i-1][0] || c[1] !== all[i-1][1]);
  return {type: 'Feature', geometry: {type: 'LineString', coordinates: line},
    properties: {stops: [...stopCodes], vias: [...vias].map(([leg, points]) => ({leg, points})), distance_m: d, duration_s: t}};
}
function restoreRoutes(){
  restored = true;
  let d = null;
  try { d = JSON.parse(localStorage.getItem(RKEY) || 'null'); } catch (e) {}
  if (!d || d.v !== 1 || !Array.isArray(d.routes) || !d.routes.length) return 0;
  [...routes].forEach(dropRoute); cur = null;
  d.routes.forEach(x => {
    const r = makeRoute();
    Object.assign(r, {name: String(x.name || r.name), color: /^#[0-9a-f]{6}$/i.test(x.color) ? x.color : r.color, visible: x.visible !== false});
    const all = x.picked || [];
    r.picked = all.filter(c => byCode.has(c));
    r.vias = new Map(x.vias || []);
    const intact = r.picked.length === all.length && Array.isArray(x.segs) && Array.isArray(x.meta) && x.props && x.meta.length === x.segs.length + 1;
    if (intact) { r.segs = x.segs; r.meta = x.meta; r.geo = makeGeo(r.segs, r.picked, r.vias, x.props.distance_m, x.props.duration_s); }
    routes.push(r);
  });
  seq = Math.max(seq, d.seq || 0);
  const act = routes[d.active] || routes[0];
  activate(act);
  if (act.geo) { map.fitBounds(L.geoJSON(act.geo).getBounds(), {padding: [40, 40]}); setStopsVisible(false); }
  return routes.length;
}
$('startover').onclick = () => {
  if (!confirm('Delete all routes, including the copy saved in this browser?')) return;
  [...routes].forEach(dropRoute); cur = null; seq = 0;
  try { localStorage.removeItem(RKEY); } catch (e) {}
  const r = makeRoute(); routes.push(r); activate(r); setStopsVisible(true); say('Started over.');
};

const first = makeRoute(); routes.push(first); activate(first);
</script>
