<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruising Altitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: ops-console split — live route map on the left, airline control panel on the right; stacks on phones. */
:root{
 --bg:#0A111E; --panel:#101A2B; --raised:#16233A; --line:#22324D; --fg:#E7EDF6; --mute:#8B9BB7;
 --accent:#FFB547; --accent-ink:#1A1200; --good:#54D98C; --bad:#FF7A7A; --ocean:#0C1627; --sg-bg:#0D1626; --bd-bg:#07090D; --bd-edge:#1B2230; --bd-cell:#11151D; --bd-fg:#F2F4F7; --bd-amber:#FFC24D; --bd-split:#05070A; --bd-hover:#1A2130; --c-f:#E9C46A; --c-j:#F28F6B; --c-w:#8FB8F0; --c-y:#6C7FA3; --land:#18263D; --land-edge:#24385A;
 --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
 --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.good{color:var(--good)} .bad{color:var(--bad)} .amber{color:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px}
.stat{display:flex;flex-direction:column}
.stat small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:8px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;padding-top:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.mapcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:980px){.mapcard{position:static}.top{position:static;gap:8px 14px}.stats{gap:4px 14px}.stat b{font-size:14px}}
.views{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.views .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.zoom{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.zoom .btn{min-width:34px;background:color-mix(in srgb,var(--raised) 88%,transparent)}
.maphint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--mute);font-family:var(--f-mono);pointer-events:none;z-index:2}
.cabinline{display:flex;flex-wrap:wrap;gap:4px 12px;min-width:0}
.cab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.cab i,.cabrow i{display:inline-block;width:9px;height:9px;border-radius:2px}
.cab b{color:var(--fg);font-weight:500}
.cabinedit{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.cabrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cabrow>span:first-child{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cabrow small{font-size:11.5px}
.step{display:flex;gap:4px;align-items:center}
.step input{width:64px;text-align:center;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 4px;font-family:var(--f-mono)}
.cabbar{display:flex;height:10px;background:var(--raised);border-radius:3px;overflow:hidden;gap:1px}
.cabbar span{display:block;height:100%}
.results{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.results:empty{display:none}
.res{text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;line-height:1.35}
.res:hover{border-color:var(--accent)}
.picked{font-size:13px;padding:6px 10px;border-left:2px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--ocean)}
canvas#map{display:block;width:100%;touch-action:none;cursor:grab}
canvas#map:active{cursor:grabbing}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.feed{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;max-height:150px;overflow:auto}
.feed div{display:flex;gap:10px}
.feed .w{font-family:var(--f-mono);color:var(--mute);flex:0 0 44px}
.feed .bad{color:var(--bad)} .feed .good{color:var(--good)}
.feed h4,.sec h3{margin:0;font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* panel */
.panel{min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--bg);z-index:10;position:static}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:980px){
 .tabs{position:sticky;top:env(safe-area-inset-top,0px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
 .tab{padding:12px 11px}
}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--mute);font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{display:flex;justify-content:space-between;align-items:baseline}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.box.hl{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.row .field{flex:1 1 120px}
.field label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
textarea{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;font-family:var(--f-mono);font-size:12px;color:var(--fg);resize:vertical;word-break:break-all}
details.imp summary{cursor:pointer;color:var(--mute);font-size:13px}
.hr{border-top:1px solid var(--line)}
select,input[type=text]{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px 12px}
.kv div{display:flex;flex-direction:column}
.kv small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.kv b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.rt{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em}
.rt .arrow{color:var(--accent);margin:0 6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.warn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.chip.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.amb{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.lf{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.lf span{display:block;height:100%;background:var(--accent)}
.planes{display:flex;flex-direction:column;gap:6px}
.plane{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.tail{font-family:var(--f-mono);font-weight:600;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.me td{color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.acgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ac h4{margin:0;font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.ac .maker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.chartbox{overflow-x:auto}
canvas#chart{display:block;width:100%;height:170px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);padding:9px 14px;border-radius:8px;z-index:40;font-size:13px;max-width:calc(100% - 32px)}
.toast.bad{border-color:var(--bad)}

/* start + modal */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 6vh) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(3px)}
.card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:16px}
.card h1{margin:0;font-family:var(--f-display);font-size:clamp(30px,7vw,42px);line-height:1;letter-spacing:.01em;text-wrap:balance}
.card h2{margin:0;font-family:var(--f-display);font-size:26px}
.card p{margin:0;color:var(--mute);max-width:60ch}
.board{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;background:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.six{grid-template-columns:repeat(6,1fr)}
.seg.six button{align-items:center;text-align:center}
.seg button{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:9px 6px;display:flex;flex-direction:column;gap:2px;text-align:left}
.seg button small{color:var(--mute);font-size:11px;line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* timetables, scheduler, purchase, boards */
.util{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.util span{display:block;height:100%;background:var(--good)}
.tt{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow-x:auto;font-size:12.5px}
.tt-h,.tt-r{display:grid;grid-template-columns:minmax(150px,1.6fr) 74px 54px 62px minmax(110px,1.4fr);gap:8px;padding:6px 10px;align-items:center;min-width:520px}
.tt-h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.tt-r.ret{border-bottom:1px solid var(--line);color:var(--mute)}
.tt-r.ret:last-child{border-bottom:0}
.tt-r sup{color:var(--accent);font-size:9px;margin-left:1px}
.tl{cursor:pointer;color:var(--fg)}
.tl:hover{border-color:var(--accent)}
.buyp{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button,.bmode button,.bdays button,.days button{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:7px 8px;font-size:13px;color:var(--fg)}
.seg2 button[aria-pressed="true"],.days button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
#buyQty{width:64px;text-align:center;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 4px;font-family:var(--f-mono)}
.overlay.sched{align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 3vh)}
.card.wide{max-width:1120px;gap:12px}
.sg-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--sg-bg)}
.sg{min-width:760px;display:flex;flex-direction:column}
.sg-h,.sg-r{display:grid;grid-template-columns:44px 1fr}
.sg-h{grid-template-columns:44px repeat(24,1fr);font-family:var(--f-mono);font-size:10.5px;color:var(--mute);padding:6px 0 4px;border-bottom:1px solid var(--line)}
.sg-h span{text-align:left;padding-left:2px}
.sg-r{border-bottom:1px solid var(--line);min-height:40px}
.sg-r:last-child{border-bottom:0}
.sg-d{display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--mute);letter-spacing:.06em;border-right:1px solid var(--line)}
.sg-lane{position:relative;cursor:copy;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100%/24) 100%}
.sg-b{position:absolute;top:4px;bottom:4px;border:0;border-radius:4px;padding:0 6px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden;white-space:nowrap;cursor:pointer;color:#fff;line-height:1.1;min-width:2px}
.sg-b.fly{background:var(--c)}
.sg-b.gnd{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,transparent) 0 4px,color-mix(in srgb,var(--c) 22%,transparent) 4px 8px)}
.sg-b b{font-family:var(--f-mono);font-size:11px;font-weight:600}
.sg-b small{font-family:var(--f-mono);font-size:9.5px;opacity:.85}
.sg-b.on{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.sform{gap:10px}
.days{display:flex;flex-wrap:wrap;gap:5px}
.days .q{background:transparent;color:var(--mute)}
.fnin{display:flex;align-items:center;gap:6px}
.fnin input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--f-mono)}
input[type=time]{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;font-family:var(--f-mono)}
.sprev{font-size:13px;line-height:1.5;background:var(--bg);border-radius:6px;padding:8px 10px}
.sprev sup{color:var(--accent);font-size:9px}
/* split-flap board */
.board2{background:var(--bd-bg);border:1px solid var(--bd-edge);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--bd-fg)}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.bcode{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--bd-amber);letter-spacing:.04em}
.bcity{font-size:12.5px;color:var(--mute)}
.bmode{display:flex;gap:4px}
.bmode button,.bdays button{background:var(--bd-cell);border-color:var(--bd-edge);color:var(--mute);font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.bmode button[aria-pressed="true"],.bdays button[aria-pressed="true"]{color:var(--bd-amber);border-color:var(--bd-amber)}
.bdays{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.btz{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.bscroll{overflow-x:auto;display:flex;flex-direction:column;gap:3px}
.brow{display:grid;grid-template-columns:50px 74px minmax(110px,1.4fr) minmax(104px,1.2fr) 40px minmax(92px,1fr);gap:5px;min-width:520px;align-items:center}
.brow.bhd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 2px}
.brow .fl{background:var(--bd-cell);border-radius:3px;padding:6px 7px;font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.04em;color:var(--bd-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;
 background-image:linear-gradient(to bottom,transparent calc(50% - .5px),var(--bd-split) calc(50% - .5px),var(--bd-split) calc(50% + .5px),transparent calc(50% + .5px))}
.brow .fl em{font-style:normal;color:var(--mute);font-size:11px}
.brow .fl i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.brow.mine .fl:first-child,.brow.mine .fl:nth-child(2){color:var(--bd-amber)}
.brow .st.ok{color:var(--good)}.brow .st.warn{color:var(--bd-amber)}.brow .st.bad{color:var(--bad)}
.brow .ac{font-size:11.5px}
.brow{grid-template-columns:56px 84px minmax(110px,1.4fr) minmax(104px,1.2fr) 44px minmax(96px,1fr);min-width:560px}
@media (max-width:620px){.brow{grid-template-columns:48px 76px minmax(0,1fr) 86px;gap:4px;min-width:0}.brow .ac,.brow .gt,.brow.bhd .ac,.brow.bhd .gt{display:none}.brow .fl{font-size:12px;padding:6px 5px}}
.card.wide>.row.sp:first-child{flex-wrap:nowrap;align-items:flex-start}
.card.wide>.row.sp:first-child>div{min-width:0}
.bempty{color:var(--mute);padding:14px 4px;font-size:13px}
.bfoot{font-size:11.5px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.brow:not(.bhd) .fl{animation:flap .42s cubic-bezier(.3,.7,.4,1) both;animation-delay:calc(var(--i)*22ms)}}
@keyframes flap{0%{transform:perspective(300px) rotateX(-80deg);opacity:.2}100%{transform:none;opacity:1}}

.brow[data-frow]{cursor:pointer;border-radius:4px}
.brow[data-frow]:hover .fl{background-color:var(--bd-hover)}
.brow[data-frow]:focus-visible{outline:2px solid var(--bd-amber);outline-offset:2px}
.card.fpop{max-width:560px;gap:12px}
.fp-fn{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:8px}
.fp-fn i{width:8px;height:8px;border-radius:50%;display:inline-block}
.fp-rt{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;text-wrap:balance}
.fp-track{display:flex;align-items:center;gap:10px}
.fp-a{font-weight:600;font-size:13px}
.fp-bar{position:relative;flex:1;height:4px;background:var(--raised);border-radius:2px}

function clearSchedule(S,planeId,routeId){const p=S.fleet.find(x=>x.id===planeId);if(!p)return;p.sched=(p.sched||[]).filter(e=>routeId!=null&&e.r!==routeId);}
function codeFrom(name,taken){const w=(name||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean);

function newGame(name,hub,diff,nRivals,code,unlimited){nRivals=Math.max(0,Math.min(MAX_RIVALS,nRivals==null?3:nRivals));if(nRivals==null)nRivals=3;

  for(let i=c.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[c[i],c[j]]=[c[j],c[i]];}pool.push(...c);if(pool.length>=nRivals)break;}
 const rivals=RIVAL_DEFS.slice(0,nRivals).map((r,i)=>{const h=pool[i];return {...r,hubs:[h],routes:[],value:RIVAL_BASE+D.start*(0.85+rng()*0.3),profit:0,lastProfit:0};});
 // ensure distinct rival hubs
 const S={v:1,name,diff,week:1,cash:START_CASH,loan:0,rep:50,fuel:FUEL_BASE,hubs:[hub],fleet:[],routes:[],rivals,fx:[],
   hist:[],log:[],nextId:1,over:null,last:null,cumProfit:0,debtWeeks:0,peak:START_CASH,unlimited:!!unlimited,code:(code||'').toUpperCase()||codeFrom(name,new Set())};
 {const taken=new Set([S.code]);rivals.forEach(R=>{R.code=codeFrom(R.name,taken);taken.add(R.code);});}
 // rivals start with a few routes

 addLog(S,`${name} is cleared for takeoff from ${AP[hub].city}.`,'info');

}
function addLog(S,text,kind){S.log.unshift({w:S.week,text,kind:kind||'info'});if(S.log.length>60)S.log.length=60;}

function hasRoute(S,a,b){const k=pairKey(a,b);return S.routes.some(r=>pairKey(r.a,r.b)===k);}
function openRoute(S,a,b){
 if(a===b)return 'Pick two different airports.';
 if(!S.hubs.includes(a)&&!S.hubs.includes(b))return 'A route must start or end at one of your hubs.';
 if(hasRoute(S,a,b))return 'You already fly this route.';
 const fee=60000+dist(a,b)*20;
 if(!afford(S,fee))return 'Not enough cash for the slot fee.';
 S.cash-=fee;const r={id:S.nextId++,a,b,mult:1,last:null,opened:S.week};S.routes.push(r);

}
function closeRoute(S,id){const r=S.routes.find(x=>x.id===id);if(!r)return;
 S.fleet.forEach(p=>{p.sched=(p.sched||[]).filter(e=>e.r!==id);});S.routes=S.routes.filter(x=>x.id!==id);addLog(S,`Route ${r.a}–${r.b} closed.`,'info');}
function acquire(S,type,mode,layout){const t=ACT[type];

 if(!afford(S,cost))return mode==='buy'?'Not enough cash to buy this aircraft.':'Not enough cash for the 4-week lease deposit.';
 S.cash-=cost;const used=new Set(S.fleet.map(p=>p.tail));
 const a0=(t.used||0)*52;const p={id:S.nextId++,type,mode,age:a0,age0:a0,sched:[],grounded:0,flown:0,layout:(layout&&t.cls!=='Supersonic'&&seatsOf(layout)>0&&unitsOf(t,layout)<=maxUnits(t)+1e-9)?{f:0,j:0,w:0,y:0,...layout}:defaultLayout(t),tail:makeTail(AP[S.hubs[0]].cc,used)};
 S.fleet.push(p);addLog(S,`${mode==='buy'?'Bought':'Leased'} ${t.used?'a '+t.used+'-year-old ':''}${t.maker} ${t.name} ${p.tail}.`,'good');return p;}
function dispose(S,id){const p=S.fleet.find(x=>x.id===id);if(!p)return;const t=ACT[p.type];
 if(p.mode==='buy'){const v=planeValue(p);S.cash+=v;addLog(S,`Sold ${t.name} ${p.tail} for ${money(v)}.`,'info');}
 else{const fee=leaseWeekly(t)*4;S.cash-=fee;addLog(S,`Returned leased ${t.name} ${p.tail} (early return fee ${money(fee)}).`,'info');}

function assign(S,planeId,routeId){if(routeId==null){clearSchedule(S,planeId,null);return true;}const r=autoFill(S,planeId,routeId);return typeof r==='string'?r:true;}
function openHub(S,code){if(S.hubs.includes(code))return 'Already a hub.';if(!afford(S,HUB_COST))return 'Not enough cash to open a hub.';

function maxLoan(S){return 60e6+S.fleet.filter(p=>p.mode==='buy').reduce((s,p)=>s+planeValue(p)*0.5,0);}
function borrow(S,amt){if(S.loan+amt>maxLoan(S))return 'The bank won\'t lend that much.';S.loan+=amt;S.cash+=amt;addLog(S,`Borrowed ${money(amt)}.`,'info');return true;}
function repay(S,amt){amt=Math.min(amt,S.loan,Math.max(0,S.cash));if(amt<=0)return 'Nothing to repay.';S.loan-=amt;S.cash-=amt;addLog(S,`Repaid ${money(amt)} of debt.`,'info');return true;}
function companyValue(S){if(S.unlimited)return (S.cumProfit||0)+START_CASH+S.fleet.filter(p=>p.mode==='buy').reduce((s,p)=>s+planeValue(p),0)+S.hubs.length*HUB_COST*0.5;return S.cash-S.loan+S.fleet.filter(p=>p.mode==='buy').reduce((s,p)=>s+planeValue(p),0)+S.hubs.length*HUB_COST*0.5;}

function money(n){const s=n<0?'-':'';n=Math.abs(n);
 if(n>=1e9)return s+'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return s+'$'+(n/1e6).toFixed(n>=1e8?0:1)+'M';
 if(n>=1e3)return s+'$'+Math.round(n/1e3)+'k';return s+'$'+Math.round(n);}

function routeEstimate(S,a,b){const d=dist(a,b);const k=pairKey(a,b);
 const comp=S.rivals.map((r,i)=>r.routes.some(x=>pairKey(x.a,x.b)===k)?i:-1).filter(i=>i>=0);

function seasonFactor(w){const wk=((w-1)%52)+1;let f=1+0.1*Math.cos(2*Math.PI*(wk-29)/52);if(wk>=50||wk<=2)f+=0.15;return f;}
function fxMult(S,code){let m=1;for(const e of S.fx){if(e.kind==='apt'&&e.key===code)m*=e.mult;if(e.kind==='region'&&AP[code].region===e.key)m*=e.mult;}return m;}

function rivalOpen(S,i,announce=true){const R=S.rivals[i],D=DIFF[S.diff];if(R.routes.length>=Math.min(D.max+Math.floor(S.week/104)*3,D.max*2))return;
 let a,b;
 const playerRoutes=S.routes.filter(r=>r.last&&r.last.profit>0&&!R.routes.some(x=>pairKey(x.a,x.b)===pairKey(r.a,r.b)));
 if(announce&&playerRoutes.length&&rng()<D.target){const r=playerRoutes.sort((x,y)=>y.last.profit-x.last.profit)[Math.floor(rng()*Math.min(3,playerRoutes.length))];a=r.a;b=r.b;}
 else{for(let tries=0;tries<30;tries++){a=pick(R.hubs);b=pick(BIG3).code;const d=a===b?0:dist(a,b);
   if(d>=300&&d<=14000&&AP[b].size>=3&&!R.routes.some(x=>pairKey(x.a,x.b)===pairKey(a,b)))break;b=null;}}
 if(!b)return;
 const competing=S.routes.find(r=>pairKey(r.a,r.b)===pairKey(a,b));

}

function advance(S){

  const cap=seatsOf(capC);r._ops=list;r._flights=flights;r._conc=capC.j?conc/capC.j:0;r._q=qw?qs/qw:1;
  if(cap>0)add(r.a,r.b,{who:'P',r,cap,capC,mult:r.mult,a:repA*r._q});else r.last={pax:0,seats:0,lf:0,rev:0,cost:0,profit:0,flights:0,comp:0,idle:true};}
 S.rivals.forEach((R,i)=>R.routes.forEach(rr=>add(rr.a,rr.b,{who:i,rr,cap:rr.cap,mult:rr.mult,a:D.q})));
 for(const k in markets){const m=markets[k];const d=dist(m.a,m.b);const cs=m.carriers;const sh=classShare(d);
  const totCap=cs.reduce((s,c)=>s+c.cap,0);const mAvg=cs.reduce((s,c)=>s+c.cap*c.mult,0)/totCap;

  let carry=0;
  for(const cl of CLASSES){const Dc=Dm*sh[cl]*(cl==='j'?jBoost:1)+carry;const list=cs.filter(c=>c.capC[cl]>0);
   if(!list.length){carry=Dc*0.6;continue;}
   list.forEach(c=>c.w=c.a*Math.pow(c.mult,-2)*Math.pow(c.capC[cl],0.6)*(cl==='j'&&c.who==='P'?1+1.5*c.r._conc:1));const W=list.reduce((s,c)=>s+c.w,0);
   list.forEach(c=>c.paxC[cl]=Math.min(c.capC[cl],Dc*c.w/W));
   let left=Dc-list.reduce((s,c)=>s+c.paxC[cl],0);const open=list.filter(c=>c.paxC[cl]<c.capC[cl]);const Wo=open.reduce((s,c)=>s+c.w,0);
   if(left>0&&Wo>0){open.forEach(c=>c.paxC[cl]=Math.min(c.capC[cl],c.paxC[cl]+left*c.w/Wo));left=Dc-list.reduce((s,c)=>s+c.paxC[cl],0);}
   carry=Math.max(0,left)*0.6;}
  const fare=baseFare(d);const ff=CLASSES.reduce((s,c)=>s+sh[c]*CLASS_FARE[c],0);
  for(const c of cs){const pax=Math.round(seatsOf(c.paxC)*2);
   const rev=CLASSES.reduce((s,cl)=>s+c.paxC[cl]*2*fare*c.mult*CLASS_FARE[cl]*(cl==='j'&&c.who==='P'?1+0.5*c.r._conc:1),0);
   if(c.who==='P'){const r=c.r;let cost=0;
    for(const {p,e} of r._ops){const t=ACT[p.type];const fl=nDays(e)*2;const L=p.layout||defaultLayout(t);
     const fu=fl*d*t.burn*S.fuel,cr=fl*blockHours(t,d)*t.crew,fe=fl*(600+seatsOf(L)*6);

 }

 // --- rivals
 S.rivals.forEach((R,i)=>{let p=-300000;R.routes.forEach(rr=>{p+=(rr._p||0);rr.weak=(rr.lf<0.45)?rr.weak+1:0;});
  R.lastProfit=p;R.value+=p;
  const before=R.routes.length;R.routes=R.routes.filter(rr=>rr.weak<5);if(R.routes.length<before&&rng()<0.5)addLog(S,`${R.name} dropped a loss-making route.`,'info');
  // react to player price cuts on hard/normal
  R.routes.forEach(rr=>{const pr=S.routes.find(r=>pairKey(r.a,r.b)===pairKey(rr.a,rr.b));
   if(pr&&S.diff!=='easy'&&pr.mult<rr.mult-0.1&&rng()<(S.diff==='hard'?0.5:0.2)){rr.mult=+Math.max(0.7,rr.mult-0.06).toFixed(2);}});
  if(rng()<D.open)rivalOpen(S,i,true);

 });
 // --- reputation
 const flown=S.routes.filter(r=>r.last&&r.last.seats>0);
 if(flown.length){const seats=flown.reduce((s,r)=>s+r.last.seats,0);const lf=flown.reduce((s,r)=>s+r.last.pax,0)/seats;
  const mult=flown.reduce((s,r)=>s+r.mult*r.last.seats,0)/seats;
  const target=clamp(45+(lf-0.7)*50+(1-mult)*45+Math.min(12,flown.length*1.5)-S.fleet.filter(p=>p.grounded).length*3,5,98);

 S.fx.forEach(e=>e.weeks--);S.fx=S.fx.filter(e=>e.weeks>0);

  ()=>{S.fuel=clamp(S.fuel*1.18,0.45,1.7);return ['Crude oil spikes after production cuts. Jet fuel up 18%.','bad'];},
  ()=>{S.fuel=clamp(S.fuel*0.86,0.45,1.7);return ['Oil prices slump. Jet fuel down 14%.','good'];},
  ()=>{if(!assigned.length)return null;const p=pick(assigned),t=ACT[p.type];p.grounded=2;const c=t.price*0.004;report.repairs+=c;
      return [`${t.name} ${p.tail} grounded for an engine inspection. Repairs ${money(c)}.`,'bad'];},
  ()=>{const regs=Object.keys(REGION_NAMES).filter(r=>r!=='AN');const k=pick(regs);const why={OC:'Cyclone warnings',AS:'A typhoon',ME:'A sandstorm',EU:'Air traffic control strikes',AF:'Severe storms',NA:'A winter storm',SA:'Volcanic ash',AN:'Blizzards'}[k];

 ];

}

<script>

const PRESETS={world:{cx:10,cy:12,span:360},apac:{cx:128,cy:2,span:120},emea:{cx:22,cy:20,span:92},amer:{cx:-88,cy:6,span:125}};
UI.v={...PRESETS.apac};

const SLOTS=3,slotKey=n=>'cruising-altitude-slot-'+n;
function normalize(G){if(!G||!Array.isArray(G.hubs)||!Array.isArray(G.fleet)||!Array.isArray(G.routes)||!Array.isArray(G.rivals))return null;

function hashN(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const shortType=t=>t.name.replace(' Dreamliner','');
function rivalType(d){return d<1600?ACT.A20N:d<4500?ACT.B38M:d<9000?ACT.B789:d<12500?ACT.A359:ACT.B77W;}
// one delay per flight per UTC day per week, shared by boards, popup and map
function flightDelay(fn,depU){const h=hashN(fn+'|'+S.week+'|'+Math.floor(wmod(depU)/1440));return h%17===0?15+(h>>>8)%5*15:0;}
function boardRows(ap,day,mode){const rows=[];const push=(m,o)=>{m=wmod(m);if(Math.floor(m/1440)===day)rows.push({m,...o});};
 S.fleet.forEach(p=>(p.sched||[]).forEach(e=>{const R=rot(S,p,e);if(!R)return;const t=ACT[p.type];
  e.days.forEach((on,k)=>{if(!on)return;const b=k*1440;const st=p.grounded?'cancel':null;const u0=b+e.t-tzOff(R.from);
   const out={fn:`${S.code} ${e.fn}`,o:R.from,d:R.to,depU:u0,leg:R.leg,t,tail:p.tail,seats:seatsOf(p.layout),mine:1,st,ac:shortType(t)};
   const ret={fn:`${S.code} ${e.fn+1}`,o:R.to,d:R.from,depU:u0+R.leg+R.turn,leg:R.leg,t,tail:p.tail,seats:seatsOf(p.layout),mine:1,st,ac:shortType(t)};
   if(mode==='dep'){if(R.from===ap)push(b+R.depOut,{...out,place:R.to});if(R.to===ap)push(b+R.depBack,{...ret,place:R.from});}
   else{if(R.to===ap)push(b+R.arrOut,{...out,place:R.from});if(R.from===ap)push(b+R.arrBack,{...ret,place:R.to});}});}));
 S.rivals.forEach(Rv=>Rv.routes.forEach(rr=>{if(rr.a!==ap&&rr.b!==ap)return;const d=dist(rr.a,rr.b);const t=rivalType(d);const n=Math.max(1,Math.min(5,Math.round(rr.cap/7/190)));
  const leg=legMin(t,d),diff=tzOff(rr.b)-tzOff(rr.a);const hs=hashN(Rv.code+rr.a+rr.b);const fn0=10+(hs%440)*2+1;
  for(let i=0;i<n;i++){const dep=360+Math.round((i*(960/n)+(hs>>>(i+3))%90)/5)*5;const back=dep+leg+turnMin(t)+diff+60;
   for(let k=0;k<7;k++){const b=k*1440;
    const out={fn:`${Rv.code} ${fn0+i*2}`,o:rr.a,d:rr.b,depU:b+dep-tzOff(rr.a),leg,t,ac:shortType(t),color:Rv.color,airline:Rv.name,seats:t.seats};
    const ret={fn:`${Rv.code} ${fn0+i*2+1}`,o:rr.b,d:rr.a,depU:b+back-tzOff(rr.b),leg,t,ac:shortType(t),color:Rv.color,airline:Rv.name,seats:t.seats};

const CRUISE_FT={Turboprop:25000,'Regional jet':37000,Narrowbody:37000,Widebody:39000,Jumbo:37000,Supersonic:58000};
function bearing(a,b){const f1=toRad(a[1]),f2=toRad(b[1]),dl=toRad(b[0]-a[0]);return (Math.atan2(Math.sin(dl)*Math.cos(f2),Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))*180/Math.PI+360)%360;}
function flightState(r){const clock=wmod(gameNow());let rel=wmod(clock-(r.depU+r.delay));if(rel>WEEK/2)rel-=WEEK;
 const leg=r.leg,taxiOut=10,taxiIn=8,A=Math.max(10,leg-taxiOut-taxiIn),a=rel-taxiOut;const t=r.t;const cr=CRUISE_FT[t.cls]||37000;
 const cl=Math.min(t.cls==='Supersonic'?45:24,A*0.3),de=Math.min(t.cls==='Supersonic'?40:30,A*0.35);const vk=t.spd,v0=t.cls==='Turboprop'?200:290;
 const st={rel,phase:'',alt:0,vs:0,spd:0,frac:0,pos:AP[r.o],hdg:null,onGround:true};
 if(r.st==='cancel'){st.phase='Cancelled';return st;}
 if(rel<-45){st.phase='Scheduled';}
 else if(rel<-10){st.phase='Boarding';}
 else if(rel<0){st.phase='Gate closed';}
 else if(a<0){st.phase='Taxiing to runway';st.spd=25;}
 else if(a<A){st.onGround=false;
  if(a<cl){const x=a/cl;st.phase='Climbing';st.alt=cr*(1-Math.pow(1-x,1.6));st.vs=cr*1.6*Math.pow(1-x,0.6)/cl;st.spd=v0+(vk-v0)*x;}
  else if(a>A-de){const x=(A-a)/de;st.phase='Descending';st.alt=cr*Math.pow(x,1.15);st.vs=-cr*1.15*Math.pow(x,0.15)/de;st.spd=v0+(vk-v0)*x;}
  else{st.phase='Cruising';st.alt=cr;st.spd=vk;}
  st.frac=a/A;}
 else if(rel<leg){st.phase='Landed, taxiing to gate';st.frac=1;st.spd=25;st.pos=AP[r.d];}
 else if(rel<leg+30){st.phase='Arrived';st.frac=1;st.pos=AP[r.d];}
 else{st.phase=rel<WEEK/2?'Arrived':'Scheduled';st.frac=rel<WEEK/2?1:0;st.pos=st.frac?AP[r.d]:AP[r.o];}

  st.lon=p0[0]+(p1[0]-p0[0])*f;st.lat=p0[1]+(p1[1]-p0[1])*f;st.hdg=bearing(p0,p1);}
 else{st.lon=st.pos.lon;st.lat=st.pos.lat;}
 st.lon=((st.lon+540)%360)-180;return st;}

 cx.fillStyle=css('--fg');
 // planes: same position model as the flight details popup, so a followed flight and its dot always coincide
 const tk=UI.track?UI.track.fn+'@'+wmod(UI.track.depU):null;
 for(const p of S.fleet){if(p.grounded)continue;const t=ACT[p.type];for(const e of (p.sched||[])){const R=rot(S,p,e);if(!R)continue;
  for(let k=0;k<7;k++){if(!e.days[k])continue;const u0=k*1440+e.t-tzOff(R.from);
   for(const lg of [{fn:`${S.code} ${e.fn}`,o:R.from,d:R.to,depU:u0},{fn:`${S.code} ${e.fn+1}`,o:R.to,d:R.from,depU:u0+R.leg+R.turn}]){
    const f={...lg,leg:R.leg,t,delay:flightDelay(lg.fn,lg.depU)};if(tk===f.fn+'@'+wmod(f.depU))continue;const st=flightState(f);if(st.onGround)continue;
    for(const o of (UI.v.span>200?[-360,0,360]:[0])){const [x,y]=proj(near(st.lon)+o,st.lat);if(x<-5||x>w+5||y<-5||y>h+5)continue;cx.beginPath();cx.arc(x,y,2.6,0,7);cx.fill();}}}}}
 // hubs, rival hubs, selection on top
 cx.font=`600 11px ${css('--f-mono')}`;cx.textBaseline='middle';
 const mark=(code,fn)=>{const a=AP[code];if(!a)return;const [x,y]=proj(near(a.lon),a.lat);if(x<-10||x>w+10||y<-10||y>h+10)return;fn(x,y,a);};
 S.rivals.forEach(R=>R.hubs.forEach(c=>mark(c,(x,y,a)=>{cx.strokeStyle=R.color;cx.lineWidth=1.6;cx.beginPath();cx.arc(x,y,2+a.size*0.32+4,0,7);cx.stroke();})));
 S.hubs.forEach(c=>mark(c,(x,y,a)=>{cx.fillStyle=acc;cx.fillRect(x-4.5,y-4.5,9,9);cx.fillText(a.code,x+7,y-8);}));
 if(UI.track){const st=flightState(UI.track);if(st.onGround||st.phase==='Cancelled')UI.track=null;else{const [x,y]=proj(near(st.lon),st.lat);cx.strokeStyle=acc;cx.lineWidth=2;cx.beginPath();cx.arc(x,y,8,0,7);cx.stroke();cx.fillStyle=acc;cx.beginPath();cx.arc(x,y,3,0,7);cx.fill();cx.fillText(UI.track.fn+' · FL'+String(Math.round(st.alt/1000)*10).padStart(3,'0'),x+11,y-11);if(!drag&&(x<w*0.2||x>w*0.8||y<h*0.2||y>h*0.8)){UI.v.cx=st.lon;UI.v.cy=st.lat;clampView();}}}
 if(UI.sel)mark(UI.sel,(x,y,a)=>{cx.strokeStyle=acc;cx.lineWidth=2;cx.beginPath();cx.arc(x,y,9+a.size*0.3,0,7);cx.stroke();cx.fillStyle=acc;cx.fillText(a.code,x+9,y-10);});
}
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let dirty=true,lastDraw=0;function loop(t){if(S&&!document.hidden&&(!reduceMotion||dirty||t-lastDraw>1000)){drawMap(t);dirty=false;lastDraw=t;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
function zoomAt(f,x,y){const [lon,lat]=unproj(x,y);UI.v.span*=f;clampView();const [lon2,lat2]=unproj(x,y);UI.v.cx+=lon-lon2;UI.v.cy+=lat-lat2;clampView();UI.view=null;renderTop();dirty=true;}
cv.addEventListener('wheel',e=>{if(!S)return;e.preventDefault();const b=cv.getBoundingClientRect();zoomAt(e.deltaY>0?1.25:0.8,e.clientX-b.left,e.clientY-b.top);},{passive:false});
const ptrs=new Map();let drag=null;
cv.addEventListener('pointerdown',e=>{if(!S)return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,moved:false};else if(ptrs.size===2){const [p,q]=[...ptrs.values()];drag={pinch:Math.hypot(p.x-q.x,p.y-q.y),moved:true};}});
cv.addEventListener('pointermove',e=>{if(!drag||!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2&&drag.pinch){const [p,q]=[...ptrs.values()];const d=Math.hypot(p.x-q.x,p.y-q.y);const b=cv.getBoundingClientRect();zoomAt(drag.pinch/d,(p.x+q.x)/2-b.left,(p.y+q.y)/2-b.top);drag.pinch=d;return;}
 const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>5)drag.moved=true;
 if(drag.moved){const k=UI.v.span/MAP.w;UI.v.cx-=dx*k;UI.v.cy+=dy*k;clampView();UI.view=null;dirty=true;}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size>0)return;const d=drag;drag=null;if(!d||d.moved){renderTop();return;}
 const b=cv.getBoundingClientRect();const x=e.clientX-b.left,y=e.clientY-b.top;let best=null,bs=1e9;
 for(const p of MAP.pts){const dd=Math.hypot(p.x-x,p.y-y);if(dd>16)continue;const sc=dd-p.a.size*1.2;if(sc<bs){bs=sc;best=p.a;}}
 if(best){UI.sel=best.code;if(!S.hubs.includes(best.code)){UI.to=best.code;}UI.tab='routes';UI.confirm=null;render();if(window.innerWidth<=980)document.querySelector('.tabs').scrollIntoView({behavior:reduceMotion?'auto':'smooth'});}
 else{UI.sel=null;render();}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;});
$('#zIn').addEventListener('click',()=>zoomAt(0.6,MAP.w/2,MAP.h/2));
$('#zOut').addEventListener('click',()=>zoomAt(1/0.6,MAP.w/2,MAP.h/2));
$('#zHub').addEventListener('click',()=>{if(!S)return;centerOn(S.hubs[0],24);renderTop();dirty=true;});
window.addEventListener('resize',()=>{if(S){MAP.key='';dirty=true;if(UI.tab==='finance')drawChart();}});

/* ---------- airport search ---------- */
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let SEARCH=null;
function searchAirports(q,limit,okFn){q=norm(q).trim();if(!q)return [];if(!SEARCH)SEARCH=AIRPORTS.map(a=>norm(`${a.code} ${a.icao} ${a.iata} ${a.city} ${a.name} ${a.state} ${a.cc}`));
 const Q=q.toUpperCase(),words=q.split(/\s+/);const out=[];
 for(let i=0;i<AIRPORTS.length;i++){const a=AIRPORTS[i];if(okFn&&!okFn(a))continue;let sc=0;
  if(a.code===Q||a.iata===Q||a.icao===Q)sc=1000;else{const k=SEARCH[i];if(!words.every(w=>k.includes(w)))continue;
   const city=norm(a.city),name=norm(a.name);sc=(a.code.toLowerCase().startsWith(q)||a.icao.toLowerCase().startsWith(q)?300:0)+(city.startsWith(q)?200:city.includes(q)?80:0)+(name.startsWith(q)?120:name.includes(q)?40:0);}
  out.push([sc+a.size*25,a]);}
 return out.sort((x,y)=>y[0]-x[0]).slice(0,limit||20).map(x=>x[1]);}
const apLine=a=>`<b class="mono">${a.code}</b> ${esc(a.city)}${a.state&&a.state!==a.city?', '+esc(a.state):''} · <span class="mute">${esc(a.name)} · ${a.cc}</span>`;


/* ---------- chart ---------- */
function drawChart(){const c=$('#chart');if(!c)return;const g=c.getContext('2d');const w=c.clientWidth,h=170,dpr=Math.min(2,window.devicePixelRatio||1);
 c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 const data=S.hist.slice(-26);if(!data.length){g.fillStyle=css('--mute');g.font=`13px ${css('--f-body')}`;g.fillText('No weeks flown yet.',8,24);return;}
 const pad={l:52,r:8,t:10,b:22};const max=Math.max(1,...data.map(d=>d.profit)),min=Math.min(0,...data.map(d=>d.profit));
 const y=v=>pad.t+(max-v)/(max-min)*(h-pad.t-pad.b);const bw=(w-pad.l-pad.r)/26;
 g.font=`11px ${css('--f-mono')}`;g.textBaseline='middle';g.fillStyle=css('--mute');g.strokeStyle=css('--line');g.lineWidth=1;
 [max,(max+min)/2,min].forEach(v=>{g.globalAlpha=.6;g.beginPath();g.moveTo(pad.l,y(v));g.lineTo(w-pad.r,y(v));g.stroke();g.globalAlpha=1;g.fillText(money(v),2,y(v));});
 g.strokeStyle=css('--mute');g.beginPath();g.moveTo(pad.l,y(0));g.lineTo(w-pad.r,y(0));g.stroke();
 data.forEach((d,i)=>{const x=pad.l+i*bw+bw*0.15;g.fillStyle=d.profit>=0?css('--good'):css('--bad');const y0=y(0),y1=y(d.profit);g.fillRect(x,Math.min(y0,y1),bw*0.7,Math.max(1,Math.abs(y1-y0)));});
 g.fillStyle=css('--mute');g.textBaseline='alphabetic';g.fillText('W'+data[0].w,pad.l,h-5);const lt='W'+data[data.length-1].w;g.fillText(lt,w-pad.r-g.measureText(lt).width,h-5);}

/* ---------- boot ---------- */
(function boot(){const saved=load();if(saved&&!saved.over){S=saved;ensureAnchor(S,false);setView(viewFor(S.hubs[0]));UI.from=S.hubs[0];render();showStart();}else{showStart();}})();
document.fonts&&document.fonts.ready.then(()=>{if(S)render();});
</script>
