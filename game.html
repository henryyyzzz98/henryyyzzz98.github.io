<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jyuubin318 Spin Simulator 2.0</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>

    <div class="page">
        <main class="game-main">
            <h1 id="spinStatus"></h1>
            <p id="spinResult">Select an Objekt</p>

            <div class="game-panel">
                <div class="container" id="card-container"></div>
            </div>

            <div class="button-container">
                <button id="confirm-btn" onclick="revealCard()">Select</button>

                <button
                    id="try-again-btn"
                    onclick="window.location.href='index.html'"
                    style="display:none;">
                    Try Again
                </button>
            </div>
        </main>
    </div>
    
    <div id="revealModal" class="reveal-modal hidden">
    
    <div class="reveal-card">
        <div id="revealInner" class="reveal-inner">

            <div class="reveal-front">
                <img src="images/spincard.png" alt="">
            </div>

            <div class="reveal-back">
                <img id="revealImage" src="">
            </div>

        </div>
    </div>
</div>

    <script src="js/reveal-engine.js"></script>
    <script src="js/game-loader.js"></script>
</body>
</html>
