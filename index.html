<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jyuubin318 Spin Simulator 2.0</title>

    <link rel="stylesheet" href="css/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-glow"></div>

    <div class="page">
      <header class="header">
        <button class="back-btn" onclick="location.href='oldindex.html'">
            Old Index Page
        </button>

        <div class="currency">
          <div class="pill">
            <img src="images/spin-ticket.png" class="pill-icon" />
            <span>999</span>
          </div>
        </div>
      </header>

      <main>
        <h1>Select an Objekt to spin</h1>

        <div class="spin-area">
          <div class="track"></div>

          <div class="selector">
            <div class="selector-inner">
              <button id="selectButton" class="plus">+</button>

              <img id="selectedObjekt" class="selected-image" hidden />
            </div>
          </div>
        </div>

        <button id="spinButton" class="spin-button">Spin</button>
      </main>

      <footer>
        <div class="notice">
          <div class="notice-icon">i</div>

          <div>
            <strong>jyuubin318 Spin Simulator 2.0</strong>

            <p>
              Fanmade spin simulator by jyuubin318. Not affiliated with MODHAUS
              / COSMO. No real objekts will be generated.
            </p>
          </div>
        </div>
      </footer>
    </div>

    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
