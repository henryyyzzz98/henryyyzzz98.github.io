<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primordia — Element Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0c16;--panel:#141224;--line:#2b2645;--muted:#8a84a6;--gold:#f5c451;--hot:#ff7a59;--teal:#5fd4c4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:#ece9f7;font-family:"DM Sans",system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 20% 0%,#241c44 0%,transparent 60%),radial-gradient(900px 600px at 90% 100%,#2a1530 0%,transparent 60%),var(--bg);background-attachment:fixed}
  header{position:sticky;top:0;z-index:20;background:rgba(14,12,22,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1200px;margin:0 auto}
  h1{margin:0;font-family:Fraunces,serif;font-weight:800;font-size:24px;background:linear-gradient(90deg,var(--gold),var(--hot) 60%,#c57bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .sub b{color:#fff}
  a.back{color:#ddd8f3;text-decoration:none;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
  .controls{display:flex;gap:8px;max-width:1200px;margin:10px auto 0;flex-wrap:wrap}
  #search{flex:1;min-width:160px;background:#0f0d1c;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 11px;font:15px "DM Sans";outline:none}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);font:500 12px "DM Sans";padding:8px 10px;cursor:pointer}
  .seg button.on{background:#2a2450;color:#fff}
  main{max-width:1200px;margin:0 auto;padding:18px 14px 60px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
  @media (max-width:520px){#grid{grid-template-columns:repeat(2,1fr);gap:12px}}
  #status{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}

  /* ---- Trading card ---- */
  .tc{position:relative;aspect-ratio:5/7;border-radius:14px;padding:7px;cursor:pointer;
    background:linear-gradient(145deg,#3a3360,#1d1934);box-shadow:0 10px 26px rgba(0,0,0,.45);transition:transform .18s;user-select:none}
  .tc:hover{transform:translateY(-3px)}
  .tc .in{position:relative;height:100%;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;background:#fbf7ef;color:#1d1830}
  .tc .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 4px;font:700 10.5px "JetBrains Mono",monospace;letter-spacing:.5px}
  .tc .serial{background:#1d1830;color:#fbf7ef;border-radius:5px;padding:2px 6px}
  .tc .tier{color:#6b6390;font-size:9.5px;text-transform:uppercase}
  .tc .art{margin:0 7px;flex:1;border-radius:7px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
  .tc .art .em{font-size:clamp(44px,13vw,62px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));position:relative;z-index:1}
  .tc .art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 55%)}
  .tc .name{font-family:Fraunces,serif;font-weight:800;font-size:15px;line-height:1.15;padding:7px 9px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc .recipe{font-size:10.5px;color:#6b6390;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tc .foot{display:flex;justify-content:space-between;font:500 9px "JetBrains Mono",monospace;color:#9a93b8;padding:5px 9px 7px}
  .tc .got{position:absolute;top:30px;right:12px;z-index:3;background:var(--teal);color:#0d2b27;font:700 9px "DM Sans";padding:2px 6px;border-radius:20px;letter-spacing:.4px}
  .tc.missing .in{filter:saturate(.25) brightness(.92)}
  .tc.genesis{background:linear-gradient(135deg,#f5c451,#ff9f43 40%,#c57bff 70%,#5fd4c4)}
  .tc.genesis .serial{background:linear-gradient(90deg,#b8862a,#e0a93a);color:#1d1830}
  .tc.genesis .in{background:linear-gradient(180deg,#fff8e4,#fbf0d4)}
  .tc.early{background:linear-gradient(145deg,#cfd6e6,#7d87a3)}

  /* ---- Big card modal ---- */
  #modal{position:fixed;inset:0;z-index:50;background:rgba(5,4,10,.78);display:none;align-items:center;justify-content:center;padding:20px;perspective:900px}
  #modal.show{display:flex}
  #big{width:min(300px,78vw);transition:transform .1s;transform-style:preserve-3d}
  #big .tc{cursor:default;transform:none}
  #big .tc .art .em{font-size:110px}
  #big .tc .name{font-size:24px;padding-top:10px}
  #big .tc .recipe{font-size:13px}
  #big .tc .desc{font-size:12.5px;font-style:italic;color:#4a4368;padding:6px 10px 0;line-height:1.35}
  #big .tc .bar{font-size:13px;padding:9px 10px 6px}
  #big .tc .foot{font-size:11px;padding:8px 10px 10px}
  #big .tc .got{top:42px;font-size:11px}
  .shine{position:absolute;inset:0;border-radius:14px;pointer-events:none;mix-blend-mode:overlay;opacity:.7;z-index:4}
  .closeHint{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Element Gallery</h1>
      <div class="sub"><b id="total">–</b> elements discovered worldwide · you've collected <b id="mine">–</b></div>
    </div>
    <a class="back" href="./">← Back to crafting</a>
  </div>
  <div class="controls">
    <input id="search" placeholder="Search elements or No. 0042…" autocomplete="off">
    <div class="seg" id="filter">
      <button data-v="all" class="on">All</button><button data-v="mine">Collected</button><button data-v="missing">Not yet</button>
    </div>
    <div class="seg" id="sort">
      <button data-v="asc" class="on">No. ↑</button><button data-v="desc">Newest</button>
    </div>
  </div>
</header>
<main>
  <div id="grid"></div>
  <div id="status">Loading the gallery…</div>
  <div id="sentinel"></div>
</main>
<div id="modal"><div id="big"></div><div class="closeHint">Tap anywhere to close</div></div>

<script>
(() => {
  // Same Worker address as the game.
  const API_URL = "https://primordia.henrylai543.workers.dev";
  const SAVE_KEY = "primordia.v1";
  const GENESIS = [
    {serial:1,name:"Water",emoji:"💧",desc:"Where it all began."},
    {serial:2,name:"Fire",emoji:"🔥",desc:"Where it all began."},
    {serial:3,name:"Earth",emoji:"🌍",desc:"Where it all began."},
    {serial:4,name:"Air",emoji:"💨",desc:"Where it all began."}
  ];

  let all = [...GENESIS];
  const emojiByName = new Map(GENESIS.map(e=>[e.name.toLowerCase(), e.emoji]));
  let mine = new Set();
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if(s && Array.isArray(s.elements)) s.elements.forEach(e=>mine.add(String(e.name).toLowerCase()));
  }catch(e){}
  GENESIS.forEach(g=>mine.add(g.name.toLowerCase()));

  let filter="all", sort="asc", query="";
  let view=[], shown=0; const PAGE=60;

  const grid=document.getElementById("grid"), status=document.getElementById("status");
  const pad = n => "No. " + String(n).padStart(4,"0");
  const tierOf = n => n<=4 ? "Genesis" : n<=100 ? "Early" : "Common";
  function hue(s){ let h=0; for(const c of s) h=(h*31+c.codePointAt(0))>>>0; return h%360; }
  function fmtDate(t){ if(!t) return "The Beginning"; const d=new Date(t); return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }

  function cardEl(e, big){
    const owned = mine.has(e.name.toLowerCase());
    const tc = document.createElement("div");
    tc.className = "tc" + (e.serial<=4?" genesis":e.serial<=100?" early":"") + (owned||big?"":" missing");
    const h = hue(e.name);
    const recipe = e.serial<=4 ? "Primordial element" :
      (e.a && e.b ? `${emojiByName.get(e.a.toLowerCase())||"✨"} ${e.a} + ${emojiByName.get(e.b.toLowerCase())||"✨"} ${e.b}` : "Recipe unknown");
    tc.innerHTML = `<div class="in">
      <div class="bar"><span class="serial"></span><span class="tier"></span></div>
      <div class="art" style="background:linear-gradient(160deg,hsl(${h} 70% 82%),hsl(${(h+40)%360} 65% 62%))"><span class="em"></span></div>
      <div class="name"></div><div class="recipe"></div>${big?'<div class="desc"></div>':''}
      <div class="foot"><span class="date"></span><span>PRIMORDIA</span></div></div>`;
    tc.querySelector(".serial").textContent = pad(e.serial);
    tc.querySelector(".tier").textContent = tierOf(e.serial);
    tc.querySelector(".em").textContent = e.emoji || "✨";
    tc.querySelector(".name").textContent = e.name;
    tc.querySelector(".recipe").textContent = recipe;
    tc.querySelector(".date").textContent = fmtDate(e.t);
    if(big && tc.querySelector(".desc")) tc.querySelector(".desc").textContent = e.desc ? `“${e.desc}”` : "";
    if(owned){ const g=document.createElement("div"); g.className="got"; g.textContent="✓ COLLECTED"; tc.appendChild(g); }
    if(!big) tc.addEventListener("click", ()=>openBig(e));
    return tc;
  }

  function rebuild(){
    const q = query.trim().toLowerCase();
    const num = q.replace(/^no\.?\s*/,"");
    view = all.filter(e=>{
      const owned = mine.has(e.name.toLowerCase());
      if(filter==="mine" && !owned) return false;
      if(filter==="missing" && owned) return false;
      if(!q) return true;
      if(/^\d+$/.test(num)) return String(e.serial).includes(String(parseInt(num)));
      return e.name.toLowerCase().includes(q);
    });
    if(sort==="desc") view.reverse();
    grid.innerHTML=""; shown=0; more();
    if(!view.length) { status.style.display="block"; status.textContent = filter==="mine" ? "Nothing collected matches that." : "No elements match that."; }
  }
  function more(){
    const frag=document.createDocumentFragment();
    for(const e of view.slice(shown, shown+PAGE)) frag.appendChild(cardEl(e,false));
    grid.appendChild(frag); shown=Math.min(view.length, shown+PAGE);
    if(view.length) status.style.display="none";
  }
  new IntersectionObserver(es=>{ if(es[0].isIntersecting && shown<view.length) more(); },{rootMargin:"600px"}).observe(document.getElementById("sentinel"));

  // Big card with tilt + shine
  const modal=document.getElementById("modal"), big=document.getElementById("big");
  function openBig(e){
    big.innerHTML=""; const c=cardEl(e,true);
    const shine=document.createElement("div"); shine.className="shine"; c.appendChild(shine);
    big.appendChild(c); modal.classList.add("show");
    const tilt=(x,y)=>{ const r=big.getBoundingClientRect(); const px=(x-r.left)/r.width-.5, py=(y-r.top)/r.height-.5;
      big.style.transform=`rotateY(${px*18}deg) rotateX(${-py*18}deg)`;
      shine.style.background=`radial-gradient(circle at ${(px+.5)*100}% ${(py+.5)*100}%, rgba(255,255,255,.75), transparent 55%)`; };
    modal.onpointermove = ev=>tilt(ev.clientX,ev.clientY);
    big.style.transform="";
  }
  modal.addEventListener("click", ()=>{ modal.classList.remove("show"); big.style.transform=""; });

  document.getElementById("search").addEventListener("input", e=>{ query=e.target.value; rebuild(); });
  for(const id of ["filter","sort"]){
    document.getElementById(id).addEventListener("click", ev=>{
      const b=ev.target.closest("button"); if(!b) return;
      document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove("on")); b.classList.add("on");
      if(id==="filter") filter=b.dataset.v; else sort=b.dataset.v; rebuild();
    });
  }

  function updateCounts(total){
    document.getElementById("total").textContent = total.toLocaleString();
    document.getElementById("mine").textContent = all.filter(e=>mine.has(e.name.toLowerCase())).length.toLocaleString();
  }

  async function load(){
    rebuild(); updateCounts(4);
    if(!API_URL){ status.style.display="block"; status.textContent="The gallery needs the Worker address set in gallery.html."; return; }
    let offset=0, total=4;
    try{
      while(true){
        const res = await fetch(`${API_URL}/elements?limit=1000&offset=${offset}`);
        if(!res.ok) throw new Error(res.status);
        const data = await res.json();
        total = data.total;
        for(const it of data.items){ all.push(it); emojiByName.set(it.name.toLowerCase(), it.emoji); }
        offset += data.items.length;
        rebuild(); updateCounts(total);
        if(!data.items.length || all.length >= total) break;
      }
    }catch(e){
      status.style.display="block";
      status.textContent = "Couldn't reach the recipe book right now. Showing the four primordial elements.";
    }
  }
  load();
})();
</script>
</body>
</html>
