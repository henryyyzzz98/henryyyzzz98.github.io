name: Publish site

# Puts your site live on GitHub Pages — usually within 1–2 minutes.
# Runs on every push you make (never waits for the crawler) and after each crawler run.
# It combines your files from main with the crawler's data from the "data" branch.
#
# ONE-TIME SETUP: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cut a deployment off halfway (GitHub Pages then refuses the next one). A newer publish waits
  # for the current one, and if several are waiting, only the newest runs.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the crawler's data
        continue-on-error: true    # fine before the crawler's first run
        uses: actions/checkout@v4
        with:
          ref: data
          path: store

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: |
          if [ -d store/data/meta ]; then export DATA_DIR=store/data; fi
          node scripts/build-site.mjs

      - uses: actions/configure-pages@v5
      # a unique name per attempt, so pressing "Re-run" doesn't trip over the first attempt's copy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # GitHub sometimes refuses a deployment right after another one — wait and try once more
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
