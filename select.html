<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objekt Selection Page</title>
    <link rel="stylesheet" href="css/select.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <button id="backButton" class="back-button"><</button>
        <h1>Select Objekt</h1>
        <div class="header-spacer"></div>
      </header>

      <div class="tabs">
        <button class="tab active" data-group="artms">ARTMS</button>
        <button class="tab" data-group="idntt">idntt</button>
        <button class="tab" data-group="triples">tripleS</button>
      </div>

      <div class="search-wrapper">
        <input id="search" type="text" placeholder="Search collection no." />
      </div>

      <div class="filters">
        <select id="memberFilter">
          <option value="">Select Member</option>
        </select>

        <select id="seasonFilter">
          <option value="">Select Season</option>
        </select>
      </div>

      <div id="loading" class="loading">Loading Objekts...</div>

      <div id="grid" class="grid"></div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/select.js"></script>
  </body>
</html>
