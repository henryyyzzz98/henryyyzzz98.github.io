<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Preview Studio: a free in-browser photo editor for K-pop fansite previews.">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Fansite Preview Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Caveat:wght@400;700&family=Space+Mono:wght@400;700&family=Gowun+Dodum&family=Bebas+Neue&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: dark darkroom stage on the left, tool rail on the right; stacks to stage → filmstrip → tabs on phones.
   Deliberately single dark theme: a neutral grey surround keeps colour judgments honest. */
:root{
  --bg:#111113; --surface:#19191c; --raise:#232328; --line:#33333a;
  --fg:#ececf0; --muted:#9a9aa5; --accent:#ff8fb3; --accent-ink:#2b0d18;
  --display:"Instrument Serif", Georgia, serif;
  --ui:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1360px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto auto 1fr;grid-template-areas:"head head" "stage panel" "strip panel"}
.strip{align-self:start}
header{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.stagewrap{grid-area:stage;display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;background:#0a0a0b;border:1px solid var(--line);border-radius:12px;min-height:360px;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.frame{position:relative;line-height:0;display:inline-block;max-width:100%}
#view{display:block;max-width:100%;max-height:68vh;width:auto;height:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#view.pan{cursor:grab;touch-action:none}
#view.pan.grabbing{cursor:grabbing}
#view.zoomable{cursor:zoom-in}
#view.paint{cursor:crosshair;touch-action:none}
.maskui{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.maskui [data-k]{pointer-events:all;cursor:grab;touch-action:none}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:6px;align-items:center}
.mrow .chip{flex:1;text-align:left;border-radius:8px}
.mrow .mini{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer}
.mrow .mini.armed{background:#d23c5a;border-color:#d23c5a;color:#fff}
.mrow .chip.off{opacity:.5;text-decoration:line-through}
.savestate{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.savestate::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5fd08a;margin-right:6px;vertical-align:1px}
.savestate.off::before{background:#d2a03c}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cropbox{position:absolute;pointer-events:auto;touch-action:none;cursor:move;outline:1px solid rgba(255,255,255,.9);box-shadow:0 0 0 9999px rgba(0,0,0,.58);
  background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35));
  background-size:100% 1px,100% 1px,1px 100%,1px 100%;background-position:0 33.33%,0 66.66%,33.33% 0,66.66% 0;background-repeat:no-repeat}
.handle{position:absolute;width:26px;height:26px;touch-action:none}
.handle::after{content:"";position:absolute;width:14px;height:14px;border:3px solid var(--accent)}
.handle[data-h=tl]{left:-6px;top:-6px;cursor:nwse-resize}.handle[data-h=tl]::after{left:3px;top:3px;border-right:0;border-bottom:0}
.handle[data-h=tr]{right:-6px;top:-6px;cursor:nesw-resize}.handle[data-h=tr]::after{right:3px;top:3px;border-left:0;border-bottom:0}
.handle[data-h=bl]{left:-6px;bottom:-6px;cursor:nesw-resize}.handle[data-h=bl]::after{left:3px;bottom:3px;border-right:0;border-top:0}
.handle[data-h=br]{right:-6px;bottom:-6px;cursor:nwse-resize}.handle[data-h=br]::after{right:3px;bottom:3px;border-left:0;border-top:0}
.compare{position:absolute;right:12px;bottom:12px;user-select:none;-webkit-user-select:none;touch-action:none;background:rgba(17,17,19,.78);backdrop-filter:blur(6px)}
.compare.on{background:var(--accent);color:var(--accent-ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted);padding:40px 10px}
.empty strong{font-family:var(--display);font-style:italic;font-weight:400;font-size:28px;color:var(--fg)}
.readout{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.readout b{color:var(--fg);font-weight:500}
.readout .look{color:var(--accent)}
.strip{grid-area:strip;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:stretch}
.thumb{position:relative;flex:0 0 auto;height:76px;border-radius:8px;border:2px solid transparent;background:var(--surface);cursor:pointer;padding:0;line-height:0;overflow:hidden}
.thumb canvas{height:72px;width:auto;display:block}
.thumb.cur{border-color:var(--accent)}
.thumb .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:20px;cursor:pointer;padding:0}
.thumb .n{position:absolute;left:5px;bottom:4px;font-family:var(--mono);font-size:10px;line-height:1;color:#fff;background:rgba(0,0,0,.55);padding:2px 4px;border-radius:3px}
.addthumb{flex:0 0 76px;height:76px;border:1.5px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
.addthumb:hover{border-color:var(--accent);color:var(--fg)}
aside{grid-area:panel;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px)}
.tabs{display:flex;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;padding:12px 5px 10px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.01em}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.panel{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:10px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gh h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.link{background:none;border:0;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.srow label{font-size:13px;font-weight:500;cursor:default;user-select:none}
.srow output{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5ch;text-align:right}
.srow input[type=range]{grid-column:1/-1;width:100%}
input[type=range]{accent-color:var(--accent);height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{background:var(--raise);border:2px solid transparent;border-radius:8px;padding:0 0 6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;overflow:hidden;position:relative;min-width:0}
.pt canvas{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.pt span{font-size:11.5px;font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pt[aria-pressed=true]{border-color:var(--accent)}
.pt .del{position:absolute;top:4px;right:4px;border:0;border-radius:4px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 6px;cursor:pointer}
.pt .del.armed{background:#d23c5a}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12.5px;font-weight:500;color:var(--muted)}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.posgrid{display:grid;grid-template-columns:repeat(3,30px);gap:4px}
.posgrid button{width:30px;height:24px;border:1px solid var(--line);background:var(--raise);border-radius:4px;cursor:pointer;padding:0;position:relative}
.posgrid button::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--muted);left:50%;top:50%;transform:translate(-50%,-50%)}
.posgrid button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.posgrid button[aria-pressed=true]::after{background:var(--accent-ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:500}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px}
.status{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-height:1.4em}
.divider{height:1px;background:var(--line)}
.toast button{margin-left:12px;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.aibox{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.aibox.busy{border-color:var(--accent)}
.aibox .row{justify-content:space-between}
.inp.area{min-height:64px;resize:vertical;font-family:var(--ui)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);padding:10px 14px;border-radius:9px;font-size:13px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet img{max-width:100%;max-height:72vh;border-radius:6px}
.sheet p{margin:0;color:var(--fg);text-align:center}
body.drag .stage{border-color:var(--accent);border-style:dashed}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"head" "stage" "strip" "panel"}
  aside{position:static;max-height:none}
  #view{max-height:52vh}
  .stage{min-height:260px;padding:10px}
  .brand h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Preview Studio</h1><span>Fansite photo editor</span></div>
    <div class="row">
      <span class="savestate" id="saveState" aria-live="polite">Loading…</span>
      <button class="btn primary" id="addBtn" type="button">+ Add photos</button>
    </div>
  </header>

  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas id="view" width="10" height="10" aria-label="Photo preview"></canvas>
        <div class="overlay" id="overlay" hidden>
          <div class="cropbox" id="cropbox" data-h="move">
            <div class="handle" data-h="tl"></div><div class="handle" data-h="tr"></div>
            <div class="handle" data-h="bl"></div><div class="handle" data-h="br"></div>
          </div>
        </div>
        <svg class="maskui" id="maskui" preserveAspectRatio="none" style="display:none" aria-hidden="true"></svg>
      </div>
      <div class="empty" id="empty" hidden>
        <strong>No photos yet</strong>
        <span>Add one photo or a whole set. Everything stays on your device.</span>
        <button class="btn primary" type="button" id="emptyAdd">+ Add photos</button>
      </div>
      <button class="btn compare" id="compare" type="button">Hold to compare</button>
    </div>
    <div class="readout" id="readout"></div>
  </div>

  <div class="strip" id="strip" aria-label="Photos in this batch"></div>

  <aside>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="crop">Crop</button>
      <button role="tab" data-t="ai">AI</button>
      <button role="tab" data-t="colour">Colour</button>
      <button role="tab" data-t="detail">Detail</button>
      <button role="tab" data-t="masks">Masks</button>
      <button role="tab" data-t="presets">Presets</button>
      <button role="tab" data-t="effects">Effects</button>
      <button role="tab" data-t="wm">Mark</button>
      <button role="tab" data-t="export">Export</button>
    </div>
    <div class="panel" id="panel"></div>
  </aside>
</div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="logoIn" accept="image/png,image/webp,image/svg+xml,image/jpeg" hidden>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="Exported photo">
  <p id="sheetMsg">Long-press (phone) or right-click (computer) the image to save it.</p>
  <button class="btn" type="button" id="sheetClose">Close</button>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const isPhone = () => window.innerWidth < 860;

/* ---------- defaults ---------- */
const ADJ0 = {brightness:0,contrast:0,highlights:0,shadows:0,fade:0,saturation:0,vibrance:0,warmth:0,tint:0};
const FX0  = {grain:0,glow:0,vignette:0,leak:0,leakColor:'peach'};
const DET0 = {sharpen:0,radius:10,detail:25,masking:0,nr:0,nrDetail:50,color:0};
const TABS = ['crop','ai','colour','detail','masks','presets','effects','wm','export'];
const LADJ0 = {exposure:0,contrast:0,highlights:0,shadows:0,texture:0,saturation:0,warmth:0,tint:0};
const MASK_LOOKS = [
  ['Brighten face',{exposure:25,shadows:15,highlights:-5}],
  ['Soften skin',{texture:-60,contrast:-6,exposure:4}],
  ['Darken background',{exposure:-35,saturation:-15}],
  ['Pop colour',{saturation:30,contrast:10}],
];
const LEAKS = {peach:[255,168,118],pink:[255,118,170],gold:[255,208,110],lilac:[188,150,255],blue:[118,170,255]};
const PRESETS = [
  {name:'Original', adj:{}, fx:{}},
  {name:'Milk', adj:{brightness:22,contrast:-12,highlights:-10,shadows:25,saturation:-12,warmth:4,tint:6,fade:18}, fx:{glow:15,vignette:-18}},
  {name:'Peach', adj:{brightness:10,contrast:4,shadows:10,saturation:6,warmth:22,tint:10,fade:10}, fx:{glow:10,leak:30,leakColor:'peach'}},
  {name:'Pink Mood', adj:{brightness:12,contrast:-5,highlights:-8,saturation:5,vibrance:10,warmth:6,tint:28,fade:12}, fx:{glow:18,leak:20,leakColor:'pink'}},
  {name:'Cool Blue', adj:{brightness:8,contrast:8,shadows:12,saturation:-8,warmth:-26,tint:-4,fade:8}, fx:{vignette:10}},
  {name:'Film', adj:{contrast:14,highlights:-14,shadows:8,saturation:-14,warmth:10,tint:-4,fade:24}, fx:{grain:28,vignette:22}},
  {name:'Mono', adj:{contrast:18,shadows:6,saturation:-100,fade:8}, fx:{grain:18,vignette:20}},
  {name:'Dreamy', adj:{brightness:18,contrast:-16,highlights:-12,saturation:-4,vibrance:12,tint:12,fade:20}, fx:{glow:45,vignette:-25,leak:15,leakColor:'lilac'}},
  {name:'Stage', adj:{contrast:20,highlights:-25,shadows:18,saturation:6,vibrance:25,warmth:-6,tint:8}, fx:{glow:12,vignette:25}},
];
const ASPECTS = [['free','Free'],['orig','Original'],['1:1','1:1'],['4:5','4:5'],['3:4','3:4'],['2:3','2:3'],['3:2','3:2'],['16:9','16:9'],['9:16','9:16']];
const FONTS = ['Montserrat','Playfair Display','Caveat','Space Mono','Bebas Neue','Gowun Dodum'];
const BOLDABLE = {'Montserrat':1,'Playfair Display':1,'Caveat':1,'Space Mono':1};

/* ---------- storage ---------- */
const KEY='fps.v1';
let saved={}; try{ saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ saved={}; }
const S = {
  photos:[], cur:0, tab:'colour', comparing:false, zoom:'100', loupe:{x:.5,y:.4}, showMask:false, lastLoupe:null, maskOverlay:true, brush:{size:8,feather:60,erase:false},
  wm: Object.assign({on:true,text:'© YOUR FANSITE',sub:'DO NOT EDIT · DO NOT CROP LOGO',font:'Montserrat',bold:true,color:'#ffffff',opacity:80,size:4,pos:'br',margin:3,shadow:true,
        logo:null,logoSize:14,logoOpacity:90,logoPos:'bl'}, saved.wm||{}),
  exp: Object.assign({format:'jpg',quality:92,size:'2048',prefix:'preview'}, saved.exp||{}),
  custom: Array.isArray(saved.custom)?saved.custom:[],
};
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify({wm:S.wm,exp:S.exp,custom:S.custom})); }catch(e){
  try{ const wm=Object.assign({},S.wm,{logo:null}); localStorage.setItem(KEY, JSON.stringify({wm,exp:S.exp,custom:S.custom})); }catch(e2){} } }
let logoImg=null;
if(S.wm.logo){ const im=new Image(); im.onload=()=>{logoImg=im;requestRender();}; im.src=S.wm.logo; }

/* ---------- downloads capability ---------- */
const dlP = (async()=>{ try{ return (window.claude && window.claude.use) ? (await window.claude.use('downloads')) : null; }catch(e){ return null; } })();

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function mk(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return c; }
function scaled(src,max){ const k=Math.min(1,max/Math.max(src.width,src.height)); const c=mk(src.width*k,src.height*k); const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(src,0,0,c.width,c.height); return c; }
function toast(msg,ms=2600,action){ const t=$('#toast'); t.textContent=msg;
  if(action){ const b=document.createElement('button'); b.type='button'; b.textContent=action.label; b.onclick=()=>{ t.hidden=true; action.fn(); }; t.appendChild(b); ms=Math.max(ms,5000); }
  t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,ms); }
function cur(){ return S.photos[S.cur]; }

/* ---------- photos ---------- */
function addPhoto(srcEl,w,h,name,opts={}){
  const k=Math.min(1,4096/Math.max(w,h));
  const src=mk(w*k,h*k); const x=src.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(srcEl,0,0,src.width,src.height);

}
async function loadFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if(!list.length){ toast('Those files aren’t images. Try JPG, PNG, WEBP or HEIC.'); return; }
  const first=S.photos.length; let bad=0;
  for(const f of list){
    const url=URL.createObjectURL(f);
    try{ const im=new Image(); im.src=url; await im.decode(); addPhoto(im,im.naturalWidth,im.naturalHeight,f.name.replace(/\.[^.]+$/,'')); }
    catch(e){ bad++; } finally{ URL.revokeObjectURL(url); }
  }
  if(S.photos.length>first){ S.cur=first; }
  if(bad) toast(bad+' file'+(bad>1?'s':'')+' couldn’t be opened by this browser.');
  else toast(list.length+' photo'+(list.length>1?'s':'')+' added');
  buildStrip(); buildPanel(); requestRender(true);
}

    if(m.type==='radial'){ [g.cx,g.cy]=T(g.cx,g.cy); if(!flip) [g.rx,g.ry]=[g.ry,g.rx]; }

    const b=mk(Math.max(1,W/24),Math.max(1,H/24)); b.getContext('2d').drawImage(a,0,0,b.width,b.height);
    ctx.save(); ctx.globalCompositeOperation='screen'; ctx.globalAlpha=fx.glow/100*0.55; ctx.imageSmoothingQuality='high'; ctx.drawImage(b,0,0,W,H); ctx.restore();

    gr.addColorStop(0,`rgba(${r},${g},${b},1)`); gr.addColorStop(0.45,`rgba(${r},${g},${b},.45)`); gr.addColorStop(1,`rgba(${r},${g},${b},0)`);

const MIME={jpg:'image/jpeg',png:'image/png',webp:'image/webp'};
function blobOf(p){
  return new Promise((res,rej)=>{
    const [ew,eh]=exportDims(p), c=mk(1,1);
    renderTo(c,p,p.crop,Math.max(ew,eh),{adj:true,wm:true,full:true});
    c.toBlob(b=>b?res(b):rej(new Error('encode')),MIME[S.exp.format],S.exp.quality/100);
  });
}
const fname=(i)=>`${(S.exp.prefix||'preview').trim()||'preview'}_${String(i+1).padStart(2,'0')}.${S.exp.format}`;
async function saveBlob(name,blob,isImage){
  const dl=await dlP;
  if(dl){
    try{ await dl.save({filename:name,data:blob}); toast('Saved '+name); return; }
    catch(err){
      const c=err&&err.code;
      if(c==='declined'){ toast('Save cancelled'); return; }
      if(c==='rate_limited'){ toast('Another save is still open. Finish that one first.'); return; }
      if(c==='too_large'){ toast('That file is too large here. Try a smaller long side.'); return; }
    }
  }
  if(!window.claude){ // self-hosted: a normal browser download
    const a=document.createElement('a'), u=URL.createObjectURL(blob); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000); toast('Saved '+name); return; }
  if(isImage){ const im=$('#sheetImg'); if(im.src.startsWith('blob:')) URL.revokeObjectURL(im.src); im.src=URL.createObjectURL(blob); $('#sheet').hidden=false; }
  else toast('ZIP saving needs the Claude viewer. Save photos one at a time instead.',4000);
}

async function exportAll(btn){
  if(!S.photos.length) return; await loadFont();
  if(!window.JSZip){ toast('ZIP tool didn’t load. Check your connection and reload.'); return; }

function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

    g.addColorStop(0,'rgba(255,255,255,.22)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.beginPath(); x.moveTo(sx-6,0); x.lineTo(sx+6,0); x.lineTo(ex+sp,H*.85); x.lineTo(ex-sp,H*.85); x.fill(); }
  for(let i=0;i<80;i++){ const r=W*(.01+.04*R()), cx=W*R(), cy=H*.75*R(), col=pal.dots[(R()*pal.dots.length)|0], a=.12+.4*R();
    const g=x.createRadialGradient(cx,cy,0,cx,cy,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(.7,`rgba(${col},${a*.6})`); g.addColorStop(1,`rgba(${col},0)`); x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); }
  x.globalCompositeOperation='source-over';
  for(let row=0;row<3;row++){ const base=H*(.84+row*.055), hr=W*(.032+row*.006);
    for(let i=-1;i<W/(hr*2.2)+1;i++){ const cx=i*hr*2.3+(row%2)*hr+R()*hr*.6, cy=base+R()*hr*.5;
      if(R()<.45){ const sx=cx+hr*.3, top=cy-hr*(2.4+R()*1.6), col=pal.stick;
        x.strokeStyle='rgba(20,20,26,1)'; x.lineWidth=hr*.18; x.beginPath(); x.moveTo(sx,cy); x.lineTo(sx,top); x.stroke();
        x.globalCompositeOperation='lighter'; const g=x.createRadialGradient(sx,top,0,sx,top,hr*1.6); g.addColorStop(0,`rgba(${col},.95)`); g.addColorStop(.25,`rgba(${col},.5)`); g.addColorStop(1,`rgba(${col},0)`);
        x.fillStyle=g; x.beginPath(); x.arc(sx,top,hr*1.6,0,7); x.fill(); x.globalCompositeOperation='source-over'; }
      x.fillStyle=`rgb(${10+row*2},${10+row*2},${16+row*3})`; x.beginPath(); x.arc(cx,cy,hr,0,7); x.fill(); x.fillRect(cx-hr*1.25,cy+hr*.7,hr*2.5,H); } }
  return c;
}
/* ---------- autosave (IndexedDB, this device only) ---------- */
let idb=null, saveT=0, saveWarned=false;
function idbOpen(){ return new Promise(res=>{ const to=setTimeout(()=>res(null),3000);
  try{ const r=indexedDB.open('preview-studio',1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs'); if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta'); };
    r.onsuccess=()=>{ clearTimeout(to); res(r.result); }; r.onerror=()=>{ clearTimeout(to); res(null); }; r.onblocked=()=>{ clearTimeout(to); res(null); };
  }catch(e){ clearTimeout(to); res(null); } }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{ if(!idb){ rej(new Error('no db')); return; }
  try{ const t=idb.transaction(store,mode), req=fn(t.objectStore(store)); t.oncomplete=()=>res(req&&req.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }catch(e){ rej(e); } }); }
function idbPut(st,k,v){ return tx(st,'readwrite',s=>s.put(v,k)); }
function idbGet(st,k){ return tx(st,'readonly',s=>s.get(k)); }
function idbDel(st,k){ return tx(st,'readwrite',s=>s.delete(k)); }
function idbKeys(st){ return tx(st,'readonly',s=>s.getAllKeys()); }
function idbClear(st){ return tx(st,'readwrite',s=>s.clear()); }
function saveFailed(){ const s=$('#saveState'); s.textContent='Not autosaving'; s.classList.add('off');
  if(!saveWarned){ saveWarned=true; toast('Couldn’t autosave. This browser’s storage is full or blocked, so export before closing.',5000); } }
function storeSrc(p){ if(!idb) return; p.src.toBlob(b=>{ if(b) idbPut('blobs',p.id,b).catch(saveFailed); },'image/jpeg',0.95); }
function scheduleSave(){ clearTimeout(saveT); saveT=setTimeout(saveSession,400); }
async function saveSession(){
  if(!idb) return;
  const meta={v:1,cur:S.cur,tab:S.tab,zoom:S.zoom,loupe:S.loupe,order:S.photos.map(p=>p.id),photos:{}};
  S.photos.forEach(p=>meta.photos[p.id]={name:p.name,w:p.src.width,h:p.src.height,crop:p.crop,aspect:p.aspect,adj:p.adj,fx:p.fx,det:p.det,masks:p.masks,maskSel:p.maskSel,look:p.look});
  try{ await idbPut('meta','session',meta); const s=$('#saveState'); s.classList.remove('off');
    s.textContent='Autosaved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  catch(e){ saveFailed(); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ clearTimeout(saveT); saveSession(); } });
window.addEventListener('pagehide',()=>{ clearTimeout(saveT); saveSession(); });
async function decodeBlob(b){
  if(window.createImageBitmap){ try{ return await createImageBitmap(b); }catch(e){} }
  const url=URL.createObjectURL(b); try{ const im=new Image(); im.src=url; await im.decode(); return im; } finally{ URL.revokeObjectURL(url); }
}
async function restore(){
  idb=await idbOpen(); if(!idb) return false;
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{}); }catch(e){}
  let meta=null; try{ meta=await idbGet('meta','session'); }catch(e){ return false; }
  if(!meta||!Array.isArray(meta.order)) return false;
  for(const id of meta.order){
    const s=meta.photos&&meta.photos[id]; if(!s) continue;
    let blob=null; try{ blob=await idbGet('blobs',id); }catch(e){}
    if(!blob) continue;
    try{
      const im=await decodeBlob(blob), w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
      const p=addPhoto(im,w,h,s.name||'Photo',{id,store:false}), k=p.src.width/(s.w||p.src.width);
      if(s.crop) p.crop={x:s.crop.x*k,y:s.crop.y*k,w:s.crop.w*k,h:s.crop.h*k};
      p.aspect=s.aspect||'orig'; p.adj={...ADJ0,...s.adj}; p.fx={...FX0,...s.fx}; p.det={...DET0,...s.det}; p.look=s.look||'Original';
      if(Array.isArray(s.masks)){ p.masks=s.masks.filter(m=>m&&m.g&&['radial','linear','brush','subject'].includes(m.type)).map(m=>({...m,adj:{...LADJ0,...m.adj},amount:m.amount??100,
          g:m.type==='brush'?{strokes:Array.isArray(m.g.strokes)?m.g.strokes:[]}:m.type==='subject'?{polys:Array.isArray(m.g.polys)?m.g.polys:[],feather:m.g.feather??20,refine:m.g.refine!==false,strokes:Array.isArray(m.g.strokes)?m.g.strokes:[]}:m.g}));
        p.maskSel=p.masks.some(m=>m.id===s.maskSel)?s.maskSel:null; }
      if(im.close) im.close();
    }catch(e){}
  }
  try{ const keep=new Set(S.photos.map(p=>p.id)); for(const k of await idbKeys('blobs')) if(!keep.has(k)) idbDel('blobs',k).catch(()=>{}); }catch(e){}
  S.cur=clamp(meta.cur|0,0,Math.max(0,S.photos.length-1));
  if(TABS.includes(meta.tab)) S.tab=meta.tab;
  if(meta.zoom==='fit'||meta.zoom==='100') S.zoom=meta.zoom;
  if(meta.loupe) S.loupe={x:clamp(+meta.loupe.x||.5,0,1),y:clamp(+meta.loupe.y||.4,0,1)};
  return true;
}

async function boot(){
  const restored=await restore();
  if(!idb) saveFailed();
  if(restored){
    buildStrip(); setTab(S.tab); await loadFont(); requestRender(true);
    toast(S.photos.length?`Welcome back. Restored ${S.photos.length} photo${S.photos.length>1?'s':''} with your edits.`:'Welcome back. Add photos to start a new set.',4200);
    return;
  }
  const a=sample(318,{top:'#14102a',mid:'#3a1748',bottom:'#120c1c',glow:'rgba(255,120,190,.55)',dots:['255,170,210','255,255,255','190,160,255'],stick:'255,150,200'},1600,2000);
  const b=sample(77,{top:'#071a2e',mid:'#0e3355',bottom:'#08111c',glow:'rgba(120,200,255,.5)',dots:['160,220,255','255,255,255','255,230,170'],stick:'140,210,255'},2000,1500);
  const p1=addPhoto(a,a.width,a.height,'Sample · stage pink'); p1.det.sharpen=40; setAspect(p1,'4:5'); applyPreset(p1,PRESETS[3]);
  const p2=addPhoto(b,b.width,b.height,'Sample · stage blue'); setAspect(p2,'3:2'); applyPreset(p2,PRESETS[8]);
  setTab('colour'); buildStrip(); loadFont().then(()=>requestRender(true));
  toast('Two sample photos are loaded. Add your own with + Add photos.',4200);
}
boot();
})();
